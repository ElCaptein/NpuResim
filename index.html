<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Command Center</title>
    <style>
        :root { --neon: #00ff9d; --glass: rgba(0, 0, 0, 0.85); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* YÜZER KOMUT MENÜSÜ */
        #menu-btn { position: absolute; top: 20px; right: 20px; z-index: 200; background: var(--neon); border: none; padding: 12px; border-radius: 10px; font-weight: bold; }
        
        #command-panel {
            position: absolute; top: 70px; right: 20px; width: 280px; 
            background: var(--glass); border: 1px solid var(--neon); border-radius: 15px;
            padding: 20px; display: none; z-index: 200; color: white;
            max-height: 80vh; overflow-y: auto;
        }

        .menu-section { margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        label { display: block; font-size: 12px; color: var(--neon); margin-bottom: 8px; }
        select, input { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 8px; border-radius: 5px; margin-bottom: 10px; }

        /* DURUM PANELİ */
        .status-hud { position: absolute; top: 20px; left: 20px; z-index: 100; }
        .log-item { background: rgba(0,0,0,0.5); font-size: 11px; padding: 4px 10px; border-radius: 5px; margin-bottom: 5px; border-left: 3px solid var(--neon); }

        /* EYLEM BUTONLARI (SOL TARAF) */
        .side-actions { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; }
        .action-circle { width: 55px; height: 55px; border-radius: 50%; border: 2px solid var(--neon); background: var(--glass); color: white; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
</head>
<body>

    <button id="menuMenu">KOMUT MENÜSÜ</button>

    <div id="command-panel">
        <div class="menu-section">
            <label>NESNE SEÇ (KÜTÜPHANE)</label>
            <select id="targetObj">
                <option value="all">TÜMÜNÜ TANI</option>
                <option value="person">İNSAN</option>
                <option value="cell phone">TELEFON</option>
                <option value="socks">ÇORAP (Deneysel)</option>
                <option value="bottle">ŞİŞE</option>
                <option value="backpack">ÇANTA</option>
            </select>
        </div>

        <div class="menu-section">
            <label>DOĞRULUK EŞİĞİ (%)</label>
            <input type="range" id="confRange" min="10" max="95" value="45">
            <span id="confVal">%45</span>
        </div>

        <div class="menu-section">
            <label>OTOMATİK AKSİYON</label>
            <select id="autoAction">
                <option value="none">YOK</option>
                <option value="count">NESNELERİ SAY</option>
                <option value="sound">BİP SESİ ÇIKAR</option>
                <option value="save_loc">KONUMU HATIRLA</option>
            </select>
        </div>

        <button id="closeMenu" style="width:100%; background:var(--neon); border:none; padding:10px; border-radius:5px; font-weight:bold;">UYGULA</button>
    </div>

    <div id="container">
        <div class="status-hud">
            <div class="log-item" id="log-info">SİSTEM: BEKLEMEDE</div>
            <div class="log-item" id="count-info">SAYIM: 0</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div class="side-actions">
            <div class="action-circle" id="captureBtn">📸</div>
            <div class="action-circle" id="flipBtn">🔄</div>
            <div class="action-circle" id="locBtn" title="Konum Sabitle">📍</div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const menuBtn = document.getElementById('menuMenu');
        const panel = document.getElementById('command-panel');
        const confRange = document.getElementById('confRange');
        const confVal = document.getElementById('confVal');
        
        let objectDetector;
        let lastVideoTime = -1;
        let savedLocations = []; // Mekansal hafıza için
        let currentFacingMode = "environment";
        let scoreThreshold = 0.45;

        // Ses dosyası (Bip efekti için)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: "GPU"
                },
                scoreThreshold: scoreThreshold,
                runningMode: "VIDEO"
            });
            document.getElementById('log-info').innerText = "SİSTEM: AKTİF (NPU)";
            startStream();
        }

        async function startStream() {
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: 1280, height: 720 }
            });
            video.srcObject = stream;
            video.onloadeddata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                predict();
            };
        }

        // --- MENÜ KONTROLLERİ ---
        menuBtn.onclick = () => panel.style.display = "block";
        document.getElementById('closeMenu').onclick = () => {
            panel.style.display = "none";
            scoreThreshold = confRange.value / 100;
            // Modeli yeni eşik ile güncelle (Opsiyonel: Yeniden oluşturmak daha güvenli)
            init(); 
        };
        confRange.oninput = () => confVal.innerText = `%${confRange.value}`;

        // --- ANALİZ VE AKSİYON ---
        async function predict() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const result = objectDetector.detectForVideo(video, performance.now());
                processDetections(result.detections);
            }
            window.requestAnimationFrame(predict);
        }

        function processDetections(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const target = document.getElementById('targetObj').value;
            const action = document.getElementById('autoAction').value;
            
            let filtered = detections;
            if (target !== 'all') {
                filtered = detections.filter(d => d.categories[0].categoryName === target);
            }

            document.getElementById('count-info').innerText = `SAYIM: ${filtered.length}`;

            // Aksiyon: Ses Çıkar
            if (action === 'sound' && filtered.length > 0) playBeep();

            filtered.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                
                // Kutu Çizimi
                ctx.strokeStyle = "#00ff9d";
                ctx.lineWidth = 4;
                ctx.strokeRect(originX, originY, width, height);
                
                ctx.fillStyle = "#00ff9d";
                ctx.fillText(det.categories[0].categoryName.toUpperCase(), originX, originY - 10);
            });

            // Mekansal Hafıza Çizimi (Cihaz dönse bile kutu hayali olarak orada kalır - Basit simülasyon)
            savedLocations.forEach(loc => {
                ctx.strokeStyle = "red";
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(loc.x, loc.y, loc.w, loc.h);
                ctx.fillText("KAYITLI KONUM", loc.x, loc.y - 10);
                ctx.setLineDash([]);
            });
        }

        // --- ÖZEL FONKSİYONLAR ---
        function playBeep() {
            const osc = audioCtx.createOscillator();
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        document.getElementById('locBtn').onclick = () => {
            // Mevcut tespitleri hafızaya al
            savedLocations = currentDetections.map(d => ({
                x: d.boundingBox.originX, y: d.boundingBox.originY,
                w: d.boundingBox.width, h: d.boundingBox.height
            }));
            alert("Nesne konumları hafızaya alındı!");
        };

        document.getElementById('flipBtn').onclick = () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startStream();
        };

        init();
    </script>
</body>
</html>
