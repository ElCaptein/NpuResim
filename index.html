<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision ULTIMATE PRO v9.2</title>
    <style>
        :root {
            --neon: #00ff9d; --bg: rgba(8,8,8,0.97); --accent: #ff2244;
            --blue: #00e5ff; --gold: #ffd700; --purple: #bf5fff;
        }
        *, *::before, *::after { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: #fff; }

        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: auto; }

        /* HUD */
        .hud-top {
            position: absolute; top: 10px; left: 10px; z-index: 500;
            display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none;
            width: calc(100% - 20px);
        }
        .chip {
            background: rgba(0,0,0,0.82); border: 1px solid var(--neon);
            padding: 3px 7px; border-radius: 3px; font-size: 10px;
            font-weight: 700; color: var(--neon); text-transform: uppercase;
        }
        .chip-blue  { border-color: var(--blue);   color: var(--blue); }
        .chip-white { border-color: #555;           color: #ddd; }
        .chip-gold  { border-color: var(--gold);    color: var(--gold); }
        .chip-red   { border-color: var(--accent);  color: var(--accent); }
        .chip-purple{ border-color: var(--purple);  color: var(--purple); }
        .chip-yellow{ border-color: #ffcc00;        color: #ffcc00; }
        .row-break  { flex-basis: 100%; height: 0; }

        /* PANEL */
        #control-panel {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 95%; max-width: 530px;
            background: var(--bg); border: 1px solid #2a2a2a; border-radius: 14px;
            backdrop-filter: blur(24px); display: flex; flex-direction: column; overflow: hidden;
        }
        .panel-header {
            padding: 10px 15px; background: #050505; border-bottom: 1px solid #1a1a1a;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; font-size: 11px; font-weight: 700; color: var(--neon);
        }
        .panel-content { padding: 10px; display: flex; flex-direction: column; gap: 7px; max-height: 70vh; overflow-y: auto; }
        .sec { font-size: 9px; color: var(--blue); font-weight: 700; margin-top: 2px; text-transform: uppercase; border-bottom: 1px solid #1c1c1c; padding-bottom: 3px; }
        label { font-size: 9px; color: #777; margin-bottom: 2px; }
        select, input[type="range"] { width: 100%; padding: 6px; background: #111; border: 1px solid #2c2c2c; color: #eee; border-radius: 4px; font-size: 10px; outline: none; }

        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .act-btn {
            background: #141414; color: #bbb; border: 1px solid #333;
            cursor: pointer; font-size: 10px; height: 34px; border-radius: 5px; transition: all .15s;
        }
        .act-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,157,.06); }
        
        .hw-grid { display: grid; grid-template-columns: repeat(5,1fr); gap: 4px; }
        .hw-btn { background: #141414; color: #999; border: 1px solid #2a2a2a; border-radius: 5px; cursor: pointer; font-size: 9px; padding: 6px 2px; }
        .hw-btn.hw-sel { border-color: var(--blue); color: var(--blue); background: rgba(0,229,255,.07); }

        .primary-btn { background: var(--neon); color: #000; font-weight: 800; border: none; cursor: pointer; padding: 11px; font-size: 11px; border-radius: 5px; margin-top: 5px; }
        .danger-btn { background: #111; color: #ff5555; border: 1px solid #2a2a2a; cursor: pointer; padding: 6px; font-size: 9px; border-radius: 4px; }

        .model-info { font-size: 8px; color: #5a5a5a; margin-top: 3px; padding: 4px; background: #090909; border-left: 2px solid var(--blue); }

        #load-overlay {
            position: absolute; inset: 0; background: #000; z-index: 3000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .spin { width: 42px; height: 42px; border: 3px solid #111; border-top-color: var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #unique-badge {
            position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
            z-index: 600; display: none; flex-direction: column; align-items: flex-end; gap: 4px;
        }
        .ubadge { background: rgba(0,0,0,.88); border: 1px solid var(--purple); color: var(--purple); font-size: 9px; padding: 3px 8px; border-radius: 3px; }
    </style>
</head>
<body>

<div id="load-overlay">
    <div class="spin"></div>
    <div id="load-status" style="color:var(--neon); margin-top:15px; font-size:12px; text-align:center;">SİSTEM BAŞLATILIYOR...</div>
</div>

<button id="dynamic-save-btn" style="position:absolute;top:120px;left:50%;transform:translateX(-50%);z-index:1500;background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:20px;font-weight:700;display:none;cursor:pointer;font-size:11px;">📍 KONUMU KAYDET</button>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="output"></canvas>

<div class="hud-top">
    <div id="hw-tag" class="chip">HW: --</div>
    <div id="fps-tag" class="chip chip-blue">FPS: 0</div>
    <div id="res-tag" class="chip chip-white">--</div>
    <div id="model-tag" class="chip chip-gold">MODEL: --</div>
    <div id="target-tag" class="chip chip-red" style="display:none">HEDEF: YOK</div>
    <div class="row-break"></div>
    <div id="cur-tag" class="chip chip-yellow">ANLİK: 0</div>
    <div id="uniq-tag" class="chip chip-purple">BENZERSİZ: 0</div>
</div>

<div id="unique-badge"></div>

<div id="control-panel">
    <div class="panel-header" onclick="togglePanel()">
        <span>⚙️ AI VISION V9.2 PRO · ULTIMATE</span>
        <span id="toggle-icon">▼</span>
    </div>
    <div class="panel-content" id="p-content">
        <div class="sec">Aksiyonlar</div>
        <div class="grid2">
            <button class="act-btn" id="btn-select" onclick="toggleMode('select')">🎯 HEDEF SEÇ</button>
            <button class="act-btn" id="btn-count" onclick="toggleMode('count')">🔢 SAYICI</button>
            <button class="act-btn" id="btn-sensors" onclick="toggleMode('sensors')">🧭 JİROSKOP</button>
            <button class="act-btn" id="btn-pin" onclick="toggleMode('pin')">📍 KAYDEDİCİ</button>
        </div>

        <div class="sec">⚡ Donanım Modu</div>
        <div class="hw-grid">
            <button class="hw-btn" id="hw-CPU" onclick="selectHW('CPU')">CPU</button>
            <button class="hw-btn hw-sel" id="hw-GPU" onclick="selectHW('GPU')">GPU</button>
            <button class="hw-btn" id="hw-NPU" onclick="selectHW('NPU')">NPU</button>
        </div>

        <div class="sec">Hassasiyet</div>
        <div class="grid2">
            <div><label>EŞİK (%)</label><input type="range" id="confSlider" min="5" max="95" value="40"></div>
            <div><label>TAKİP (px)</label><input type="range" id="sensSlider" min="10" max="400" value="100"></div>
        </div>

        <div class="sec">🤖 Model Seçimi</div>
        <select id="modelSel">
            <optgroup label="SSD MobileNet V2">
                <option value="ssd_f32">SSD V2 · Float32 (En Hızlı)</option>
                <option value="ssd_int8">SSD V2 · INT8</option>
            </optgroup>
            <optgroup label="EfficientDet Lite">
                <option value="edet0_f16">Lite 0 · F16</option>
                <option value="edet1_f16" selected>Lite 1 · F16 (Dengeli)</option>
                <option value="edet2_f16">Lite 2 · F16</option>
                <option value="edet3_f16">Lite 3 · F16</option>
            </optgroup>
        </select>

        <div class="sec">Kamera & Çözünürlük</div>
        <div class="grid2">
            <select id="resSel">
                <option value="480">480p</option>
                <option value="720" selected>720p HD</option>
                <option value="1080">1080p FHD</option>
            </select>
            <select id="camSel"></select>
        </div>

        <div class="grid2">
            <button class="danger-btn" onclick="resetCounter()">🔄 SIFIRLA</button>
            <button class="danger-btn" onclick="location.reload()">⚠ YENİLE</button>
        </div>
        <button class="primary-btn" onclick="applySettings()">AYARLARI UYGULA VE BAŞLAT</button>
    </div>
</div>

<script type="module">
import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/vision_bundle.mjs";

const video = document.getElementById('webcam');
const canvas = document.getElementById('output');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('load-overlay');
const loadStatus = document.getElementById('load-status');

let detector, isRunning = false, vision = null;
let lastDetections = [];
let sensorData = { alpha: 0, beta: 0 };
let modes = { select: false, count: false, pin: false, sensors: true };
let selectedObjectLabel = null;
let savedPins = [];

// Gelişmiş ID ve Sayım Sistemi
let nextId = 1;
let trackedObjects = []; // { id, label, box, cx, cy, lastSeen, color }
let perClassCount = new Map();
let totalUniqueCount = 0;

const TR = {"person":"İnsan","bicycle":"Bisiklet","car":"Araba","motorcycle":"Motosiklet","dog":"Köpek","cat":"Kedi","bottle":"Şişe","cell phone":"Telefon","chair":"Sandalye","laptop":"Dizüstü","tv":"Televizyon"};
const COLORS = ["#00ff9d","#00e5ff","#ffd700","#ff2244","#bf5fff","#ff8800","#ffffff"];

let selectedHW = "GPU";
window.selectHW = (hw) => {
    selectedHW = hw;
    document.querySelectorAll('.hw-btn').forEach(b => b.classList.remove('hw-sel'));
    document.getElementById(`hw-${hw}`).classList.add('hw-sel');
};

function getIoU(b1, b2) {
    const xA = Math.max(b1.originX, b2.originX), yA = Math.max(b1.originY, b2.originY);
    const xB = Math.min(b1.originX + b1.width, b2.originX + b2.width), yB = Math.min(b1.originY + b1.height, b2.originY + b2.height);
    const inter = Math.max(0, xB - xA) * Math.max(0, yB - yA);
    return inter / (b1.width * b1.height + b2.width * b2.height - inter);
}

window.togglePanel = () => {
    const p = document.getElementById('p-content');
    p.style.display = p.style.display === 'none' ? 'flex' : 'none';
};

window.toggleMode = (m) => {
    modes[m] = !modes[m];
    document.getElementById(`btn-${m}`).classList.toggle('active', modes[m]);
    if(m === 'pin') document.getElementById('dynamic-save-btn').style.display = modes[m] ? 'block' : 'none';
    if(m === 'count') document.getElementById('unique-badge').style.display = modes[m] ? 'flex' : 'none';
};

window.resetCounter = () => {
    totalUniqueCount = 0; perClassCount.clear(); trackedObjects = [];
    document.getElementById('uniq-tag').innerText = "BENZERSİZ: 0";
    document.getElementById('unique-badge').innerHTML = "";
};

async function start() {
    const devs = await navigator.mediaDevices.enumerateDevices();
    const sel = document.getElementById('camSel');
    devs.filter(d => d.kind === 'videoinput').forEach(d => {
        const o = document.createElement('option'); o.value = d.deviceId; o.text = d.label || 'Kamera'; sel.appendChild(o);
    });
    applySettings();
}

window.applySettings = async () => {
    isRunning = false; overlay.style.display = 'flex';
    if(detector) detector.close();

    const modelUrls = {
        ssd_f32: "https://storage.googleapis.com/mediapipe-models/object_detector/mobilenetv2_ssd/float32/1/mobilenetv2_ssd.tflite",
        ssd_int8: "https://storage.googleapis.com/mediapipe-models/object_detector/mobilenetv2_ssd/int8/1/mobilenetv2_ssd.tflite",
        edet0_f16: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
        edet1_f16: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite1/float16/1/efficientdet_lite1.tflite",
        edet2_f16: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
        edet3_f16: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite3/float16/1/efficientdet_lite3.tflite"
    };

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { deviceId: document.getElementById('camSel').value, height: document.getElementById('resSel').value } 
        });
        video.srcObject = stream;
        if(!vision) vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm");

        detector = await ObjectDetector.createFromOptions(vision, {
            baseOptions: { modelAssetPath: modelUrls[document.getElementById('modelSel').value], delegate: selectedHW === "CPU" ? "CPU" : "GPU" },
            scoreThreshold: document.getElementById('confSlider').value / 100,
            runningMode: "VIDEO"
        });

        video.onloadedmetadata = () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            document.getElementById('res-tag').innerText = `${canvas.width}x${canvas.height}`;
            document.getElementById('hw-tag').innerText = "HW: " + selectedHW;
            overlay.style.display = 'none'; isRunning = true;
            requestAnimationFrame(loop);
        };
    } catch(e) { loadStatus.innerText = "HATA: " + e.message; }
};

function loop(now) {
    if(!isRunning) return;
    const res = detector.detectForVideo(video, now);
    lastDetections = res.detections;
    
    updateTracking(lastDetections, now);
    draw(now);
    requestAnimationFrame(loop);
}

function updateTracking(detections, now) {
    const trackR = parseInt(document.getElementById('sensSlider').value);
    const toTrack = selectedObjectLabel ? detections.filter(d => d.categories[0].categoryName === selectedObjectLabel) : detections;

    toTrack.forEach(det => {
        const box = det.boundingBox;
        const lbl = det.categories[0].categoryName;
        const cx = box.originX + box.width/2, cy = box.originY + box.height/2;

        let best = null, minD = trackR;
        trackedObjects.forEach(obj => {
            if(obj.label !== lbl) return;
            const d = Math.hypot(cx - obj.cx, cy - obj.cy);
            const iou = getIoU(box, obj.box);
            if((d < minD || iou > 0.3)) { best = obj; minD = d; }
        });

        if(best) {
            best.box = box; best.cx = cx; best.cy = cy; best.lastSeen = now;
        } else if (modes.count) {
            const id = nextId++;
            trackedObjects.push({ id, label: lbl, box, cx, cy, lastSeen: now, color: COLORS[id % COLORS.length] });
            totalUniqueCount++;
            perClassCount.set(lbl, (perClassCount.get(lbl) || 0) + 1);
        }
    });

    trackedObjects = trackedObjects.filter(o => now - o.lastSeen < 1500);
    document.getElementById('cur-tag').innerText = `ANLİK: ${toTrack.length}`;
    document.getElementById('uniq-tag').innerText = `BENZERSİZ: ${totalUniqueCount}`;
    
    const b = document.getElementById('unique-badge'); b.innerHTML = "";
    perClassCount.forEach((v, k) => {
        const d = document.createElement('div'); d.className = 'ubadge'; d.innerHTML = `${TR[k]||k}: ${v}`; b.appendChild(d);
    });
}

function draw(now) {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    
    trackedObjects.forEach(obj => {
        const isTarget = selectedObjectLabel === obj.label;
        ctx.strokeStyle = isTarget ? "#ff2244" : obj.color;
        ctx.lineWidth = isTarget ? 4 : 2;
        ctx.strokeRect(obj.box.originX, obj.box.originY, obj.box.width, obj.box.height);
        
        ctx.fillStyle = ctx.strokeStyle;
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(`ID:${obj.id} ${TR[obj.label]||obj.label}`, obj.box.originX, obj.box.originY - 5);
    });
}

canvas.addEventListener('click', (e) => {
    if(!modes.select) return;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width/rect.width), y = (e.clientY - rect.top) * (canvas.height/rect.height);
    lastDetections.forEach(d => {
        const b = d.boundingBox;
        if(x > b.originX && x < b.originX+b.width && y > b.originY && y < b.originY+b.height) {
            selectedObjectLabel = d.categories[0].categoryName;
            document.getElementById('target-tag').innerText = "HEDEF: " + (TR[selectedObjectLabel]||selectedObjectLabel).toUpperCase();
            document.getElementById('target-tag').style.display = "block";
        }
    });
});

window.addEventListener('deviceorientation', (e) => { if(modes.sensors) { sensorData.alpha = e.alpha; sensorData.beta = e.beta; }});
start();
</script>
</body>
</html>
