<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision ULTIMATE PRO v4</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(10, 10, 10, 0.98); --accent: #ff3e3e; --blue: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: auto; }

        .hud-top { position: absolute; top: 10px; left: 10px; z-index: 500; display: flex; flex-wrap: wrap; gap: 5px; pointer-events: none; width: calc(100% - 20px); }
        .chip { background: rgba(0,0,0,0.85); border: 1px solid var(--neon); padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; color: var(--neon); text-transform: uppercase; white-space: nowrap; }

        #control-panel {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 95%; max-width: 500px;
            background: var(--bg); border: 1px solid #333; border-radius: 12px; backdrop-filter: blur(20px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }
        
        .panel-header { padding: 10px 15px; background: #000; border-bottom: 1px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; color: var(--neon); }
        .panel-content { padding: 12px; display: flex; flex-direction: column; gap: 8px; max-height: 75vh; overflow-y: auto; }
        
        .section-label { font-size: 9px; color: var(--blue); font-weight: bold; margin: 5px 0 2px 0; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #222; }
        label { font-size: 9px; color: #888; display: block; margin-bottom: 2px; }
        
        select, button, input[type="range"] { width: 100%; padding: 8px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 5px; font-size: 11px; outline: none; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .action-btn { background: #222; color: #ccc; border: 1px solid #444; text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 10px; height: 35px; }
        .action-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,157,0.05); }
        
        .primary-btn { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; padding: 12px; font-size: 12px; margin-top: 5px; }
        .danger-btn { background: #1a1a1a; color: #ff3e3e; border: 1px solid #444; font-weight: bold; cursor: pointer; padding: 6px; font-size: 9px; border-radius: 4px; }

        #dynamic-save-btn {
            position: absolute; top: 130px; left: 50%; transform: translateX(-50%); z-index: 1500;
            background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 25px;
            font-weight: bold; display: none; box-shadow: 0 0 20px rgba(255,62,62,0.4); cursor: pointer; font-size: 12px;
        }

        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader-text { color: var(--neon); font-size: 14px; font-weight: bold; letter-spacing: 3px; margin-top: 15px; }
        
        .slider-val { float: right; color: var(--neon); }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="width:50px; height:50px; border:4px solid #111; border-top-color:var(--neon); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <div class="loader-text">SİSTEM ANALİZ EDİLİYOR...<br><span id="load-status" style="font-size: 9px; color: #555; letter-spacing: 1px;">MODÜLLER BAŞLATILIYOR</span></div>
    </div>

    <button id="dynamic-save-btn" onclick="saveCurrentObjectCoords()">📍 KONUMU KAYDET</button>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">HW: --</div>
        <div id="fps-tag" class="chip" style="color:var(--blue); border-color:var(--blue);">FPS: 0</div>
        <div id="count-tag" class="chip" style="color:#ffcc00; border-color:#ffcc00;">ANLIK: 0</div>
        <div id="total-tag" class="chip" style="color:var(--neon); border-color:var(--neon);">TOPLAM: 0</div>
        <div id="res-tag" class="chip" style="color:#fff; border-color:#555;">--</div>
        <div id="target-tag" class="chip" style="color:var(--accent); border-color:var(--accent); display:none;">HEDEF: --</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="togglePanel()">
            <span>⚙️ AI VISION ULTIMATE CONTROL</span>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <div class="section-label">Aksiyon ve Takip</div>
            <div class="action-grid">
                <button class="action-btn" id="btn-select" onclick="toggleMode('select')">🎯 HEDEF KİLİTLE <span id="ind-select">○</span></button>
                <button class="action-btn" id="btn-count" onclick="toggleMode('count')">🔢 NESNE SAYICI <span id="ind-count">OFF</span></button>
                <button class="action-btn" id="btn-pin" onclick="toggleMode('pin')">📍 KONUM KAYDET <span id="ind-pin">OFF</span></button>
                <button class="action-btn" id="btn-sensors" onclick="toggleMode('sensors')">🧭 IMU/JİROSKOP <span id="ind-sensors">ON</span></button>
            </div>
            
            <div style="display: flex; gap: 5px;">
                <button class="action-btn" id="btn-sound" style="flex:1" onclick="toggleMode('sound')">🔊 SESLİ UYARI <span id="ind-sound">OFF</span></button>
                <button class="danger-btn" style="flex:1" onclick="resetCounter()">🔄 SAYACI SIFIRLA</button>
            </div>

            <div class="section-label">Hassasiyet Ayarları</div>
            <div class="action-grid">
                <div>
                    <label>DOĞRULUK EŞİĞİ (%) <span id="conf-val" class="slider-val">45</span></label>
                    <input type="range" id="confSlider" min="10" max="95" value="45" oninput="updateSliderLabels()">
                </div>
                <div>
                    <label>TAKİP HASSASİYETİ <span id="sens-val" class="slider-val">50</span></label>
                    <input type="range" id="sensSlider" min="10" max="200" value="50" oninput="updateSliderLabels()">
                </div>
            </div>

            <div class="section-label">Donanım ve Çözünürlük</div>
            <div class="action-grid">
                <div>
                    <label>DONANIM MODU</label>
                    <select id="hwSel">
                        <option value="GPU">GPU (Yüksek Performans)</option>
                        <option value="CPU">CPU (Düşük Güç)</option>
                        <option value="GPU">NPU (AI İşlemci)</option>
                        <option value="GPU">NPU + GPU (Maksimum)</option>
                        <option value="GPU">GPU + CPU (Hibrit)</option>
                    </select>
                </div>
                <div>
                    <label>ÇÖZÜNÜRLÜK</label>
                    <select id="resSel">
                        <option value="360">360p</option>
                        <option value="480">480p</option>
                        <option value="720" selected>720p (HD)</option>
                        <option value="960">960p</option>
                        <option value="1080">1080p (FHD)</option>
                        <option value="1440">1440p (2K)</option>
                        <option value="2160">2160p (4K)</option>
                    </select>
                </div>
            </div>

            <div class="action-grid">
                <div>
                    <label>AI MODEL TİPİ</label>
                    <select id="modelSel">
                        <option value="0">EfficientDet Lite 0</option>
                        <option value="2" selected>EfficientDet Lite 2</option>
                        <option value="4">EfficientDet Lite 4</option>
                    </select>
                </div>
                <div>
                    <label>AKTİF KAMERA</label>
                    <select id="camSel"></select>
                </div>
            </div>

            <button class="primary-btn" onclick="applySettings()">YENİ AYARLARLA BAŞLAT</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const loadStatus = document.getElementById('load-status');
        const dynamicBtn = document.getElementById('dynamic-save-btn');

        const trLabels = {
            "person": "İnsan", "bicycle": "Bisiklet", "car": "Araba", "motorcycle": "Motor", "airplane": "Uçak",
            "bus": "Otobüs", "train": "Tren", "truck": "Kamyon", "boat": "Tekne", "traffic light": "Lamba",
            "bird": "Kuş", "cat": "Kedi", "dog": "Köpek", "bottle": "Şişe", "cup": "Bardak", "cell phone": "Telefon",
            "laptop": "Dizüstü", "mouse": "Fare", "remote": "Kumanda", "keyboard": "Klavye", "book": "Kitap"
        };

        let detector, isRunning = false, lastTime = performance.now();
        let visionData, sensorData = { alpha: 0, beta: 0 };
        let modes = { select: false, count: false, pin: false, sound: false, sensors: true };
        let selectedObjectLabel = null;
        let totalCount = 0, objectHistory = [], savedPins = [], lastDetections = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (!modes.sound) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 1000; gain.gain.value = 0.02;
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        window.updateSliderLabels = () => {
            document.getElementById('conf-val').innerText = document.getElementById('confSlider').value;
            document.getElementById('sens-val').innerText = document.getElementById('sensSlider').value;
        };

        async function initSensors() {
            if (!modes.sensors) return;
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
            }
            window.addEventListener('deviceorientation', (e) => {
                if(modes.sensors) { sensorData.alpha = e.alpha || 0; sensorData.beta = e.beta || 0; }
            });
        }

        async function getCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    if(d.label.toLowerCase().includes('back')) opt.selected = true;
                    opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
            } catch (e) { loadStatus.innerText = "Kamera erişimi reddedildi."; }
        }

        window.toggleMode = (m) => {
            modes[m] = !modes[m];
            if(m === 'pin' && modes[m]) { initSensors(); dynamicBtn.style.display = 'block'; }
            else if(m === 'pin') dynamicBtn.style.display = 'none';
            
            if(m === 'sensors' && modes[m]) initSensors();
            else if(m === 'sensors') { sensorData.alpha = 0; sensorData.beta = 0; }

            document.getElementById(`btn-${m}`).classList.toggle('active', modes[m]);
            document.getElementById(`ind-${m}`).innerText = modes[m] ? (m === 'select' ? '●' : 'ON') : (m === 'select' ? '○' : 'OFF');
            
            if(m === 'select' && !modes[m]) {
                selectedObjectLabel = null;
                document.getElementById('target-tag').style.display = 'none';
            }
        };

        window.resetCounter = () => {
            totalCount = 0; objectHistory = [];
            document.getElementById('total-tag').innerText = `TOPLAM: 0`;
        };

        window.togglePanel = () => {
            const content = document.getElementById('p-content');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
            document.getElementById('toggle-icon').innerText = content.style.display === 'none' ? '▲' : '▼';
        };

        canvas.addEventListener('click', (e) => {
            if(!modes.select) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            lastDetections.forEach(d => {
                const { originX, originY, width, height } = d.boundingBox;
                if(x > originX && x < originX + width && y > originY && y < originY + height) {
                    selectedObjectLabel = d.categories[0].categoryName;
                    const tag = document.getElementById('target-tag');
                    tag.innerText = `HEDEF: ${trLabels[selectedObjectLabel]?.toUpperCase() || selectedObjectLabel.toUpperCase()}`;
                    tag.style.display = 'block';
                    resetCounter();
                    playBeep();
                }
            });
        });

        window.saveCurrentObjectCoords = () => {
            const target = lastDetections.find(d => !selectedObjectLabel || d.categories[0].categoryName === selectedObjectLabel);
            if(target) {
                const { originX, originY, width, height } = target.boundingBox;
                savedPins.push({ x: originX + width/2, y: originY + height/2, label: target.categories[0].categoryName, a: sensorData.alpha, b: sensorData.beta });
                playBeep();
            }
        };

        window.applySettings = async () => {
            isRunning = false; overlay.style.display = 'flex';
            loadStatus.innerText = "Donanım Yapılandırılıyor...";
            
            const hwMode = document.getElementById('hwSel').value;
            const modelLevel = document.getElementById('modelSel').value;
            const resHeight = parseInt(document.getElementById('resSel').value);
            const confidence = parseInt(document.getElementById('confSlider').value) / 100;
            const deviceId = document.getElementById('camSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: deviceId ? {exact: deviceId} : undefined, facingMode: "environment", height: { ideal: resHeight } } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    document.getElementById('res-tag').innerText = `${video.videoWidth}x${video.videoHeight}`;
                    
                    if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm");
                    
                    detector = await ObjectDetector.createFromOptions(visionData, {
                        baseOptions: { 
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                            delegate: hwMode 
                        },
                        scoreThreshold: confidence, runningMode: "VIDEO"
                    });

                    document.getElementById('hw-tag').innerText = `HW: ${document.getElementById('hwSel').options[document.getElementById('hwSel').selectedIndex].text.split(' ')[0]}`;
                    overlay.style.display = 'none'; isRunning = true; renderLoop();
                };
            } catch (e) { alert("Hata: " + e.message); overlay.style.display = 'none'; }
        };

        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime); lastTime = now;
            if(now % 50 < 10) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                lastDetections = result.detections;
                
                const activeDetections = selectedObjectLabel 
                    ? lastDetections.filter(d => d.categories[0].categoryName === selectedObjectLabel)
                    : lastDetections;

                if(modes.count) {
                    const trackingSens = parseInt(document.getElementById('sensSlider').value);
                    activeDetections.forEach(det => {
                        const { originX, originY, width, height } = det.boundingBox;
                        const cX = originX + width/2, cY = originY + height/2;
                        const label = det.categories[0].categoryName;

                        let found = objectHistory.findIndex(obj => {
                            const dist = Math.sqrt(Math.pow(cX - obj.x, 2) + Math.pow(cY - obj.y, 2));
                            return dist < trackingSens && obj.label === label;
                        });

                        if(found !== -1) { objectHistory[found].x = cX; objectHistory[found].y = cY; objectHistory[found].t = now; }
                        else { totalCount++; objectHistory.push({ x: cX, y: cY, label: label, t: now }); playBeep(); }
                    });
                    objectHistory = objectHistory.filter(obj => now - obj.t < 1200);
                    document.getElementById('count-tag').innerText = `ANLIK: ${activeDetections.length}`;
                    document.getElementById('total-tag').innerText = `TOPLAM: ${totalCount}`;
                }
                draw(activeDetections);
            } catch (err) {}
            requestAnimationFrame(renderLoop);
        }

        function draw(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            savedPins.forEach(p => {
                const xOff = modes.sensors ? (sensorData.alpha - p.a) * (canvas.width / 50) : 0;
                const yOff = modes.sensors ? (sensorData.beta - p.b) * (canvas.height / 50) : 0;
                ctx.fillStyle = "var(--accent)"; ctx.beginPath(); ctx.arc(p.x + xOff, p.y + yOff, 6, 0, 7); ctx.fill();
            });

            detections.forEach((d) => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                const score = Math.round(d.categories[0].score * 100);

                ctx.strokeStyle = (label === selectedObjectLabel) ? "var(--accent)" : "var(--neon)";
                ctx.lineWidth = (label === selectedObjectLabel) ? 4 : 2; 
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "rgba(0,0,0,0.6)";
                ctx.fillRect(originX, originY - 18, 70, 18);
                ctx.fillStyle = "#fff"; ctx.font = "bold 10px sans-serif";
                ctx.fillText(`%${score} ${trLabels[label] || label}`, originX + 4, originY - 5);
            });
        }

        getCameras().then(() => applySettings());
        updateSliderLabels();
    </script>
</body>
</html>
