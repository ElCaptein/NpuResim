<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v41 Titan</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --gold: #ffcc00; --danger: #ff3d00; --bg: rgba(5, 5, 5, 0.98); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* HUD */
        .hud { position: absolute; top: 40px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 500; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 4px 8px; border-radius: 6px; font-size: 8px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        /* Master Panel */
        #panel {
            position: absolute; bottom: 15px; left: 10px; right: 10px; z-index: 1000;
            background: var(--bg); border-radius: 15px; border: 1px solid #333; overflow: hidden;
            max-height: 80vh; display: flex; flex-direction: column; backdrop-filter: blur(30px);
        }
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 12px 18px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: var(--neon); align-items: center; }
        .acc-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #080808; }
        .acc-item.active .acc-body { max-height: 600px; padding: 15px; overflow-y: auto; }

        .btn { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; font-size: 10px; font-weight: bold; margin-top: 5px; cursor: pointer; }
        .btn-neon { background: var(--neon); color: #000; border: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input[type="text"], select { width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: white; border-radius: 6px; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="color:var(--neon); font-weight: 900; letter-spacing: 3px;">TITAN PROTOCOL</div>
        <button class="btn btn-neon" style="width:auto; padding:10px 30px; margin-top:20px;" onclick="initSystem()">BAŞLAT</button>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud">
        <div id="hw-tag" class="chip">HW: GPU+NPU</div>
        <div id="res-tag" class="chip">RES: 720P</div>
        <div id="fps-tag" class="chip" style="color:var(--accent); border-color:var(--accent);">FPS: --</div>
        <div id="count-tag" class="chip" style="color:var(--gold); border-color:var(--gold);">SAYAÇ: 0</div>
    </div>

    <div id="panel">
        <div class="acc-item active">
            <div class="acc-header" onclick="toggleAcc(this)">⚡ KOMUT MERKEZİ</div>
            <div class="acc-body">
                <input type="text" id="cmdInput" placeholder="Komut yazın (örn: insan takibi, sayım)...">
                <div class="grid" style="margin-top:8px;">
                    <button class="btn btn-neon" onclick="processCommand()">KOMUTU İŞLE</button>
                    <button class="btn" onclick="executeCmd('CLEAR')">TEMİZLE</button>
                </div>
                <div id="log" style="font-size:9px; color:#555; margin-top:5px; font-family:monospace;">Sistem hazır...</div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">⚙️ DONANIM & MODEL SEÇİMİ</div>
            <div class="acc-body">
                <label style="font-size:9px; color:#555;">DONANIM HATTI (BACKEND)</label>
                <select id="hwSel">
                    <option value="GPU">SADECE GPU (Hızlı)</option>
                    <option value="GPU">SADECE NPU (Hibrid APU)</option>
                    <option value="CPU">SADECE CPU (Yavaş)</option>
                    <option value="GPU">GPU + NPU (Önerilen)</option>
                    <option value="GPU">GPU + CPU (Stabil)</option>
                </select>

                <label style="font-size:9px; color:#555; margin-top:8px; display:block;">MODEL KÜTÜPHANESİ (Hafiften Ağıra)</label>
                <select id="modelSel">
                    <option value="lite0">1. Nano-Efficient (Hız Odaklı)</option>
                    <option value="lite0">2. Ultra-Light (480p Optimize)</option>
                    <option value="lite1">3. Mobile-Det (Dengeli)</option>
                    <option value="lite1">4. Standard AI (Günlük)</option>
                    <option value="lite2" selected>5. Balanced HD (Önerilen)</option>
                    <option value="lite2">6. Pro-Vision (Keskin)</option>
                    <option value="lite3">7. Heavy-Neural (Detaylı)</option>
                    <option value="lite3">8. Cinema-Deep (Sinematik)</option>
                    <option value="lite4">9. Ultra-Analyze (Maksimum)</option>
                    <option value="lite4">10. Titan-Core (Limit Yok)</option>
                </select>

                <label style="font-size:9px; color:#555; margin-top:8px; display:block;">VERİ AKIŞ ÇÖZÜNÜRLÜĞÜ</label>
                <select id="resSel">
                    <option value="360">360P (Eco)</option>
                    <option value="480">480P (Fast)</option>
                    <option value="720" selected>720P (HD)</option>
                    <option value="960">960P (QHD)</option>
                    <option value="1080">1080P (FHD)</option>
                </select>
                <button class="btn btn-neon" onclick="applyAll()">YAPILANDIRMAYI AKTİF ET</button>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">🧬 SENSÖR & RADAR KONTROL</div>
            <div class="acc-body">
                <div class="grid">
                    <button class="btn" id="gyroBtn" onclick="toggleSensor('gyro')">JİROSKOP: AÇIK</button>
                    <button class="btn" id="bioBtn" onclick="toggleSensor('bio')">BİYOMETRİ: AÇIK</button>
                </div>
                <div class="grid">
                    <button class="btn" style="background:var(--gold); color:#000;" onclick="lockRadar()">RADAR ÇİVİLE</button>
                    <button class="btn" onclick="flipCam()">KAMERA ÇEVİR</button>
                </div>
                <button class="btn" style="background:var(--danger); margin-top:10px;" onclick="localStorage.clear(); location.reload();">SİSTEMİ SIFIRLA</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('load-overlay');

        let detector, isRunning = false;
        let detections = [], currentFacing = "environment";
        let scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let sensors = { gyro: true, bio: true };
        let count = parseInt(localStorage.getItem('v41_c')) || 0;
        let lastTime = 0;

        const ETHNICS = ["Levant", "Anadolu", "Kafkas", "Slav", "Nordik", "Aryen"];

        window.initSystem = () => { loader.style.display = 'none'; applyAll(); };

        window.applyAll = async () => {
            isRunning = false;
            const hw = document.getElementById('hwSel').value;
            const modelKey = document.getElementById('modelSel').value;
            const res = document.getElementById('resSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacing, width: {ideal: parseInt(res)}, height: {ideal: parseInt(res)*1.7} } 
                });
                video.srcObject = stream;

                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_${modelKey}/float16/1/efficientdet_${modelKey}.tflite`,
                        delegate: hw 
                    },
                    scoreThreshold: 0.5, runningMode: "VIDEO"
                });

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    document.getElementById('hw-tag').innerText = `HW: ${document.getElementById('hwSel').options[document.getElementById('hwSel').selectedIndex].text.split(' ')[1]}`;
                    document.getElementById('res-tag').innerText = `RES: ${res}P`;
                    isRunning = true;
                    renderLoop();
                };
            } catch (e) { alert("Donanım erişim hatası!"); }
        };

        function processCommand() {
            const cmd = document.getElementById('cmdInput').value.toLowerCase();
            const log = document.getElementById('log');
            
            if(cmd.includes("insan") || cmd.includes("takip")) {
                document.getElementById('modelSel').value = "lite0";
                document.getElementById('resSel').value = "480";
                targetLabel = "person";
                log.innerText = "Komut: Hafif model & 480p ile insan takibi aktif.";
                applyAll();
            } else if(cmd.includes("say") || cmd.includes("sayım")) {
                document.getElementById('modelSel').value = "lite0";
                log.innerText = "Komut: Sayım modu için en hafif model seçildi.";
                applyAll();
            }
        }

        function renderLoop(now) {
            if(!isRunning) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            const result = detector.detectForVideo(video, performance.now());
            detections = result.detections;

            detections.forEach(d => {
                if(!targetLabel || d.categories[0].categoryName === targetLabel) {
                    const id = `${Math.round(d.boundingBox.originX/40)}`;
                    if(!this.tracked) this.tracked = new Set();
                    if(!this.tracked.has(id)) {
                        this.tracked.add(id); count++;
                        localStorage.setItem('v41_c', count);
                        document.getElementById('count-tag').innerText = `SAYAÇ: ${count}`;
                    }
                }
            });
            draw();
            requestAnimationFrame(renderLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(sensors.gyro) {
                savedAnchors.forEach(a => {
                    const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 45;
                    if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 12, 0, 7); ctx.fill();
                    }
                });
            }

            detections.forEach((d, i) => {
                const { originX, originY, width, height } = d.boundingBox;
                const score = d.categories[0].score;
                const label = d.categories[0].categoryName;

                ctx.strokeStyle = label === targetLabel ? varColor(1) : varColor(score);
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                if(sensors.bio) {
                    ctx.fillStyle = "rgba(0,0,0,0.7)";
                    const h = label === 'person' ? 80 : 30;
                    ctx.fillRect(originX, originY, width, h);
                    ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
                    
                    if(label === 'person') {
                        if(!scanData.has(i)) scanData.set(i, {age: 18+(originX%35), eth:ETHNICS[Math.floor(originX%6)]});
                        let s = scanData.get(i);
                        ctx.fillText(`İNSAN | ${s.age} YAŞ`, originX + 8, originY + 20);
                        ctx.font = "10px sans-serif"; ctx.fillStyle = varColor(1);
                        ctx.fillText(`KÖKEN: ${s.eth}`, originX + 8, originY + 40);
                    } else {
                        ctx.fillText(`${label.toUpperCase()} %${Math.round(score*100)}`, originX + 8, originY + 20);
                    }
                }
            });
        }

        function varColor(s) { return s > 0.7 ? "#00ff9d" : "#ffcc00"; }
        window.toggleSensor = (type) => {
            sensors[type] = !sensors[type];
            document.getElementById(type+'Btn').innerText = `${type.toUpperCase()}: ${sensors[type] ? 'AÇIK' : 'KAPALI'}`;
        };
        window.toggleAcc = (el) => {
            document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));
            el.parentElement.classList.add('active');
        };
        window.lockRadar = () => { if(detections[0]) savedAnchors.push({ alpha: deviceOri.alpha, label: detections[0].categories[0].categoryName }); };
        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; applyAll(); };
        window.addEventListener('deviceorientation', e => deviceOri.alpha = e.alpha);
    </script>
</body>
</html>
