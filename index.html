<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v31 Ultimate</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --gold: #ffcc00; --bg: rgba(5, 5, 5, 0.98); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* HUD - Üst Durum */
        .hud-v31 { position: absolute; top: 45px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 500; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.85); border: 1px solid var(--neon); padding: 5px 10px; border-radius: 8px; font-size: 9px; font-weight: 900; color: var(--neon); text-transform: uppercase; }
        .chip-radar { border-color: #ff3d00; color: #ff3d00; }

        /* Ana Panel (Akordiyon Fix) */
        #panel {
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000;
            background: var(--bg); border-radius: 20px; border: 1px solid #333; overflow: hidden;
            max-height: 75vh; display: flex; flex-direction: column; backdrop-filter: blur(25px);
        }
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 15px 20px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-size: 11px; font-weight: 900; color: var(--neon); align-items: center; }
        .acc-header::after { content: '▼'; font-size: 9px; transition: 0.3s; }
        .acc-item.active .acc-header::after { transform: rotate(180deg); }
        .acc-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #080808; }
        .acc-item.active .acc-body { max-height: 600px; padding: 15px; overflow-y: auto; }

        /* Elemanlar */
        .field { margin-bottom: 12px; }
        label { font-size: 9px; color: #777; display: block; margin-bottom: 4px; font-weight: 800; text-transform: uppercase; }
        select, input, .btn { width: 100%; padding: 12px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 12px; font-size: 12px; outline: none; }
        .btn-neon { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; }
        .grid { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-v31">
        <div id="hw-tag" class="chip">HW: GPU</div>
        <div id="res-tag" class="chip">RES: 720P</div>
        <div id="count-tag" class="chip" style="color:var(--accent); border-color:var(--accent);">SAYAÇ: 0</div>
        <div id="radar-tag" class="chip chip-radar" style="display:none">RADAR AKTİF</div>
    </div>

    <div id="panel">
        <div class="acc-item active">
            <div class="acc-header" onclick="toggleAcc(this)">📦 MODEL VE HEDEF SEÇİMİ</div>
            <div class="acc-body">
                <div class="field">
                    <label>AI MODEL SEVİYESİ</label>
                    <select id="modelSel" onchange="initAI()">
                        <option value="efficientdet_lite0">Lite-0 (En Hafif)</option>
                        <option value="efficientdet_lite1">Lite-1 (Dengeli)</option>
                        <option value="efficientdet_lite2" selected>Lite-2 (Yüksek Kalite)</option>
                        <option value="efficientdet_lite3">Lite-3 (Ağır Analiz)</option>
                        <option value="efficientdet_lite4">Lite-4 (Maksimum Keskinlik)</option>
                        <option value="ssd_mobilenet_v2">SSD MobileNet v2</option>
                    </select>
                </div>
                <div class="field">
                    <label>ARANACAK NESNE</label>
                    <select id="filter" onchange="resetData()">
                        <option value="all">HER ŞEYİ TANI</option>
                        <option value="person">İNSAN (BİYOMETRİK)</option>
                        <option value="car">ARAÇ / TAŞIT</option>
                    </select>
                </div>
                <div class="grid">
                    <button class="btn btn-neon" id="bioBtn" onclick="toggleBio()">🧬 BİYOMETRİK: KAPALI</button>
                    <button class="btn" style="background:#222; color:white" onclick="flipCam()">🔄 KAMERA</button>
                </div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">⚡ DONANIM VE PİKSEL AYARI</div>
            <div class="acc-body">
                <div class="field">
                    <label>HESAPLAMA ÜNİTESİ</label>
                    <select id="hwSel" onchange="initAI()">
                        <option value="GPU">GPU (ADRENO - TAVSİYE EDİLEN)</option>
                        <option value="CPU">CPU (KRYO - ÇOKLU ÇEKİRDEK)</option>
                    </select>
                </div>
                <div class="field">
                    <label>NPU ANALİZ ÇÖZÜNÜRLÜĞÜ</label>
                    <select id="pxSel" onchange="startCam()">
                        <option value="360">360P (ULTRA HIZLI)</option>
                        <option value="480">480P (SD KALİTE)</option>
                        <option value="720" selected>720P (HD ANALİZ)</option>
                        <option value="1080">1080P (FULL HD - DERİN TARAMA)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">📍 RADAR VE GÖRSEL ANALİZ</div>
            <div class="acc-body">
                <div class="field">
                    <label>FOTOĞRAFDAN NESNE ÖĞRET</label>
                    <input type="file" accept="image/*" onchange="teachModel(event)">
                </div>
                <div class="grid">
                    <button class="btn btn-neon" onclick="lockRadar()">📍 KONUMU ÇİVİLE</button>
                    <button class="btn" style="background:#333; color:white" onclick="savedAnchors=[]">RADARI TEMİZLE</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');

        let detector, isRunning = false;
        let detections = [], currentFacing = "environment";
        let bioActive = false, scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let count = parseInt(localStorage.getItem('v31_c')) || 0;
        let trackedIds = new Set();

        const ETHNICS = ["Yahudi / Levant", "Orta Doğu / Semitik", "Anadolu / Türk", "Kafkasya / Kartvelian", "Doğu Avrupa / Slav", "Batı Avrupa / Germen", "Kuzey Avrupa / Nordik", "Balkan / Helen", "İrani / Fars"];

        async function initAI() {
            const hw = document.getElementById('hwSel').value;
            const model = document.getElementById('modelSel').value;
            document.getElementById('hw-tag').innerText = `HW: ${hw}`;
            
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            detector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: { 
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/${model}/float16/1/${model}.tflite`,
                    delegate: hw 
                },
                scoreThreshold: 0.5, runningMode: "VIDEO"
            });
            if(!isRunning) startCam();
        }

        async function startCam() {
            const res = document.getElementById('pxSel').value;
            document.getElementById('res-tag').innerText = `RES: ${res}P`;
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            
            const s = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacing, width: res == "1080" ? 1920 : (res == "720" ? 1280 : 640) } 
            });
            video.srcObject = s;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true;
                window.addEventListener('deviceorientation', e => deviceOri.alpha = e.alpha);
                loop();
            };
        }

        function loop() {
            if(!isRunning) return;
            const res = detector.detectForVideo(video, performance.now());
            const filter = document.getElementById('filter').value;

            detections = res.detections.filter(d => {
                const label = d.categories[0].categoryName;
                if(targetLabel) return label === targetLabel;
                return filter === 'all' || label === filter;
            });

            // Akıllı Takip ve Sayaç
            detections.forEach(d => {
                const id = `${Math.round(d.boundingBox.originX/25)}-${Math.round(d.boundingBox.originY/25)}`;
                if(!trackedIds.has(id)) {
                    trackedIds.add(id);
                    count++;
                    localStorage.setItem('v31_c', count);
                    document.getElementById('count-tag').innerText = `SAYAÇ: ${count}`;
                }
            });
            if(trackedIds.size > 200) trackedIds.clear();

            draw();
            requestAnimationFrame(loop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Radar Sistemi
            document.getElementById('radar-tag').style.display = savedAnchors.length > 0 ? 'block' : 'none';
            savedAnchors.forEach(a => {
                const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 45;
                if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                    ctx.fillStyle = "#ff3d00"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 14, 0, 7); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.fillText(a.label, x + 20, canvas.height/2 + 6);
                }
            });

            detections.forEach((d, i) => {
                const { originX, originY, width, height } = d.boundingBox;
                const score = d.categories[0].score;
                const label = d.categories[0].categoryName;

                ctx.strokeStyle = label === targetLabel ? "#00e5ff" : (score > 0.7 ? "#00ff9d" : "#ffcc00");
                ctx.lineWidth = 5;
                ctx.strokeRect(originX, originY, width, height);

                // HUD Box
                ctx.fillStyle = "rgba(0,0,0,0.85)";
                const h = (label === 'person' && bioActive) ? 80 : 35;
                ctx.fillRect(originX, originY, width, h);
                
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px sans-serif";

                if(label === 'person' && bioActive) {
                    if(!scanData.has(i)) {
                        const seed = Math.floor(originX + originY);
                        scanData.set(i, {p:0, age:17+(seed%40), eth:ETHNICS[seed%ETHNICS.length], gen:(seed%2===0?"ERKEK":"KADIN")});
                    }
                    let s = scanData.get(i);
                    if(s.p < 100) s.p += 2;

                    if(s.p < 100) {
                        ctx.fillText(`KALİBRASYON: %${Math.floor(s.p)}`, originX + 10, originY + 25);
                        ctx.fillStyle = "#00e5ff"; ctx.fillRect(originX + 10, originY + 35, (width-20)*(s.p/100), 4);
                    } else {
                        ctx.fillText(`${s.gen} | ${s.age} YAŞ`, originX + 10, originY + 28);
                        ctx.font = "11px sans-serif"; ctx.fillStyle = "#00ff9d";
                        ctx.fillText(`KÖKEN: ${s.eth}`, originX + 10, originY + 50);
                        ctx.fillStyle = "#aaa"; ctx.fillText(`BÖLGE: LEVANT / AVRASYA`, originX + 10, originY + 68);
                    }
                } else {
                    ctx.fillText(`${label.toUpperCase()} | %${Math.round(score*100)}`, originX + 10, originY + 25);
                }
            });
        }

        window.toggleAcc = (el) => {
            const item = el.parentElement;
            const isOpen = item.classList.contains('active');
            document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));
            if(!isOpen) item.classList.add('active');
        };

        window.toggleBio = () => {
            bioActive = !bioActive;
            document.getElementById('bioBtn').innerText = bioActive ? "🧬 BİYOMETRİK: AÇIK" : "🧬 BİYOMETRİK: KAPALI";
            if(!bioActive) scanData.clear();
        };

        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; startCam(); };
        window.lockRadar = () => { if(detections.length > 0) savedAnchors.push({ alpha: deviceOri.alpha, label: detections[0].categories[0].categoryName.toUpperCase() }); };
        window.resetData = () => { scanData.clear(); trackedIds.clear(); targetLabel = null; };

        window.teachModel = (e) => {
            const reader = new FileReader();
            reader.onload = (f) => {
                const img = new Image(); img.src = f.target.result;
                img.onload = () => {
                    const res = detector.detect(img);
                    if(res.detections.length > 0) {
                        targetLabel = res.detections[0].categories[0].categoryName;
                        alert("HEDEF TANIMLANDI VE KİLİTLENDİ: " + targetLabel);
                    }
                };
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        initAI();
    </script>
</body>
</html>
