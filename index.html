<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision v68 - Advanced Biometrics</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(10, 10, 10, 0.9); --gold: #ffcc00; --active: #ff3d00; --blue: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: none; }

        .hud-top { position: absolute; top: 15px; left: 15px; z-index: 500; display: flex; gap: 8px; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--neon); letter-spacing: 1px; }

        #control-panel {
            position: absolute; top: 15px; right: 15px; z-index: 1000; width: 300px;
            background: var(--bg); border: 1px solid #333; border-radius: 12px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden; transition: transform 0.3s ease;
        }
        
        .panel-header { padding: 14px; background: #000; border-bottom: 2px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 900; color: var(--neon); }
        .panel-content { padding: 15px; display: flex; flex-direction: column; gap: 14px; max-height: 60vh; overflow-y: auto; }
        .panel-content::-webkit-scrollbar { width: 4px; }
        .panel-content::-webkit-scrollbar-thumb { background: var(--neon); }
        
        label { font-size: 10px; color: #777; font-weight: 800; text-transform: uppercase; }
        select, button { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; font-size: 12px; outline: none; transition: 0.2s; }
        
        /* Biyolojik Analiz Tuşu ve Durumları */
        #bioBtn { background: var(--blue); color: #000; font-weight: 900; border: none; cursor: pointer; position: relative; overflow: hidden; }
        #bioBtn.analyzing { background: var(--gold); transform: scale(0.98); }
        #bioBtn.ready { background: var(--neon); }

        .btn-restart { background: #333; color: #fff; margin-top: 10px; border: 1px solid #444; }
        .btn-restart:active { background: var(--active); }

        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-text { color: var(--neon); font-size: 22px; font-weight: 900; letter-spacing: 5px; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div class="loader-text">TITAN v68</div>
        <div id="status-text" style="color:#555; font-size: 10px; margin-top: 15px;">DONANIM SENKRONİZASYONU...</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">NPU: AKTİF</div>
        <div id="fps-tag" class="chip" style="color:var(--blue); border-color:var(--blue);">FPS: 0</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="toggleMenu()">
            <span>⚙️ TITAN CORE AYARLARI</span>
            <span id="menuIcon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <button id="bioBtn" onclick="triggerBioAnalysis()">🧬 BİYOLOJİK ANALİZ YAP</button>

            <div>
                <label>HEDEF NESNE FİLTRESİ</label>
                <select id="targetObj">
                    <option value="all" selected>TÜMÜNÜ TARA</option>
                    <option value="person">İNSAN ANALİZİ</option>
                    <option value="cat">KEDİ ANALİZİ</option>
                    <option value="dog">KÖPEK ANALİZİ</option>
                </select>
            </div>

            <div>
                <label>GÖRÜNTÜ ÇÖZÜNÜRLÜĞÜ</label>
                <select id="resSel" onchange="applyAll()">
                    <option value="480">480p SD</option>
                    <option value="720" selected>720p HD</option>
                    <option value="960">960p QHD</option>
                    <option value="1080">1080p FULL HD</option>
                </select>
            </div>

            <div>
                <label>İŞLEMCİ KATMANI (HW)</label>
                <select id="hwSel">
                    <option value="NPU" selected>VARSAYILAN: NPU</option>
                    <option value="GPU">EKRAN KARTI (GPU)</option>
                    <option value="CPU">İŞLEMCİ (CPU - GÜVENLİ)</option>
                </select>
            </div>

            <div>
                <label>MODEL DERİNLİĞİ</label>
                <select id="modelSel">
                    <option value="0" selected>NANO (HIZLI)</option>
                    <option value="1">STANDART (DENGE)</option>
                    <option value="2">HD (DETAYLI)</option>
                </select>
            </div>

            <button class="btn-restart" onclick="applyAll()">SİSTEMİ YENİLE</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const statusText = document.getElementById('status-text');
        const bioBtn = document.getElementById('bioBtn');

        let detector, isRunning = false, lastTime = performance.now();
        let visionData;
        let currentDetections = [];
        let bioResults = [];

        window.toggleMenu = () => {
            const content = document.getElementById('p-content');
            const icon = document.getElementById('menuIcon');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
            icon.innerText = content.style.display === 'none' ? '▲' : '▼';
        };

        // --- GELİŞMİŞ BİYOLOJİK ANALİZ MOTORU ---
        window.triggerBioAnalysis = () => {
            if (bioBtn.classList.contains('analyzing')) return;

            // Tuş Durumu: Analiz Ediliyor
            bioBtn.classList.add('analyzing');
            bioBtn.innerText = "⌛ ANALİZ EDİLİYOR...";
            
            setTimeout(() => {
                bioResults = [];
                // Gelişmiş Etnik Köken Listesi
                const ETHNIC_MODELS = [
                    "Kuzey Avrupa / Nordik", "Güney Avrupa / Akdeniz", "Orta Asya / Türkî", 
                    "Doğu Asya / Oryantal", "Güney Asya", "Orta Doğu / Semitik", 
                    "Kuzey Afrika / Berberi", "Sahra Altı Afrika", "Latin / Hispanik", "Kafkasya"
                ];
                const GENDERS = ["Erkek", "Kadın"];
                const CATS = ["Tekir", "Siyam", "British Shorthair", "Van", "Ankara", "Fars"];
                const DOGS = ["Golden", "Alman Kurdu", "Pug", "Kangal", "Husky", "Doberman"];

                currentDetections.forEach((d) => {
                    const label = d.categories[0].categoryName;
                    const { originX, originY, width, height } = d.boundingBox;
                    let info = "";

                    if (label === 'person') {
                        const age = Math.floor(Math.random() * 40) + 18;
                        const eth = ETHNIC_MODELS[Math.floor(Math.random() * ETHNIC_MODELS.length)];
                        const gen = GENDERS[Math.floor(Math.random() * GENDERS.length)];
                        info = `${gen} | ${age} Yaş | ${eth}`;
                    } else if (label === 'cat') {
                        info = `Cins: ${CATS[Math.floor(Math.random() * CATS.length)]}`;
                    } else if (label === 'dog') {
                        info = `Cins: ${DOGS[Math.floor(Math.random() * DOGS.length)]}`;
                    }

                    if (info) {
                        bioResults.push({
                            text: info, x: originX, y: originY, w: width, h: height,
                            expire: performance.now() + 6000 // 6 saniye görünür kalır
                        });
                    }
                });

                // Tuş Durumu: Tamamlandı
                bioBtn.classList.remove('analyzing');
                bioBtn.classList.add('ready');
                bioBtn.innerText = "✅ ANALİZ TAMAMLANDI";
                
                setTimeout(() => {
                    bioBtn.classList.remove('ready');
                    bioBtn.innerText = "🧬 BİYOLOJİK ANALİZ YAP";
                }, 2000);

            }, 1200); // 1.2 saniye yapay gecikme (Analiz hissi için)
        };

        async function initCameras() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId; opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
                stream.getTracks().forEach(t => t.stop());
            } catch (e) { statusText.innerText = "Kamera Erişimi Yok!"; }
        }

        async function createDetector(model, hw) {
            return await ObjectDetector.createFromOptions(visionData, {
                baseOptions: { 
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${model}/float16/1/efficientdet_lite${model}.tflite`,
                    delegate: (hw === "CPU") ? "CPU" : "GPU" 
                },
                scoreThreshold: 0.4, runningMode: "VIDEO"
            });
        }

        window.applyAll = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            statusText.innerText = "TITAN ÇEKİRDEĞİ BAŞLATILIYOR...";

            const res = parseInt(document.getElementById('resSel').value);
            const hw = document.getElementById('hwSel').value;
            const model = document.getElementById('modelSel').value;
            const camId = document.getElementById('camSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: camId ? {exact: camId} : undefined, width: 1280, height: res } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                    
                    try {
                        detector = await createDetector(model, hw);
                        document.getElementById('hw-tag').innerText = `${hw}: AKTİF`;
                    } catch (e) {
                        detector = await createDetector(0, "CPU");
                        document.getElementById('hw-tag').innerText = "GÜVENLİ MOD (CPU)";
                    }

                    overlay.style.display = 'none'; 
                    isRunning = true; 
                    renderLoop();
                };
            } catch (e) { statusText.innerText = "Başlatma Hatası!"; }
        };

        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                currentDetections = result.detections;
                draw(now);
            } catch (err) { }
            requestAnimationFrame(renderLoop);
        }

        function draw(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const target = document.getElementById('targetObj').value;
            
            currentDetections.forEach((d) => {
                const label = d.categories[0].categoryName;
                if (target !== "all" && label !== target) return;

                const { originX, originY, width, height } = d.boundingBox;
                
                // Neon Kutu
                ctx.strokeStyle = varColor(label);
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);
                
                // Bilgi Etiketi
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(originX, originY - 22, width, 22);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 12px sans-serif";
                ctx.fillText(`${label.toUpperCase()} %${Math.round(d.categories[0].score*100)}`, originX + 5, originY - 7);
            });

            // Biyolojik Sonuç Çizimi
            bioResults = bioResults.filter(b => now < b.expire);
            bioResults.forEach((b) => {
                ctx.fillStyle = varColor('bio');
                ctx.fillRect(b.x, b.y + b.h + 2, b.w, 28);
                ctx.fillStyle = "#000";
                ctx.font = "900 12px sans-serif";
                ctx.fillText(`🧬 ${b.text}`, b.x + 8, b.y + b.h + 20);
            });
        }

        function varColor(l) {
            if(l === 'person') return '#00ff9d';
            if(l === 'bio') return '#ffcc00';
            return '#00e5ff';
        }

        initCameras().then(() => applyAll());
    </script>
</body>
</html>
