<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poco X7 Pro Ultra AI - High Vision</title>
    <style>
        :root {
            --neon: #00ff9d;
            --bg: #050505;
            --panel: #111;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 15px;
            background: var(--panel);
            text-align: center;
            border-bottom: 2px solid var(--neon);
            box-shadow: 0 0 15px rgba(0, 255, 157, 0.2);
        }

        h1 { margin: 0; font-size: 1.1rem; letter-spacing: 2px; color: var(--neon); }

        #container {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .ui-overlay {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        #status {
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            border: 1px solid var(--neon);
        }

        button {
            background: var(--neon);
            color: black;
            border: none;
            padding: 15px 40px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1rem;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 255, 157, 0.4);
            cursor: pointer;
        }

        button:disabled { background: #333; color: #777; box-shadow: none; }

        .fps-counter {
            position: absolute;
            top: 70px;
            right: 10px;
            font-size: 0.7rem;
            color: var(--neon);
            background: rgba(0,0,0,0.5);
            padding: 4px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>POCO X7 PRO - NPU HIGH VISION</h1>
    </div>

    <div id="container">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>
        <div class="fps-counter" id="fps">FPS: --</div>
    </div>

    <div class="ui-overlay">
        <div id="status">Sistem Yükleniyor...</div>
        <button id="startBtn">Sistemi Aktif Et</button>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const fpsDisplay = document.getElementById('fps');

        let objectDetector;
        let lastVideoTime = -1;
        let frameCount = 0;
        let lastFpsUpdate = 0;

        // Türkçe Sözlük (Geliştirilmiş)
        const labelsTR = {
            'person': 'İNSAN', 'cat': 'KEDİ', 'dog': 'KÖPEK', 'laptop': 'BİLGİSAYAR',
            'cell phone': 'TELEFON', 'bottle': 'ŞİŞE', 'cup': 'BARDAK', 'chair': 'SANDALYE',
            'tv': 'EKRAN', 'backpack': 'ÇANTA', 'handbag': 'EL ÇANTASI', 'book': 'KİTAP',
            'mouse': 'FARE', 'remote': 'KUMANDA', 'keyboard': 'KLAVYE', 'car': 'ARABA'
        };

        async function init() {
            try {
                status.innerText = "Zeka Katmanları Hazırlanıyor (Lite2)...";
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                
                objectDetector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: {
                        // EN KALİTELİ MODEL: EfficientDet-Lite2 (Daha fazla detay, daha yüksek doğruluk)
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                        delegate: "GPU" // NPU/GPU Kullanımını zorla
                    },
                    scoreThreshold: 0.45, // Güven eşiği %45
                    runningMode: "VIDEO"
                });

                status.innerText = "NPU Optimize Edildi. Başlamaya Hazır.";
                startBtn.disabled = false;
            } catch (err) {
                status.innerText = "Hata: " + err;
                console.error(err);
            }
        }

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            status.innerText = "Kamera Analizi Başlatıldı...";
            
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: "environment",
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            });
            video.srcObject = stream;
            video.addEventListener("loadeddata", predictLoop);
        });

        async function predictLoop() {
            // Canvas boyutunu ekranla eşitle
            if (canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }

            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const startTimeMs = performance.now();
                const detections = objectDetector.detectForVideo(video, startTimeMs);
                
                renderDetections(detections);
                updateFPS(startTimeMs);
            }
            window.requestAnimationFrame(predictLoop);
        }

        function renderDetections(result) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            result.detections.forEach(detection => {
                const { originX, originY, width, height } = detection.boundingBox;
                const name = detection.categories[0].categoryName;
                const score = Math.round(detection.categories[0].score * 100);
                const trName = labelsTR[name] || name.toUpperCase();

                // Neon Kutu Çizimi
                ctx.strokeStyle = '#00ff9d';
                ctx.lineWidth = 6;
                ctx.lineJoin = 'round';
                ctx.strokeRect(originX, originY, width, height);

                // Etiket Arka Planı (Blur efekti gibi dolu siyah)
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(originX, originY - 35, 120, 35);

                // Etiket Metni
                ctx.fillStyle = '#00ff9d';
                ctx.font = 'bold 20px Monospace';
                ctx.fillText(`${trName} %${score}`, originX + 5, originY - 10);
            });
        }

        function updateFPS(now) {
            frameCount++;
            if (now - lastFpsUpdate > 1000) {
                fpsDisplay.innerText = "FPS: " + frameCount;
                frameCount = 0;
                lastFpsUpdate = now;
            }
        }

        init();
    </script>
</body>
</html>
