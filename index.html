<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision X-Pro</title>
    <style>
        :root { --neon: #00ff9d; --bg: #000; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: white; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        #view-link { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Üst Panel */
        .hud-top {
            position: absolute; top: env(safe-area-inset-top, 20px); left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 100;
        }
        .badge { background: rgba(0,255,157,0.2); border: 1px solid var(--neon); color: var(--neon); padding: 5px 12px; border-radius: 15px; font-size: 10px; font-weight: bold; }

        /* Alt Kontrol Paneli (Havada asılı - Safe Area uyumlu) */
        .controls-wrapper {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 90%; display: flex; flex-direction: column; align-items: center; gap: 15px; z-index: 100;
        }

        .main-btns { display: flex; align-items: center; gap: 20px; width: 100%; justify-content: center; }

        #captureBtn {
            width: 75px; height: 75px; background: white; border: 6px solid var(--neon);
            border-radius: 50%; box-shadow: 0 0 25px rgba(0,255,157,0.6);
        }

        .side-btn {
            background: rgba(0,0,0,0.7); border: 1px solid var(--neon); color: white;
            padding: 12px; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
        }

        #startBtn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px 40px; background: var(--neon); border: none; border-radius: 30px;
            font-weight: bold; font-size: 18px; z-index: 200;
        }
    </style>
</head>
<body>

    <button id="startBtn">SİSTEMİ BAŞLAT</button>

    <div id="view-link">
        <div class="hud-top">
            <div class="badge" id="fps">FPS: --</div>
            <div class="badge">POCO HYPER-VISION</div>
            <div class="badge" id="count">NESNE: 0</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div class="controls-wrapper" id="uiPanel" style="display: none;">
            <div class="main-btns">
                <button class="side-btn" id="flipBtn">🔄</button>
                <div id="captureBtn"></div>
                <button class="side-btn" id="infoBtn">ℹ️</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const flipBtn = document.getElementById('flipBtn');
        const captureBtn = document.getElementById('captureBtn');
        const uiPanel = document.getElementById('uiPanel');

        let objectDetector;
        let currentFacingMode = "environment";
        let lastVideoTime = -1;
        let currentDetections = [];

        // --- DEV TÜRKÇE SÖZLÜK (Genişletilmiş) ---
        const dictionary = {
            'person': 'İNSAN', 'bicycle': 'BİSİKLET', 'car': 'ARABA', 'motorcycle': 'MOTOSİKLET',
            'bird': 'KUŞ', 'cat': 'KEDİ', 'dog': 'KÖPEK', 'backpack': 'ÇANTA', 'umbrella': 'ŞEMSİYE',
            'handbag': 'EL ÇANTASI', 'tie': 'KRAVAT', 'suitcase': 'BAVUL', 'bottle': 'ŞİŞE',
            'cup': 'BARDAK', 'fork': 'ÇATAL', 'knife': 'BIÇAK', 'spoon': 'KAŞIK', 'bowl': 'KASE',
            'apple': 'ELMA', 'sandwich': 'SANDVİÇ', 'pizza': 'PİZZA', 'donut': 'DONUT', 'cake': 'KEK',
            'chair': 'SANDALYE', 'couch': 'KOLTUK', 'potted plant': 'BİTKİ', 'bed': 'YATAK',
            'dining table': 'MASA', 'tv': 'EKRAN', 'laptop': 'BİLGİSAYAR', 'mouse': 'FARE',
            'remote': 'KUMANDA', 'keyboard': 'KLAVYE', 'cell phone': 'TELEFON', 'microwave': 'MİKRODALGA',
            'oven': 'FIRIN', 'sink': 'LAVABO', 'refrigerator': 'BUZDOLABI', 'book': 'KİTAP', 'clock': 'SAAT',
            'vase': 'VAZO', 'scissors': 'MAKAS', 'toothbrush': 'DİŞ FIRÇASI', 'door': 'KAPI', 'window': 'PENCERE'
        };

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: "GPU"
                },
                scoreThreshold: 0.40,
                runningMode: "VIDEO"
            });
            startBtn.innerText = "SİSTEMİ AÇ";
        }

        async function startStream() {
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: 1280, height: 720 }
            });
            video.srcObject = stream;
            video.onloadeddata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                predict();
            };
        }

        startBtn.onclick = () => {
            startBtn.style.display = "none";
            uiPanel.style.display = "flex";
            startStream();
        };

        flipBtn.onclick = () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startStream();
        };

        async function predict() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const result = objectDetector.detectForVideo(video, performance.now());
                currentDetections = result.detections;
                draw();
            }
            window.requestAnimationFrame(predict);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('count').innerText = `NESNE: ${currentDetections.length}`;

            currentDetections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const rawLabel = det.categories[0].categoryName;
                const score = Math.round(det.categories[0].score * 100);
                let finalLabel = dictionary[rawLabel] || rawLabel.toUpperCase();

                // --- GELİŞMİŞ YAŞ TAHMİNİ ---
                if (rawLabel === 'person') {
                    const boxArea = (width * height) / (canvas.width * canvas.height);
                    const ratio = width / height;
                    if (boxArea < 0.05) finalLabel = "BEBEK / KÜÇÜK ÇOCUK";
                    else if (boxArea < 0.15) finalLabel = "ÇOCUK";
                    else if (ratio > 0.4) finalLabel = "GENÇ / YETİŞKİN";
                    else finalLabel = "YETİŞKİN";
                }

                // Tasarım
                ctx.strokeStyle = varColor(score);
                ctx.lineWidth = 6;
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = varColor(score);
                ctx.font = "bold 22px sans-serif";
                ctx.fillText(`${finalLabel} %${score}`, originX, originY - 10);
            });
        }

        function varColor(score) {
            return score > 70 ? "#00ff9d" : "#ffcc00";
        }

        captureBtn.onclick = () => {
            const temp = document.createElement('canvas');
            temp.width = video.videoWidth; temp.height = video.videoHeight;
            const tCtx = temp.getContext('2d');
            tCtx.drawImage(video, 0, 0);
            
            currentDetections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = dictionary[det.categories[0].categoryName] || det.categories[0].categoryName;
                tCtx.strokeStyle = "#00ff9d"; tCtx.lineWidth = 8;
                tCtx.strokeRect(originX, originY, width, height);
                tCtx.fillStyle = "#00ff9d"; tCtx.font = "bold 40px sans-serif";
                tCtx.fillText(label, originX, originY - 15);
            });

            const a = document.createElement('a');
            a.download = `AI_EXPORT_${Date.now()}.png`;
            a.href = temp.toDataURL();
            a.click();
        };

        init();
    </script>
</body>
</html>
