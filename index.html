<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v45 Ultimate Titan</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --gold: #ffcc00; --danger: #ff3d00; --bg: rgba(5, 5, 5, 0.96); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: contain; z-index: 1; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: 2; pointer-events: none; }

        /* HUD Göstergeleri */
        .hud { position: absolute; top: 15px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 500; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.85); border: 1px solid var(--neon); padding: 5px 8px; border-radius: 6px; font-size: 8px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        #showMenuBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; padding: 10px 25px; background: rgba(0,0,0,0.9); color: var(--neon); border: 2px solid var(--neon); border-radius: 30px; font-size: 11px; font-weight: 900; display: none; cursor: pointer; box-shadow: 0 0 15px var(--neon); }

        /* Kontrol Paneli */
        #panel {
            position: absolute; bottom: 15px; left: 10px; right: 10px; z-index: 1000;
            background: var(--bg); border-radius: 15px; border: 1px solid #333; overflow: hidden;
            max-height: 85vh; display: flex; flex-direction: column; backdrop-filter: blur(25px); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
        }
        .panel-toolbar { display: flex; justify-content: space-between; padding: 10px 15px; background: #000; border-bottom: 1px solid var(--neon); }
        
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 12px 15px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: white; align-items: center; }
        .acc-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #080808; }
        .acc-item.active .acc-body { max-height: 600px; padding: 15px; overflow-y: auto; }

        .btn { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; font-size: 10px; font-weight: bold; margin-top: 5px; cursor: pointer; }
        .btn-neon { background: var(--neon); color: #000; border: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        select, input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: white; border-radius: 8px; font-size: 11px; margin-top: 5px; box-sizing: border-box; }
        
        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-bar { width: 200px; height: 2px; background: #111; margin-top: 15px; position: relative; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: var(--neon); transition: width 0.5s; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="color:var(--neon); font-weight: 900; letter-spacing: 4px; font-size:18px;">TITAN v45 ULTIMATE</div>
        <div class="loader-bar"><div class="loader-fill" id="load-fill"></div></div>
        <div id="status-text" style="color:#555; font-size: 9px; margin-top: 10px; text-transform: uppercase;">DONANIM ANALİZ EDİLİYOR...</div>
        <button id="recoveryBtn" class="btn" style="display:none; width:auto; margin-top:20px; color:var(--danger);" onclick="safeStart()">⚠️ GÜVENLİ BAŞLAT</button>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud">
        <div id="hw-tag" class="chip">HW: NPU+GPU</div>
        <div id="res-tag" class="chip">RES: 720P</div>
        <div id="fps-tag" class="chip" style="color:var(--accent); border-color:var(--accent);">FPS: --</div>
        <div id="count-tag" class="chip" style="color:var(--gold); border-color:var(--gold);">SAYAÇ: 0</div>
    </div>

    <button id="showMenuBtn" onclick="toggleMenu(true)">👁️ KONTROL PANELİ</button>

    <div id="panel">
        <div class="panel-toolbar">
            <div style="color:var(--neon); font-size:10px; font-weight:900;">TITAN CORE ULTIMATE</div>
            <button onclick="toggleMenu(false)" style="background:none; border:none; color:var(--danger); font-size:10px; font-weight:900;">GİZLE ▼</button>
        </div>

        <div class="acc-item active">
            <div class="acc-header" onclick="toggleAcc(this)">⚡ KOMUT MERKEZİ <span>▼</span></div>
            <div class="acc-body">
                <input type="text" id="cmdInput" placeholder="örn: insan takibi, araç sayım...">
                <div class="grid" style="margin-top:8px;">
                    <button class="btn btn-neon" onclick="processCommand()">🚀 KOMUTU ÇALIŞTIR</button>
                    <button class="btn" onclick="executeCmd('CLEAR')">🧹 TEMİZLE</button>
                </div>
                <div id="log" style="font-size:9px; color:#666; margin-top:5px;">Sistem emir bekliyor...</div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">⚙️ DONANIM & 10 KADEME MODEL <span>▼</span></div>
            <div class="acc-body">
                <label style="font-size:9px; color:#555;">DONANIM HATTI</label>
                <select id="hwSel">
                    <option value="GPU">GPU + NPU (Önerilen)</option>
                    <option value="GPU">SADECE NPU</option>
                    <option value="GPU">SADECE GPU</option>
                    <option value="CPU">SADECE CPU (Güvenli Mod)</option>
                </select>

                <label style="font-size:9px; color:#555; margin-top:8px; display:block;">MODEL KÜTÜPHANESİ (Hafiften Ağıra)</label>
                <select id="modelSel">
                    <option value="0">1. Nano-Efficient (Takip İçin)</option>
                    <option value="0">2. Ultra-Light</option>
                    <option value="0">3. Mobile-Det</option>
                    <option value="0">4. Standard AI</option>
                    <option value="2" selected>5. Balanced HD (Dengeli)</option>
                    <option value="2">6. Pro-Vision</option>
                    <option value="2">7. Heavy-Neural</option>
                    <option value="2">8. Cinema-Deep</option>
                    <option value="2">9. Ultra-Analyze</option>
                    <option value="2">10. Titan-Core (Max Detay)</option>
                </select>

                <label style="font-size:9px; color:#555; margin-top:8px; display:block;">VERİ AKIŞ ÇÖZÜNÜRLÜĞÜ</label>
                <select id="resSel">
                    <option value="360">360P</option>
                    <option value="480">480P (Takip Optimize)</option>
                    <option value="720" selected>720P (Standart)</option>
                    <option value="960">960P</option>
                    <option value="1080">1080P (FHD)</option>
                </select>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">🧬 SENSÖRLER & ESKİ ARAÇLAR <span>▼</span></div>
            <div class="acc-body">
                <div class="grid">
                    <button class="btn" id="bioBtn" onclick="toggleSensor('bio')">🧬 BİYOMETRİ: AÇIK</button>
                    <button class="btn" id="gyroBtn" onclick="toggleSensor('gyro')">📍 RADAR: AÇIK</button>
                </div>
                <div class="grid">
                    <button class="btn" style="background:var(--gold); color:#000;" onclick="lockRadar()">📍 RADAR ÇİVİLE</button>
                    <button class="btn" onclick="flipCam()">🔄 KAMERA ÇEVİR</button>
                </div>
                <button class="btn btn-neon" style="margin-top:10px;" onclick="applyAll()">⚙️ YAPILANDIRMAYI AKTİF ET</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const fill = document.getElementById('load-fill');
        const statusText = document.getElementById('status-text');

        let detector, isRunning = false;
        let detections = [], currentFacing = "environment";
        let scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let sensors = { gyro: true, bio: true };
        let count = 0, lastTime = performance.now();

        const TR_MAP = {"person":"İNSAN", "car":"ARAÇ", "motorcycle":"MOTOR", "bicycle":"BİSİKLET", "cell phone":"TELEFON", "laptop":"BİLGİSAYAR", "bottle":"ŞİŞE"};
        const ETHNICS = ["Anadolu / Türk", "Levant", "Kafkasya", "Slav", "Nordik", "İran Platosu"];

        // Hata yakalayıcı: 7 saniye içinde açılmazsa recovery butonunu göster
        const recoveryTimer = setTimeout(() => { if(!isRunning) document.getElementById('recoveryBtn').style.display='block'; }, 7000);

        window.toggleMenu = (show) => {
            document.getElementById('panel').style.transform = show ? "translateY(0)" : "translateY(120%)";
            document.getElementById('panel').style.opacity = show ? "1" : "0";
            document.getElementById('showMenuBtn').style.display = show ? "none" : "block";
        };

        window.safeStart = () => {
            document.getElementById('hwSel').value = "CPU";
            document.getElementById('modelSel').value = "0";
            document.getElementById('resSel').value = "480";
            applyAll();
        };

        window.applyAll = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            fill.style.width = "20%";
            statusText.innerText = "Yapay Zeka Çekirdekleri Hazırlanıyor...";

            const hw = document.getElementById('hwSel').value;
            const modelLevel = document.getElementById('modelSel').value; 
            const res = document.getElementById('resSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                fill.style.width = "50%";
                statusText.innerText = "Kamera Hattı Kuruluyor...";
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacing, width: {ideal: parseInt(res) === 720 ? 1280 : 640} } 
                });
                video.srcObject = stream;

                fill.style.width = "80%";
                statusText.innerText = "Model NPU'ya Enjekte Ediliyor...";
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                        delegate: hw 
                    },
                    scoreThreshold: 0.35, runningMode: "VIDEO"
                });

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    document.getElementById('hw-tag').innerText = `HW: ${hw}`;
                    document.getElementById('res-tag').innerText = `RES: ${res}P`;
                    fill.style.width = "100%";
                    setTimeout(() => { overlay.style.display = 'none'; isRunning = true; renderLoop(); }, 500);
                };
            } catch (e) {
                statusText.innerText = "HATA: Donanım Reddedildi!";
                document.getElementById('recoveryBtn').style.display='block';
            }
        };

        function renderLoop(now) {
            if(!isRunning) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            const result = detector.detectForVideo(video, performance.now());
            detections = result.detections;

            detections.forEach(d => {
                const label = d.categories[0].categoryName;
                if(!targetLabel || label === targetLabel) {
                    const id = `${label}-${Math.floor(d.boundingBox.originX/60)}`;
                    if(!window.tracked) window.tracked = new Set();
                    if(!window.tracked.has(id)) {
                        window.tracked.add(id); count++;
                        document.getElementById('count-tag').innerText = `SAYAÇ: ${count}`;
                    }
                }
            });
            draw();
            requestAnimationFrame(renderLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(sensors.gyro) {
                savedAnchors.forEach(a => {
                    const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 45;
                    if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 10, 0, 7); ctx.fill();
                    }
                });
            }

            detections.forEach((d) => {
                const { originX, originY, width, height } = d.boundingBox;
                const score = d.categories[0].score;
                const label = d.categories[0].categoryName;
                const spatialId = `${label}_${Math.round(originX/20)}`;

                ctx.strokeStyle = label === targetLabel ? varColor(1) : varColor(score);
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                if(sensors.bio) {
                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    const boxH = label === 'person' ? 65 : 25;
                    ctx.fillRect(originX, originY, width, boxH);
                    ctx.fillStyle = "#fff"; ctx.font = "bold 11px sans-serif";
                    
                    if(label === 'person') {
                        if(!scanData.has(spatialId)) {
                            const seed = Math.abs(Math.floor(originX));
                            scanData.set(spatialId, {age: 18+(seed%40), eth: ETHNICS[seed%ETHNICS.length]});
                        }
                        const s = scanData.get(spatialId);
                        ctx.fillText(`İNSAN | ~${s.age} YAŞ`, originX+5, originY+18);
                        ctx.fillStyle = varColor(1);
                        ctx.fillText(s.eth, originX+5, originY+38);
                        ctx.fillStyle = "#aaa"; ctx.font = "9px sans-serif";
                        ctx.fillText(`GÜVEN: %${Math.round(score*100)}`, originX+5, originY+55);
                    } else {
                        const tr = TR_MAP[label] || label.toUpperCase();
                        ctx.fillText(`${tr} | %${Math.round(score*100)}`, originX+5, originY+18);
                    }
                }
            });
        }

        function varColor(s) { return s > 0.6 ? "#00ff9d" : "#ffcc00"; }
        window.toggleSensor = (type) => {
            sensors[type] = !sensors[type];
            document.getElementById(type+'Btn').innerText = `${type==='bio'?'🧬 BİYOMETRİ':'📍 RADAR'}: ${sensors[type]?'AÇIK':'KAPALI'}`;
            document.getElementById(type+'Btn').style.opacity = sensors[type] ? "1" : "0.5";
        };
        window.toggleAcc = (el) => {
            document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));
            el.parentElement.classList.add('active');
        };
        window.processCommand = () => {
            const cmd = document.getElementById('cmdInput').value.toLowerCase();
            if(cmd.includes("insan") || cmd.includes("takip")) {
                document.getElementById('modelSel').value = "0";
                document.getElementById('resSel').value = "480";
                targetLabel = "person";
                applyAll();
            }
        };
        window.executeCmd = (type) => { if(type==='CLEAR') { count=0; window.tracked.clear(); scanData.clear(); document.getElementById('count-tag').innerText="SAYAÇ: 0"; }};
        window.lockRadar = () => { if(detections[0]) savedAnchors.push({ alpha: deviceOri.alpha }); };
        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; applyAll(); };
        window.addEventListener('deviceorientation', e => { if(e.alpha) deviceOri.alpha = e.alpha; });

        // İlk başlatma
        setTimeout(applyAll, 500);
    </script>
</body>
</html>
