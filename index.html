<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v42 Titan-Core</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --gold: #ffcc00; --danger: #ff3d00; --bg: rgba(5, 5, 5, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: #000; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* HUD Göstergeleri */
        .hud { position: absolute; top: 15px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; z-index: 500; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.85); border: 1px solid var(--neon); padding: 5px 8px; border-radius: 6px; font-size: 9px; font-weight: 900; color: var(--neon); text-transform: uppercase; }

        /* Menüyü Göster Butonu (Menü gizliyken çıkar) */
        #showMenuBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1100; padding: 10px 20px; background: rgba(0,0,0,0.8); color: var(--neon); border: 1px solid var(--neon); border-radius: 20px; font-size: 10px; font-weight: 900; display: none; cursor: pointer; }

        /* Ana Kontrol Paneli */
        #panel {
            position: absolute; bottom: 15px; left: 10px; right: 10px; z-index: 1000;
            background: var(--bg); border-radius: 15px; border: 1px solid #333; overflow: hidden;
            max-height: 82vh; display: flex; flex-direction: column; backdrop-filter: blur(25px); transition: transform 0.3s ease, opacity 0.3s ease;
        }
        .panel-toolbar { display: flex; justify-content: space-between; padding: 8px 15px; background: #000; border-bottom: 1px solid var(--neon); }
        .panel-title { color: var(--neon); font-size: 10px; font-weight: 900; align-self: center; letter-spacing: 1px; }
        
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 12px 15px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; color: white; align-items: center; }
        .acc-body { padding: 0; max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #080808; }
        .acc-item.active .acc-body { max-height: 600px; padding: 12px 15px; overflow-y: auto; }

        .btn { width: 100%; padding: 10px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 8px; font-size: 10px; font-weight: bold; margin-top: 5px; cursor: pointer; }
        .btn-neon { background: var(--neon); color: #000; border: none; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        
        input[type="text"], select { width: 100%; padding: 8px; background: #111; border: 1px solid #333; color: white; border-radius: 6px; font-size: 10px; margin-top: 4px; margin-bottom: 4px; box-sizing: border-box; }
        
        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="color:var(--neon); font-weight: 900; letter-spacing: 3px; font-size:16px;">TITAN CORE OS</div>
        <div style="color:#555; font-size: 9px; margin-top: 5px;">MODÜLLER BAŞLATILIYOR...</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud">
        <div id="hw-tag" class="chip">HW: GPU+NPU</div>
        <div id="res-tag" class="chip">RES: 720P</div>
        <div id="fps-tag" class="chip" style="color:var(--accent); border-color:var(--accent);">FPS: --</div>
        <div id="count-tag" class="chip" style="color:var(--gold); border-color:var(--gold);">SAYAÇ: 0</div>
    </div>

    <button id="showMenuBtn" onclick="toggleMenuVisibility()">👁️ MENÜYÜ GÖSTER</button>

    <div id="panel">
        <div class="panel-toolbar">
            <div class="panel-title">SİSTEM MERKEZİ v42</div>
            <button class="btn" style="width: auto; padding: 4px 10px; margin: 0; border: 1px solid var(--danger); color: var(--danger); background: transparent;" onclick="toggleMenuVisibility()">GİZLE ▼</button>
        </div>

        <div class="acc-item active">
            <div class="acc-header" onclick="toggleAcc(this)">⚡ KOMUT MERKEZİ & MODLAR <span style="color:var(--neon)">▼</span></div>
            <div class="acc-body">
                <input type="text" id="cmdInput" placeholder="Komut (örn: insan takip, araç sayım)...">
                <div class="grid" style="margin-top:5px;">
                    <button class="btn btn-neon" onclick="processCommand()">🚀 KOMUTU ÇALIŞTIR</button>
                    <button class="btn" onclick="executeCmd('CLEAR')">🧹 TEMİZLE</button>
                </div>
                <div id="log" style="font-size:9px; color:#aaa; margin-top:8px; background:#111; padding:5px; border-radius:5px;">Sistem beklemede...</div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">⚙️ DONANIM, MODEL & SENSÖRLER <span>▼</span></div>
            <div class="acc-body">
                <label style="font-size:9px; color:#aaa;">BİRİM (NPU/GPU/CPU)</label>
                <select id="hwSel">
                    <option value="GPU">SADECE NPU (Hibrid Yapı)</option>
                    <option value="GPU">SADECE GPU (Grafik)</option>
                    <option value="CPU">SADECE CPU (Güvenli)</option>
                    <option value="GPU" selected>GPU + NPU (Önerilen)</option>
                    <option value="GPU">GPU + CPU (Stabil)</option>
                </select>

                <label style="font-size:9px; color:#aaa;">YAPAY ZEKA AĞIRLIĞI</label>
                <select id="modelSel">
                    <option value="0">1. Nano-Efficient (Max Hız)</option>
                    <option value="0">2. Ultra-Light (Sayım)</option>
                    <option value="0">3. Mobile-Det (Hafif)</option>
                    <option value="0">4. Standard AI (Günlük)</option>
                    <option value="2" selected>5. Balanced HD (Dengeli)</option>
                    <option value="2">6. Pro-Vision (Keskin)</option>
                    <option value="2">7. Heavy-Neural (Detaylı)</option>
                    <option value="2">8. Cinema-Deep</option>
                    <option value="2">9. Ultra-Analyze</option>
                    <option value="2">10. Titan-Core (Limit Yok)</option>
                </select>

                <label style="font-size:9px; color:#aaa;">VERİ AKIŞ ÇÖZÜNÜRLÜĞÜ</label>
                <select id="resSel">
                    <option value="360">360P (Aşırı Hızlı)</option>
                    <option value="480">480P (Performans)</option>
                    <option value="720" selected>720P (HD Analiz)</option>
                    <option value="960">960P (QHD)</option>
                    <option value="1080">1080P (FHD)</option>
                </select>

                <label style="font-size:9px; color:#aaa; margin-top:8px; display:block;">SENSÖR KONTROLLERİ</label>
                <div class="grid">
                    <button class="btn" id="gyroBtn" style="border-color:var(--accent)" onclick="toggleSensor('gyro')">📍 JİROSKOP: AÇIK</button>
                    <button class="btn" id="bioBtn" style="border-color:var(--accent)" onclick="toggleSensor('bio')">🧬 BİYOMETRİ: AÇIK</button>
                </div>

                <button class="btn btn-neon" style="margin-top:10px;" onclick="applyAll()">⚙️ SİSTEMİ YENİDEN YAPILANDIR</button>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(this)">🧰 RADAR & ARAÇLAR <span>▼</span></div>
            <div class="acc-body">
                <div class="grid">
                    <button class="btn" style="background:var(--gold); color:#000;" onclick="lockRadar()">📍 RADAR ÇİVİLE</button>
                    <button class="btn" onclick="flipCam()">🔄 KAMERA ÇEVİR</button>
                </div>
                <button class="btn" style="background:var(--danger); margin-top:10px;" onclick="localStorage.clear(); location.reload();">🧹 FABRİKA AYARLARI</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const loader = document.getElementById('load-overlay');

        let detector, isRunning = false;
        let detections = [], currentFacing = "environment";
        let scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let sensors = { gyro: true, bio: true };
        let count = parseInt(localStorage.getItem('v42_c')) || 0;
        let lastTime = performance.now();
        let isMenuVisible = true;

        // Kapsamlı Çeviri ve Etiket Haritası
        const LABEL_MAP = {
            "person": "İNSAN", "car": "ARAÇ", "motorcycle": "MOTOR", "truck": "KAMYON", "bus": "OTOBÜS",
            "bicycle": "BİSİKLET", "cat": "KEDİ", "dog": "KÖPEK", "bottle": "ŞİŞE", "chair": "SANDALYE",
            "cell phone": "TELEFON", "tv": "EKSAN/TV", "laptop": "BİLGİSAYAR"
        };
        const ETHNICS = ["Levant / Doğu Akdeniz", "Anadolu / Türk", "Kafkasya", "Slav / Balkan", "Nordik", "İran Platosu"];

        window.toggleMenuVisibility = () => {
            isMenuVisible = !isMenuVisible;
            document.getElementById('panel').style.transform = isMenuVisible ? "translateY(0)" : "translateY(120%)";
            document.getElementById('panel').style.opacity = isMenuVisible ? "1" : "0";
            document.getElementById('showMenuBtn').style.display = isMenuVisible ? "none" : "block";
        };

        window.applyAll = async () => {
            isRunning = false;
            loader.style.display = 'flex';
            
            const hw = document.getElementById('hwSel').value;
            const modelLevel = document.getElementById('modelSel').value; 
            const res = document.getElementById('resSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                // Kademeli Kamera Başlatma (Çökme Önleyici)
                let stream;
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing, width: {ideal: parseInt(res)} } });
                } catch(camErr) {
                    console.warn("Hedef çözünürlük reddedildi, güvenli mod açılıyor...");
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } });
                }
                video.srcObject = stream;

                // Model Çekimi (Hata vermemesi için güvenli Lite0 ve Lite2 haritalaması)
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                        delegate: hw 
                    },
                    scoreThreshold: 0.35, // Tanıma oranını artırmak için düşürüldü
                    runningMode: "VIDEO"
                });

                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    document.getElementById('hw-tag').innerText = `HW: NPU/GPU`;
                    document.getElementById('res-tag').innerText = `RES: ${res}P`;
                    loader.style.display = 'none';
                    isRunning = true;
                    renderLoop();
                };
            } catch (e) { 
                alert("Donanım erişim hatası! Sistem onarılıyor...");
                document.getElementById('resSel').value = "480";
                document.getElementById('modelSel').value = "0";
                loader.style.display = 'none';
            }
        };

        window.processCommand = () => {
            const cmd = document.getElementById('cmdInput').value.toLowerCase();
            const log = document.getElementById('log');
            
            if(cmd.includes("insan") || cmd.includes("takip")) {
                document.getElementById('modelSel').value = "0"; // Lite0
                document.getElementById('resSel').value = "480";
                targetLabel = "person";
                log.innerText = "KOMUT: Hafif model (480p) ile İNSAN TAKİBİ aktif.";
                applyAll();
            } else if(cmd.includes("say") || cmd.includes("sayım") || cmd.includes("araç")) {
                document.getElementById('modelSel').value = "0";
                document.getElementById('resSel').value = "480";
                targetLabel = cmd.includes("araç") ? "car" : null;
                log.innerText = `KOMUT: Sayım modu aktif. Hedef: ${targetLabel || "Tümü"}`;
                applyAll();
            } else {
                log.innerText = "Sistem komutu anlaşılamadı. Manuel ayar kullanın.";
            }
        };

        function renderLoop() {
            if(!isRunning) return;
            const now = performance.now();
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            const result = detector.detectForVideo(video, performance.now());
            detections = result.detections;

            detections.forEach(d => {
                const label = d.categories[0].categoryName;
                if(!targetLabel || label === targetLabel) {
                    const id = `${Math.floor(d.boundingBox.originX/50)}-${Math.floor(d.boundingBox.originY/50)}`;
                    if(!this.tracked) this.tracked = new Set();
                    if(!this.tracked.has(id)) {
                        this.tracked.add(id); count++;
                        localStorage.setItem('v42_c', count);
                        document.getElementById('count-tag').innerText = `SAYAÇ: ${count}`;
                    }
                }
            });
            draw();
            requestAnimationFrame(renderLoop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if(sensors.gyro) {
                savedAnchors.forEach(a => {
                    const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 45;
                    if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                        ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 12, 0, 7); ctx.fill();
                    }
                });
            }

            detections.forEach((d, i) => {
                const { originX, originY, width, height } = d.boundingBox;
                const score = d.categories[0].score;
                const rawLabel = d.categories[0].categoryName;
                const trLabel = LABEL_MAP[rawLabel] || rawLabel.toUpperCase();

                ctx.strokeStyle = rawLabel === targetLabel ? "#00e5ff" : (score > 0.6 ? "#00ff9d" : "#ffcc00");
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                if(sensors.bio) {
                    ctx.fillStyle = "rgba(0,0,0,0.85)";
                    const h = rawLabel === 'person' ? 75 : 30;
                    ctx.fillRect(originX, originY, width, h);
                    ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif";
                    
                    if(rawLabel === 'person') {
                        if(!scanData.has(i)) {
                            // Stabil Biyometri Matematiği
                            const seed = Math.abs(Math.floor(originX + originY));
                            scanData.set(i, {age: 18 + (seed % 40), eth: ETHNICS[seed % ETHNICS.length]});
                        }
                        let s = scanData.get(i);
                        ctx.fillText(`İNSAN | ~${s.age} YAŞ`, originX + 8, originY + 20);
                        ctx.font = "10px sans-serif"; ctx.fillStyle = "#00ff9d";
                        ctx.fillText(`KÖKEN: ${s.eth}`, originX + 8, originY + 40);
                        ctx.fillStyle = "#aaa";
                        ctx.fillText(`DOĞRULUK: %${Math.round(score*100)}`, originX + 8, originY + 60);
                    } else {
                        ctx.fillText(`${trLabel} | %${Math.round(score*100)}`, originX + 8, originY + 20);
                    }
                }
            });
        }

        window.toggleSensor = (type) => {
            sensors[type] = !sensors[type];
            document.getElementById(type+'Btn').innerText = `${type === 'gyro' ? '📍 JİROSKOP' : '🧬 BİYOMETRİ'}: ${sensors[type] ? 'AÇIK' : 'KAPALI'}`;
            document.getElementById(type+'Btn').style.borderColor = sensors[type] ? 'var(--accent)' : '#333';
            document.getElementById(type+'Btn').style.color = sensors[type] ? 'white' : '#666';
        };

        window.toggleAcc = (el) => {
            document.querySelectorAll('.acc-item').forEach(i => i.classList.remove('active'));
            el.parentElement.classList.add('active');
        };

        window.executeCmd = (cmd) => {
            if(cmd === 'CLEAR') { targetLabel = null; scanData.clear(); if(this.tracked) this.tracked.clear(); document.getElementById('log').innerText="Sistem temizlendi."; }
        };
        window.lockRadar = () => { if(detections[0]) savedAnchors.push({ alpha: deviceOri.alpha, label: detections[0].categories[0].categoryName }); };
        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; applyAll(); };
        window.addEventListener('deviceorientation', e => { if(e.alpha) deviceOri.alpha = e.alpha; });

        // Sistemi ilk açılışta güvenli başlat
        setTimeout(applyAll, 500);
    </script>
</body>
</html>
