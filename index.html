<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision PRO - Full Modül v2</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(15, 15, 15, 0.95); --accent: #ff3e3e; --blue: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: auto; }

        .hud-top { position: absolute; top: 15px; left: 15px; z-index: 500; display: flex; flex-wrap: wrap; gap: 8px; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--neon); text-transform: uppercase; }

        #control-panel {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 95%; max-width: 400px;
            background: var(--bg); border: 1px solid #444; border-radius: 12px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
        }
        
        .panel-header { padding: 12px 15px; background: #111; border-bottom: 1px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: var(--neon); }
        .panel-content { padding: 15px; display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; }
        
        label { font-size: 10px; color: #aaa; font-weight: bold; margin-bottom: 2px; display: block; text-transform: uppercase; }
        select, button { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; font-size: 12px; outline: none; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .action-btn { background: #333; color: white; border: 1px solid #555; text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 11px; }
        .action-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,157,0.1); }
        
        .primary-btn { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; padding: 12px; }
        .danger-btn { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; padding: 8px; border-radius: 4px; font-size: 10px; }

        #dynamic-save-btn {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1500;
            background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 30px;
            font-weight: bold; display: none; box-shadow: 0 0 15px rgba(255,62,62,0.5); cursor: pointer;
        }

        #load-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.95); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-text { color: var(--neon); font-size: 18px; font-weight: bold; letter-spacing: 2px; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="width:40px; height:40px; border:3px solid #333; border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite;"></div>
        <div class="loader-text">SİSTEM YÜKLENİYOR...</div>
    </div>

    <button id="dynamic-save-btn" onclick="saveCurrentObjectCoords()">📍 KONUMU KAYDET</button>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">HW: --</div>
        <div id="fps-tag" class="chip" style="color:var(--blue); border-color:var(--blue);">FPS: 0</div>
        <div id="count-tag" class="chip" style="color:#ffcc00; border-color:#ffcc00;">ANLIK: 0</div>
        <div id="total-tag" class="chip" style="color:#00ff9d; border-color:#00ff9d;">TOPLAM: 0</div>
        <div id="target-tag" class="chip" style="color:#ff3e3e; border-color:#ff3e3e; display:none;">HEDEF: --</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="togglePanel()">
            <span>⚙️ KOMUT VE AKSİYON MERKEZİ</span>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <label>MODLAR (AÇ/KAPAT)</label>
            <div class="action-grid">
                <button class="action-btn" id="btn-select" onclick="toggleMode('select')">🎯 HEDEF SEÇ <span id="ind-select">○</span></button>
                <button class="action-btn" id="btn-count" onclick="toggleMode('count')">🔢 TAKİPLİ SAYICI <span id="ind-count">OFF</span></button>
                <button class="action-btn" id="btn-pin" onclick="toggleMode('pin')">📍 KAYDEDİCİ <span id="ind-pin">OFF</span></button>
                <button class="action-btn" id="btn-sound" onclick="toggleMode('sound')">🔊 SES (BİP) <span id="ind-sound">OFF</span></button>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <button class="danger-btn" style="flex: 1;" onclick="resetCounter()">🔄 SAYACI SIFIRLA</button>
                <button class="danger-btn" style="flex: 1; background: #555;" onclick="clearPins()">🗑️ PİNLERİ TEMİZLE</button>
            </div>

            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">

            <label>DONANIM HIZLANDIRICI</label>
            <select id="hwSel">
                <option value="GPU">GPU (Grafik İşlemci)</option>
                <option value="CPU">CPU (Ana İşlemci)</option>
            </select>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>ÇÖZÜNÜRLÜK</label>
                    <select id="resSel">
                        <option value="720">720p</option>
                        <option value="1080" selected>1080p (Full HD)</option>
                        <option value="1440">1440p (2K)</option>
                        <option value="2160">2160p (4K)</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label>AI MODELİ</label>
                    <select id="modelSel">
                        <option value="0">Lite 0 (Ultra Hız)</option>
                        <option value="2">Lite 2 (Dengeli)</option>
                        <option value="4" selected>Lite 4 (Yüksek Hassasiyet)</option>
                    </select>
                </div>
            </div>

            <label>KAMERA KAYNAĞI</label>
            <select id="camSel"></select>

            <button class="primary-btn" onclick="applySettings()">SİSTEMİ YENİDEN BAŞLAT</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const dynamicBtn = document.getElementById('dynamic-save-btn');

        const trLabels = {
            "person": "İnsan", "bicycle": "Bisiklet", "car": "Araba", "motorcycle": "Motosiklet", "airplane": "Uçak",
            "bus": "Otobüs", "train": "Tren", "truck": "Kamyon", "boat": "Tekne", "traffic light": "Trafik Işığı",
            "fire hydrant": "Yangın Musluğu", "stop sign": "Dur İşareti", "parking meter": "Park Metresi", "bench": "Bank",
            "bird": "Kuş", "cat": "Kedi", "dog": "Köpek", "horse": "At", "sheep": "Koyun", "cow": "İnek",
            "elephant": "Fil", "bear": "Ayı", "zebra": "Zebra", "giraffe": "Zürafa", "backpack": "Sırt Çantası",
            "umbrella": "Şemsiye", "handbag": "El Çantası", "tie": "Kravat", "suitcase": "Bavul", "frisbee": "Frizbi",
            "skis": "Kayak", "snowboard": "Snowboard", "sports ball": "Top", "kite": "Uçurtma", "baseball bat": "Beyzbol Sopası",
            "baseball glove": "Beyzbol Eldiveni", "skateboard": "Kaykay", "surfboard": "Sörf Tahtası", "tennis racket": "Tenis Raketi",
            "bottle": "Şişe", "wine glass": "Kadeh", "cup": "Fincan", "fork": "Çatal", "knife": "Bıçak", "spoon": "Kaşık",
            "bowl": "Kase", "banana": "Muz", "apple": "Elma", "sandwich": "Sandviç", "orange": "Portakal", "broccoli": "Brokoli",
            "carrot": "Havuç", "hot dog": "Sosisli", "pizza": "Pizza", "donut": "Donat", "cake": "Kek", "chair": "Sandalye",
            "couch": "Kanepe", "potted plant": "Saksı Bitkisi", "bed": "Yatak", "dining table": "Yemek Masası", "toilet": "Tuvalet",
            "tv": "Televizyon", "laptop": "Laptop", "mouse": "Fare", "remote": "Kumanda", "keyboard": "Klavye", "cell phone": "Telefon",
            "microwave": "Mikrodalga", "oven": "Fırın", "toaster": "Ekmek Kızartma Makinesi", "sink": "Evye", "refrigerator": "Buzdolabı",
            "book": "Kitap", "clock": "Saat", "vase": "Vazo", "scissors": "Makas", "teddy bear": "Oyuncak Ayı", "hair drier": "Saç Kurutma", "toothbrush": "Diş Fırçası"
        };

        let detector, isRunning = false, lastTime = performance.now();
        let visionData;
        let sensorData = { alpha: 0, beta: 0 };
        
        let modes = { select: false, count: false, pin: false, sound: false };
        let selectedObjectLabel = null;
        
        // --- TAKİP VE SAYIM DEĞİŞKENLERİ ---
        let totalCount = 0;
        let objectHistory = []; // {x, y, label, lastSeen}
        let savedPins = []; 
        let lastDetections = [];

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (!modes.sound) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 850; gain.gain.value = 0.05;
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        async function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
            }
            window.addEventListener('deviceorientation', (e) => {
                sensorData.alpha = e.alpha || 0;
                sensorData.beta = e.beta || 0;
            });
        }

        async function getCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    if(d.label.toLowerCase().includes('back')) opt.selected = true;
                    opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
            } catch (e) {}
        }

        window.toggleMode = (m) => {
            modes[m] = !modes[m];
            if(m === 'pin' && modes[m]) {
                initSensors();
                dynamicBtn.style.display = 'block';
            } else if(m === 'pin' && !modes[m]) {
                dynamicBtn.style.display = 'none';
            }
            document.getElementById(`btn-${m}`).classList.toggle('active', modes[m]);
            document.getElementById(`ind-${m}`).innerText = modes[m] ? (m === 'select' ? '●' : 'ON') : (m === 'select' ? '○' : 'OFF');
            if(m === 'select' && !modes[m]) {
                selectedObjectLabel = null;
                document.getElementById('target-tag').style.display = 'none';
            }
        };

        window.resetCounter = () => {
            totalCount = 0;
            objectHistory = [];
            document.getElementById('total-tag').innerText = `TOPLAM: 0`;
        };

        window.clearPins = () => { savedPins = []; };

        window.togglePanel = () => {
            const content = document.getElementById('p-content');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
            document.getElementById('toggle-icon').innerText = content.style.display === 'none' ? '▲' : '▼';
        };

        canvas.addEventListener('click', (e) => {
            if(!modes.select) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            lastDetections.forEach(d => {
                const { originX, originY, width, height } = d.boundingBox;
                if(x > originX && x < originX + width && y > originY && y < originY + height) {
                    selectedObjectLabel = d.categories[0].categoryName;
                    const tag = document.getElementById('target-tag');
                    tag.innerText = `HEDEF: ${trLabels[selectedObjectLabel]?.toUpperCase() || selectedObjectLabel.toUpperCase()}`;
                    tag.style.display = 'block';
                    resetCounter(); // Hedef değişince sayacı sıfırla
                    playBeep();
                }
            });
        });

        window.saveCurrentObjectCoords = () => {
            const target = lastDetections.find(d => !selectedObjectLabel || d.categories[0].categoryName === selectedObjectLabel);
            if(target) {
                const { originX, originY, width, height } = target.boundingBox;
                pushPin(originX + width/2, originY + height/2, target.categories[0].categoryName);
            }
        };

        function pushPin(x, y, label) {
            savedPins.push({ x, y, label, a: sensorData.alpha, b: sensorData.beta });
            playBeep();
        }

        window.applySettings = async () => {
            isRunning = false; overlay.style.display = 'flex';
            const hwMode = document.getElementById('hwSel').value;
            const modelLevel = document.getElementById('modelSel').value;
            const resHeight = parseInt(document.getElementById('resSel').value);
            const deviceId = document.getElementById('camSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                // Yüksek Çözünürlük Desteği (4K'ya kadar zorlar)
                const constraints = { 
                    video: { 
                        deviceId: deviceId ? {exact: deviceId} : undefined, 
                        facingMode: "environment", 
                        width: { ideal: resHeight * 1.77 }, // 16:9 oranı
                        height: { ideal: resHeight } 
                    } 
                };

                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm");
                    
                    detector = await ObjectDetector.createFromOptions(visionData, {
                        baseOptions: { 
                            modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                            delegate: hwMode 
                        },
                        scoreThreshold: 0.45, runningMode: "VIDEO"
                    });

                    document.getElementById('hw-tag').innerText = `HW: ${hwMode}`;
                    overlay.style.display = 'none'; 
                    isRunning = true; renderLoop();
                };
            } catch (e) { alert("Hata: " + e.message); overlay.style.display = 'none'; }
        };

        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                lastDetections = result.detections;
                
                // Seçili hedef varsa sadece onu filtrele
                const activeDetections = selectedObjectLabel 
                    ? lastDetections.filter(d => d.categories[0].categoryName === selectedObjectLabel)
                    : lastDetections;

                // --- GELİŞMİŞ TAKİPLİ SAYICI MANTIĞI ---
                if(modes.count) {
                    activeDetections.forEach(det => {
                        const { originX, originY, width, height } = det.boundingBox;
                        const centerX = originX + width/2;
                        const centerY = originY + height/2;
                        const label = det.categories[0].categoryName;

                        // Yakınlarda zaten takip edilen bir nesne var mı?
                        let foundIndex = objectHistory.findIndex(obj => {
                            const dist = Math.sqrt(Math.pow(centerX - obj.x, 2) + Math.pow(centerY - obj.y, 2));
                            return dist < 80 && obj.label === label; // 80px tolerans
                        });

                        if(foundIndex !== -1) {
                            // Nesne zaten biliniyor, konumunu güncelle
                            objectHistory[foundIndex].x = centerX;
                            objectHistory[foundIndex].y = centerY;
                            objectHistory[foundIndex].lastSeen = now;
                        } else {
                            // Yeni bir nesne!
                            totalCount++;
                            objectHistory.push({ x: centerX, y: centerY, label: label, lastSeen: now });
                            playBeep();
                        }
                    });

                    // 1.5 saniye görülmeyen nesneleri listeden temizle (bellek yönetimi)
                    objectHistory = objectHistory.filter(obj => now - obj.lastSeen < 1500);

                    document.getElementById('count-tag').innerText = `ANLIK: ${activeDetections.length}`;
                    document.getElementById('total-tag').innerText = `TOPLAM: ${totalCount}`;
                }

                if(modes.sound && activeDetections.length > 0 && now % 800 < 50) playBeep();

                draw(activeDetections);
            } catch (err) { }
            requestAnimationFrame(renderLoop);
        }

        function draw(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Pinleri Çiz
            savedPins.forEach(p => {
                const xOff = (sensorData.alpha - p.a) * 10;
                const yOff = (sensorData.beta - p.b) * 10;
                ctx.fillStyle = "#ff3e3e";
                ctx.beginPath(); ctx.arc(p.x + xOff, p.y + yOff, 10, 0, 7); ctx.fill();
                ctx.fillStyle = "white"; ctx.font = "bold 12px sans-serif";
                ctx.fillText(trLabels[p.label]?.toUpperCase() || p.label.toUpperCase(), p.x + xOff + 12, p.y + yOff + 4);
            });

            // Nesne Karelerini Çiz
            detections.forEach((d) => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                const trName = trLabels[label] || label;
                const score = Math.round(d.categories[0].score * 100);

                ctx.strokeStyle = (label === selectedObjectLabel) ? "#ff3e3e" : "#00ff9d";
                ctx.lineWidth = (label === selectedObjectLabel) ? 5 : 3; 
                ctx.strokeRect(originX, originY, width, height);

                // Bilgi Etiketi
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(originX, originY - 30, width > 100 ? 100 : width, 30);
                ctx.fillStyle = "#fff"; ctx.font = "bold 14px sans-serif";
                ctx.fillText(`%${score} ${trName.toUpperCase()}`, originX + 5, originY - 10);
            });
        }

        getCameras().then(() => applySettings());
    </script>
</body>
</html>
