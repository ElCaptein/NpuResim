<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yapay Zeka Görüntü Tanıma Pro</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(15, 15, 15, 0.9); --accent: #ff3e3e; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: auto; }

        .hud-top { position: absolute; top: 15px; left: 15px; z-index: 500; display: flex; gap: 8px; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.7); border: 1px solid var(--neon); padding: 6px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--neon); text-transform: uppercase; }

        /* Panel aşağıya taşındı */
        #control-panel {
            position: absolute; bottom: 15px; right: 15px; z-index: 1000; width: 300px;
            background: var(--bg); border: 1px solid #444; border-radius: 12px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }
        
        .panel-header { padding: 12px 15px; background: #111; border-bottom: 1px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: var(--neon); }
        .panel-content { padding: 15px; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
        
        label { font-size: 10px; color: #aaa; font-weight: bold; margin-bottom: 2px; display: block; }
        select, button { width: 100%; padding: 8px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; font-size: 12px; outline: none; }
        
        .action-btn { background: #333; color: white; border: 1px solid #555; margin-bottom: 5px; text-align: left; display: flex; align-items: center; justify-content: space-between; }
        .action-btn.active { border-color: var(--neon); color: var(--neon); }
        
        .primary-btn { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 10px; padding: 12px; }
        
        #load-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-text { color: var(--neon); font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        
        /* Pin İşareti */
        .pin-ui { position: absolute; color: var(--accent); font-size: 24px; transform: translate(-50%, -100%); pointer-events: none; z-index: 10; font-weight: bold; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div class="loader-text">SİSTEM HAZIRLANIYOR...</div>
        <div id="status-text">Lütfen bekleyin</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">HW: BEKLENİYOR</div>
        <div id="fps-tag" class="chip" style="color:#00e5ff; border-color:#00e5ff;">FPS: 0</div>
        <div id="count-tag" class="chip" style="color:#ffcc00; border-color:#ffcc00;">SAYI: 0</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="togglePanel()">
            <span>⚙️ KOMUT MERKEZİ & AYARLAR</span>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <label>AKSİYONLAR</label>
            <button class="action-btn" id="btn-select" onclick="toggleMode('select')">🎯 NESNE SEÇ (TIKLA) <span id="ind-select">○</span></button>
            <button class="action-btn" id="btn-count" onclick="toggleMode('count')">🔢 NESNE SAY <span id="ind-count">OFF</span></button>
            <button class="action-btn" id="btn-pin" onclick="toggleMode('pin')">📍 YERİ KAYDET (IMU) <span id="ind-pin">OFF</span></button>
            <button class="action-btn" id="btn-sound" onclick="toggleMode('sound')">🔊 SESLİ UYARI <span id="ind-sound">OFF</span></button>

            <hr style="border: 0; border-top: 1px solid #333; margin: 5px 0;">

            <label>ÇÖZÜNÜRLÜK</label>
            <select id="resSel">
                <option value="480">480p (Hızlı)</option>
                <option value="720" selected>720p (Standart)</option>
                <option value="1080">1080p (Yüksek)</option>
            </select>

            <label>DONANIM HIZLANDIRICI</label>
            <select id="hwSel">
                <option value="GPU" selected>GPU (Önerilen)</option>
                <option value="CPU">CPU (Güvenli)</option>
            </select>

            <label>YAPAY ZEKA MODELİ</label>
            <select id="modelSel">
                <option value="0">Nano (Lite 0)</option>
                <option value="1">Standart (Lite 1)</option>
                <option value="2" selected>Dengeli HD (Lite 2)</option>
                <option value="4">Pro Model (Lite 4)</option>
            </select>

            <label>KAMERA KAYNAĞI</label>
            <select id="camSel"></select>

            <button class="primary-btn" onclick="applyAll()">SİSTEMİ YENİDEN BAŞLAT</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const statusText = document.getElementById('status-text');

        let detector, isRunning = false, lastTime = performance.now();
        let visionData;
        let sensorData = { alpha: 0, beta: 0, gamma: 0 };
        
        // Özellik Durumları
        let modes = { select: false, count: false, pin: false, sound: false };
        let selectedObjectLabel = null;
        let cumulativeCount = 0;
        let detectedObjectsSet = new Set();
        let savedPins = []; // {x, y, label, alpha, beta}

        // Ses Bağlamı (Beep sesi için)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (!modes.sound) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 880; gain.gain.value = 0.1;
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        // IMU / Sensör Erişimi
        function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }
            window.addEventListener('deviceorientation', (e) => {
                sensorData.alpha = e.alpha; // Pusula
                sensorData.beta = e.beta;   // Eğim
                sensorData.gamma = e.gamma;
            });
        }

        async function initCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId; opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
            } catch (e) { statusText.innerText = "Kamera izni hatası!"; }
        }

        window.toggleMode = (m) => {
            modes[m] = !modes[m];
            const btn = document.getElementById(`btn-${m}`);
            const ind = document.getElementById(`ind-${m}`);
            btn.classList.toggle('active', modes[m]);
            ind.innerText = modes[m] ? (m === 'select' ? '●' : 'ON') : (m === 'select' ? '○' : 'OFF');
            
            if(m === 'pin') initSensors();
            if(m === 'select' && !modes[m]) selectedObjectLabel = null;
        };

        window.togglePanel = () => {
            const content = document.getElementById('p-content');
            const icon = document.getElementById('toggle-icon');
            if(content.style.display === 'none') {
                content.style.display = 'flex';
                icon.innerText = '▼';
            } else {
                content.style.display = 'none';
                icon.innerText = '▲';
            }
        };

        canvas.addEventListener('click', (e) => {
            if(!modes.select && !modes.pin) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Tıklanan yerdeki nesneyi bul (Son render sonucundan)
            lastDetections.forEach(d => {
                const { originX, originY, width, height } = d.boundingBox;
                if(x > originX && x < originX + width && y > originY && y < originY + height) {
                    if(modes.select) {
                        selectedObjectLabel = d.categories[0].categoryName;
                        alert("Hedef Kilitlendi: " + selectedObjectLabel.toUpperCase());
                    }
                    if(modes.pin) {
                        savedPins.push({
                            x: originX + width/2,
                            y: originY + height/2,
                            label: d.categories[0].categoryName,
                            alpha: sensorData.alpha,
                            beta: sensorData.beta
                        });
                        playBeep();
                    }
                }
            });
        });

        async function createDetector(modelLevel, delegate) {
            return await ObjectDetector.createFromOptions(visionData, {
                baseOptions: { 
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                    delegate: delegate === "CPU" ? "CPU" : "GPU" 
                },
                scoreThreshold: 0.45, runningMode: "VIDEO"
            });
        }

        window.applyAll = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            statusText.innerText = "Yapay Zeka Modeli Yapılandırılıyor...";

            const res = parseInt(document.getElementById('resSel').value);
            const hwMode = document.getElementById('hwSel').value;
            const modelLevel = document.getElementById('modelSel').value;
            const deviceId = document.getElementById('camSel').value;

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: deviceId ? {exact: deviceId} : undefined, width: { ideal: 1920 }, height: { ideal: res } } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm");
                    
                    detector = await createDetector(modelLevel, hwMode);
                    document.getElementById('hw-tag').innerText = `HW: ${hwMode}`;
                    overlay.style.display = 'none'; 
                    isRunning = true; 
                    renderLoop();
                };
            } catch (e) { statusText.innerText = "Başlatma Hatası!"; }
        };

        let lastDetections = [];
        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                lastDetections = result.detections;
                processLogic(lastDetections);
                draw(lastDetections);
            } catch (err) { }
            requestAnimationFrame(renderLoop);
        }

        function processLogic(detections) {
            if(detections.length > 0 && modes.sound) playBeep();

            detections.forEach(d => {
                const label = d.categories[0].categoryName;
                
                // Sayma Mantığı
                if(modes.count && !detectedObjectsSet.has(label)) {
                    detectedObjectsSet.add(label);
                    cumulativeCount++;
                    document.getElementById('count-tag').innerText = `SAYI: ${cumulativeCount}`;
                }
            });
        }

        function draw(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Kayıtlı Pinleri Çiz (Basit IMU Telafisi)
            savedPins.forEach(pin => {
                // Kamera hareket ettikçe pini ekranda tutmaya çalış (Görsel temsil)
                let xOff = (sensorData.alpha - pin.alpha) * 10; 
                let yOff = (sensorData.beta - pin.beta) * 10;
                
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.arc(pin.x + xOff, pin.y + yOff, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.font = "bold 12px sans-serif";
                ctx.fillText("KAYITLI: " + pin.label.toUpperCase(), pin.x + xOff + 10, pin.y + yOff);
            });

            detections.forEach((d) => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                const score = Math.round(d.categories[0].score * 100);

                // Seçili nesne filtresi
                if(selectedObjectLabel && label !== selectedObjectLabel) {
                    ctx.globalAlpha = 0.2;
                } else {
                    ctx.globalAlpha = 1.0;
                }

                ctx.strokeStyle = label === selectedObjectLabel ? "#ff3e3e" : "#00ff9d";
                ctx.lineWidth = label === selectedObjectLabel ? 4 : 2; 
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(originX, originY - 25, width, 25);
                
                ctx.fillStyle = "#fff"; 
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(`${label.toUpperCase()} %${score}`, originX + 5, originY - 7);
                
                ctx.globalAlpha = 1.0;
            });
        }

        initCameras().then(() => applyAll());
    </script>
</body>
</html>
