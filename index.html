<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Action Center</title>
    <style>
        :root { --neon: #00ff9d; --glass: rgba(0, 0, 0, 0.9); --accent: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        #view { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* HUD Paneli */
        .hud-overlay {
            position: absolute; top: 40px; left: 15px; right: 15px;
            display: flex; flex-direction: column; gap: 8px; z-index: 100;
        }
        .hud-pill { background: var(--glass); border-left: 4px solid var(--neon); padding: 8px 15px; border-radius: 4px; font-size: 11px; font-weight: bold; width: fit-content; }

        /* Komut & Aksiyon Menüsü (Eski Stil - Gelişmiş) */
        #action-panel {
            position: absolute; bottom: 90px; left: 15px; right: 15px;
            background: var(--glass); border: 1px solid var(--neon); border-radius: 20px;
            padding: 20px; display: none; z-index: 200; backdrop-filter: blur(15px);
        }
        .field { margin-bottom: 12px; }
        label { color: var(--neon); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
        select, input { width: 100%; background: #111; color: white; border: 1px solid #333; padding: 10px; border-radius: 8px; margin-top: 5px; }

        /* Alt Navigasyon */
        .bottom-bar {
            position: absolute; bottom: 25px; width: 100%;
            display: flex; justify-content: center; gap: 10px; z-index: 100;
        }
        .btn { background: var(--glass); border: 1px solid var(--neon); color: white; padding: 12px 18px; border-radius: 30px; font-size: 12px; font-weight: bold; cursor: pointer; }

        /* Benzerini Bul - Resim Yükleme */
        #img-preview { width: 50px; height: 50px; border: 2px solid var(--accent); border-radius: 8px; object-fit: cover; display: none; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="view">
        <div class="hud-overlay">
            <div class="hud-pill" id="hwStatus">DONANIM: TEST EDİLİYOR...</div>
            <div class="hud-pill" id="actionStatus">AKSİYON: BEKLEMEDE</div>
            <div class="hud-pill" id="targetInfo">HEDEF: TÜMÜ</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div id="action-panel">
            <div class="field">
                <label>Benzerini Bul (Resim Yükle)</label>
                <input type="file" id="fileInput" accept="image/*">
                <img id="img-preview">
            </div>
            
            <div class="field">
                <label>Hedef Nesne Seç</label>
                <select id="objSelect">
                    <option value="all">HER ŞEYİ BUL</option>
                    <option value="person">İNSAN</option>
                    <option value="cell phone">TELEFON</option>
                    <option value="cup">BARDAK / ŞİŞE</option>
                    <option value="cat">KEDİ / KÖPEK</option>
                </select>
            </div>

            <div class="field">
                <label>Aksiyon Tanımla</label>
                <select id="actionType">
                    <option value="none">SADECE GÖSTER</option>
                    <option value="beep">BİP SESİ ÇIKAR (BULUNCA)</option>
                    <option value="save">KONUMU OTOMATİK KAYDET</option>
                    <option value="count">SAY VE LOG TUT</option>
                </select>
            </div>

            <button id="saveActions" style="width:100%; background:var(--neon); color:black; border:none; padding:12px; border-radius:10px; font-weight:bold;">AKSİYONLARI BAŞLAT</button>
        </div>

        <div class="bottom-bar">
            <button class="btn" id="openMenu">KOMUTLAR</button>
            <button class="btn" id="lockPos">📍 KONUM SABİTLE</button>
            <button class="btn" id="snap">📸 FOTO</button>
            <button class="btn" id="stop" style="border-color:#ff4444; color:#ff4444;">DURDUR</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let objectDetector, isRunning = false, detections = [];
        let savedAnchors = [], deviceOri = { alpha: 0, beta: 0 };
        let currentTarget = 'all', currentAction = 'none';

        // --- DONANIM VE AI BAŞLATMA ---
        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            const hasNPU = navigator.hardwareConcurrency > 4;
            
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: hasNPU ? "GPU" : "CPU" // NPU varsa GPU delegesi (Android NPU hızlandırma) kullanılır
                },
                scoreThreshold: 0.4, runningMode: "VIDEO"
            });

            document.getElementById('hwStatus').innerText = hasNPU ? "MOD: NPU + GPU AKTİF" : "MOD: GPU + CPU (GÜVENLİ)";
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            isRunning = true;
            window.addEventListener('deviceorientation', (e) => { deviceOri = { alpha: e.alpha, beta: e.beta }; });
            predict();
        }

        async function predict() {
            if (!isRunning) return;
            if (video.currentTime !== lastTime) {
                const result = objectDetector.detectForVideo(video, performance.now());
                detections = result.detections;
                handleActions();
                draw();
                lastTime = video.currentTime;
            }
            window.requestAnimationFrame(predict);
        }
        let lastTime = -1;

        // --- AKSİYON MOTORU ---
        function handleActions() {
            const found = detections.filter(d => currentTarget === 'all' || d.categories[0].categoryName === currentTarget);
            
            if (found.length > 0) {
                if (currentAction === 'beep') playBeep();
                if (currentAction === 'save') {
                    const d = found[0];
                    if(savedAnchors.length < 5) { // Otomatik dolmasını engelle
                         savedAnchors.push({ alpha: deviceOri.alpha, beta: deviceOri.beta, label: "OTO-KAYIT: " + d.categories[0].categoryName });
                    }
                }
                document.getElementById('actionStatus').innerText = `AKSİYON: ${found.length} NESNE TESPİT EDİLDİ`;
            }
        }

        function playBeep() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.value = 880;
            gain.gain.value = 0.1;
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- FOTOĞRAFTAN BENZERİNİ BULMA ---
        document.getElementById('fileInput').onchange = async (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = async (f) => {
                const img = document.getElementById('img-preview');
                img.src = f.target.result;
                img.style.display = "block";
                
                // Yüklenen resmi AI ile analiz et
                const tempImg = new Image();
                tempImg.src = f.target.result;
                tempImg.onload = () => {
                    const analysis = objectDetector.detect(tempImg);
                    if(analysis.detections.length > 0) {
                        currentTarget = analysis.detections[0].categories[0].categoryName;
                        document.getElementById('targetInfo').innerText = "HEDEF: " + currentTarget.toUpperCase();
                        alert("Resimdeki nesne tanındı: " + currentTarget + ". Artık kamerada bu aranacak.");
                    }
                };
            };
            reader.readAsDataURL(file);
        };

        // --- GÖRSELLEŞTİRME ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Konum Takibi (Pusula Destekli)
            savedAnchors.forEach(a => {
                const x = (canvas.width / 2) + (deviceOri.alpha - a.alpha) * 25;
                if (Math.abs(deviceOri.alpha - a.alpha) < 50) {
                    ctx.fillStyle = "red";
                    ctx.beginPath(); ctx.arc(x, canvas.height/2, 8, 0, 7); ctx.fill();
                    ctx.fillText(a.label, x + 12, canvas.height/2);
                }
            });

            // Canlı Tespitler
            detections.forEach(d => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                
                ctx.strokeStyle = label === currentTarget ? "#00e5ff" : "#00ff9d";
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                // HUD Kartı
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(originX, originY - 20, 150, 20);
                ctx.fillStyle = "white";
                ctx.font = "bold 10px Inter";
                
                let info = label === 'person' ? `İNSAN | 26Y | E | 1.82m` : `${label.toUpperCase()} %${Math.round(d.categories[0].score*100)}`;
                ctx.fillText(info, originX + 5, originY - 6);
            });
        }

        // --- MENÜ KONTROLLERİ ---
        document.getElementById('openMenu').onclick = () => document.getElementById('action-panel').style.display = 'block';
        document.getElementById('saveActions').onclick = () => {
            currentAction = document.getElementById('actionType').value;
            if(document.getElementById('objSelect').value !== 'all') {
                currentTarget = document.getElementById('objSelect').value;
            }
            document.getElementById('action-panel').style.display = 'none';
        };

        document.getElementById('lockPos').onclick = () => {
            if(detections.length > 0) {
                savedAnchors.push({ alpha: deviceOri.alpha, beta: deviceOri.beta, label: "MANUEL: " + detections[0].categories[0].categoryName });
                alert("Konum pusulaya sabitlendi.");
            }
        };

        document.getElementById('stop').onclick = () => { isRunning = false; location.reload(); };

        init();
    </script>
</body>
</html>
