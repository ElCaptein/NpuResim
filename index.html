<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sensor-Fused AI Vision</title>
    <style>
        :root { --neon: #00ff9d; --glass: rgba(0, 0, 0, 0.8); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #main-ui { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Üst Sensör Paneli */
        .sensor-hud {
            position: absolute; top: 40px; left: 10px; right: 10px;
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; z-index: 100;
        }
        .s-item { background: var(--glass); border: 1px solid var(--neon); color: var(--neon); padding: 5px; border-radius: 5px; font-size: 9px; text-align: center; }

        /* Komut ve Aksiyon Menüsü */
        .side-bar { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 20px; z-index: 100; }
        .btn { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--neon); background: var(--glass); color: white; display: flex; flex-size: 24px; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        
        #shutter { background: #fff; border: 4px solid var(--neon); }

        /* Komut Giriş Alanı */
        #cmd-overlay {
            position: absolute; bottom: 100px; left: 20px; right: 20px;
            background: var(--glass); padding: 15px; border-radius: 15px; border: 1px solid #444;
            display: none; z-index: 150;
        }
    </style>
</head>
<body>

    <div id="main-ui">
        <div class="sensor-hud">
            <div class="s-item">PITCH: <span id="pitch">0</span>°</div>
            <div class="s-item">ROLL: <span id="roll">0</span>°</div>
            <div class="s-item">FPS: <span id="fps">0</span></div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div class="side-bar">
            <div class="btn" id="flipBtn">🔄</div>
            <div class="btn" id="shutter">📸</div>
            <div class="btn" id="lockBtn">📍</div>
            <div class="btn" id="menuBtn">⚙️</div>
        </div>

        <div id="cmd-overlay">
            <label style="color:var(--neon); font-size:12px;">HASSASİYET (NPU)</label>
            <input type="range" id="conf" min="10" max="90" value="50" style="width:100%">
            <div style="display:flex; justify-content: space-between; margin-top:10px;">
                <button id="saveConfig" style="background:var(--neon); border:none; padding:8px 20px; border-radius:5px; font-weight:bold;">UYGULA</button>
                <button id="closeCmd" style="background:#444; border:none; color:white; padding:8px 20px; border-radius:5px;">KAPAT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        
        let objectDetector;
        let detections = [];
        let savedAnchors = []; // Sensör destekli mekansal hafıza
        let deviceOri = { alpha: 0, beta: 0, gamma: 0 };
        let currentFacingMode = "environment";

        // --- 1. SENSÖR VERİLERİNİ BAŞLAT ---
        function initSensors() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().catch(console.error);
            }
            window.addEventListener('deviceorientation', (e) => {
                deviceOri.alpha = e.alpha || 0; // Pusula
                deviceOri.beta = e.beta || 0;   // Ön-Arka (Pitch)
                deviceOri.gamma = e.gamma || 0; // Sağ-Sol (Roll)
                document.getElementById('pitch').innerText = Math.round(deviceOri.beta);
                document.getElementById('roll').innerText = Math.round(deviceOri.gamma);
            });
        }

        // --- 2. YAPAY ZEKA (NPU) KURULUMU ---
        async function initAI(threshold = 0.5) {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: "GPU" // NPU ve GPU'nun ortaklaşa çalışması için delegasyon
                },
                scoreThreshold: threshold,
                runningMode: "VIDEO"
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: 1280, height: 720 }
            });
            video.srcObject = stream;
            video.onloadeddata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                predict();
            };
        }

        // --- 3. ANALİZ VE RENDER (GPU DESTEKLİ) ---
        async function predict() {
            if (video.currentTime !== lastVideoTime) {
                const startTime = performance.now();
                const result = objectDetector.detectForVideo(video, startTime);
                detections = result.detections;
                renderFrame();
                lastVideoTime = video.currentTime;
            }
            window.requestAnimationFrame(predict);
        }

        let lastVideoTime = -1;

        function renderFrame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Kayıtlı Konumları Sensör Verisiyle Güncelle (Basit Kaydırma)
            savedAnchors.forEach(anchor => {
                // Telefonun eğimine göre kutuyu hayali olarak kaydırıyoruz
                const xOffset = (deviceOri.gamma - anchor.initGamma) * 15;
                const yOffset = (deviceOri.beta - anchor.initBeta) * 15;

                ctx.strokeStyle = "red";
                ctx.lineWidth = 2;
                ctx.setLineDash([10, 5]);
                ctx.strokeRect(anchor.x + xOffset, anchor.y + yOffset, anchor.w, anchor.h);
                ctx.fillStyle = "red";
                ctx.fillText(`KAYITLI: ${anchor.label}`, anchor.x + xOffset, anchor.y - 10);
                ctx.setLineDash([]);
            });

            // Aktif NPU Tespitlerini Çiz (GPU üzerinden render)
            detections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = det.categories[0].categoryName.toUpperCase();
                const score = Math.round(det.categories[0].score * 100);

                ctx.strokeStyle = "#00ff9d";
                ctx.lineWidth = 5;
                ctx.strokeRect(originX, originY, width, height);
                ctx.fillStyle = "#00ff9d";
                ctx.font = "bold 20px Inter";
                ctx.fillText(`${label} %${score}`, originX, originY - 10);
            });
        }

        // --- 4. AKSIYONLAR VE KAYIT ---
        document.getElementById('lockBtn').onclick = () => {
            initSensors();
            savedAnchors = detections.map(d => ({
                x: d.boundingBox.originX,
                y: d.boundingBox.originY,
                w: d.boundingBox.width,
                h: d.boundingBox.height,
                label: d.categories[0].categoryName,
                initAlpha: deviceOri.alpha,
                initBeta: deviceOri.beta,
                initGamma: deviceOri.gamma
            }));
            alert(detections.length + " Nesne Hafızaya Sabitlendi.");
        };

        document.getElementById('shutter').onclick = () => {
            const captureCanvas = document.createElement('canvas');
            captureCanvas.width = video.videoWidth;
            captureCanvas.height = video.videoHeight;
            const cCtx = captureCanvas.getContext('2d');

            // Görüntüyü ve Analiz Verilerini Birleştir
            cCtx.drawImage(video, 0, 0);
            cCtx.strokeStyle = "yellow";
            cCtx.lineWidth = 10;
            detections.forEach(d => {
                cCtx.strokeRect(d.boundingBox.originX, d.boundingBox.originY, d.boundingBox.width, d.boundingBox.height);
                cCtx.fillStyle = "yellow";
                cCtx.font = "bold 40px sans-serif";
                cCtx.fillText(d.categories[0].categoryName, d.boundingBox.originX, d.boundingBox.originY - 20);
            });

            // Dosyayı İndir
            const data = captureCanvas.toDataURL("image/png");
            const link = document.createElement('a');
            link.download = `AI_REPORT_${Date.now()}.png`;
            link.href = data;
            link.click();
        };

        // Menü ve Ayar Geçişleri
        document.getElementById('menuBtn').onclick = () => document.getElementById('cmd-overlay').style.display = 'block';
        document.getElementById('closeCmd').onclick = () => document.getElementById('cmd-overlay').style.display = 'none';
        document.getElementById('saveConfig').onclick = () => {
            const newThresh = document.getElementById('conf').value / 100;
            initAI(newThresh);
            document.getElementById('cmd-overlay').style.display = 'none';
        };

        document.getElementById('flipBtn').onclick = () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        };

        initAI();
    </script>
</body>
</html>
