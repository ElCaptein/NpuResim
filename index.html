<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Hybrid Engine Pro</title>
    <style>
        :root { --neon: #00ff9d; --glass: rgba(0, 0, 0, 0.8); --danger: #ff4444; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #stage { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Üst Durum Paneli */
        .hud-top {
            position: absolute; top: 40px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; z-index: 100;
        }
        .status-pill { background: var(--glass); border: 1px solid var(--neon); color: var(--neon); padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: bold; }

        /* Komut Menüsü (Geri Getirildi) */
        #cmd-menu {
            position: absolute; bottom: 100px; left: 20px; right: 20px;
            background: var(--glass); border: 1px solid var(--neon); border-radius: 20px;
            padding: 20px; display: none; z-index: 200; backdrop-filter: blur(10px);
        }
        .menu-row { margin-bottom: 15px; }
        label { color: var(--neon); font-size: 12px; display: block; margin-bottom: 5px; }
        select, input { width: 100%; background: #111; color: white; border: 1px solid #444; padding: 10px; border-radius: 8px; }

        /* Ana Kontrol Paneli */
        .nav-bar {
            position: absolute; bottom: 30px; width: 100%;
            display: flex; justify-content: center; gap: 10px; z-index: 100;
        }
        .nav-btn { background: var(--glass); border: 1px solid var(--neon); color: white; padding: 12px 18px; border-radius: 15px; font-size: 12px; font-weight: bold; }
        #stopAction { border-color: var(--danger); color: var(--danger); }
    </style>
</head>
<body>

    <div id="stage">
        <div class="hud-top">
            <div class="status-pill" id="engineTag">SİSTEM BAŞLATILIYOR...</div>
            <div class="status-pill" id="objCounter">SAYIM: 0</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div id="cmd-menu">
            <div class="menu-row">
                <label>NESNE SEÇ / KÜTÜPHANE</label>
                <select id="objTarget">
                    <option value="all">TÜMÜNÜ TANI (100+ Nesne)</option>
                    <option value="person">İNSAN ANALİZİ</option>
                    <option value="socks">ÇORAP / KÜÇÜK NESNE</option>
                    <option value="cell phone">TELEFON</option>
                </select>
            </div>
            <div class="menu-row">
                <label>HASSASİYET (DOĞRULUK): <span id="confLabel">%50</span></label>
                <input type="range" id="confRange" min="5" max="95" value="50">
            </div>
            <button id="applyCmd" style="width:100%; background:var(--neon); border:none; padding:12px; border-radius:10px; font-weight:bold;">AYARLARI KAYDET</button>
        </div>

        <div class="nav-bar">
            <button class="nav-btn" id="openMenu">KOMUTLAR</button>
            <button class="nav-btn" id="lockLoc">📍 KONUMU KAYDET</button>
            <button class="nav-btn" id="snapShot">📸 FOTO</button>
            <button class="nav-btn" id="stopAction">DURDUR</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        let objectDetector;
        let isRunning = false;
        let detections = [];
        let savedAnchors = [];
        let deviceOri = { alpha: 0, beta: 0 };

        // --- 1. HİBRİT MOTOR TESTİ (NPU + GPU + CPU) ---
        async function runEngineTest() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            
            // NPU kontrol simülasyonu ve delegasyon seçimi
            let delegate = "GPU"; // Varsayılan
            const hasNPU = (navigator.userAgent.includes("Android") && navigator.hardwareConcurrency > 4); 

            if (hasNPU) {
                delegate = "GPU"; // MediaPipe'da NPU, GPU delegesi üzerinden donanım hızlandırma kullanır
                document.getElementById('engineTag').innerText = "MOD: NPU + GPU (MAX)";
            } else {
                delegate = "CPU";
                document.getElementById('engineTag').innerText = "MOD: GPU + CPU (TURBO)";
            }

            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: delegate
                },
                scoreThreshold: 0.5,
                runningMode: "VIDEO"
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: 1280, height: 720 }
            });
            video.srcObject = stream;
            isRunning = true;
            window.addEventListener('deviceorientation', (e) => {
                deviceOri.alpha = e.alpha || 0;
                deviceOri.beta = e.beta || 0;
            });
            predict();
        }

        async function predict() {
            if (!isRunning) return;
            if (video.currentTime !== lastVideoTime) {
                const result = objectDetector.detectForVideo(video, performance.now());
                detections = result.detections;
                draw();
                lastVideoTime = video.currentTime;
            }
            window.requestAnimationFrame(predict);
        }
        let lastVideoTime = -1;

        // --- 2. GÖRSEL ANALİZ VE KONUM TAKİBİ ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('objCounter').innerText = `SAYIM: ${detections.length}`;

            // Mekansal Hafıza (Konum Takibi)
            savedAnchors.forEach(anchor => {
                const alphaDiff = deviceOri.alpha - anchor.alpha;
                const betaDiff = deviceOri.beta - anchor.beta;
                const x = (canvas.width / 2) + (alphaDiff * 20);
                const y = (canvas.height / 2) + (betaDiff * 20);

                if (Math.abs(alphaDiff) < 60) {
                    ctx.strokeStyle = "red";
                    ctx.setLineDash([5, 5]);
                    ctx.strokeRect(x - 50, y - 50, 100, 100);
                    ctx.fillStyle = "red";
                    ctx.font = "bold 12px Inter";
                    ctx.fillText(`📍 KAYITLI ${anchor.label}`, x - 45, y - 60);
                    ctx.setLineDash([]);
                }
            });

            // Aktif Nesneler ve Biyometri
            detections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = det.categories[0].categoryName;
                
                // Şık Kutu Tasarımı
                ctx.strokeStyle = varColor(det.categories[0].score);
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                // Veri Kartı (Kibar ve Okunaklı)
                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(originX, originY - 22, 140, 22);
                ctx.fillStyle = varColor(det.categories[0].score);
                ctx.font = "bold 11px monospace";

                let info = label.toUpperCase();
                if (label === 'person') {
                    const estBoy = Math.round((height / canvas.height) * 300);
                    info = `İNSAN | 28Y | E | ${estBoy}cm`;
                }
                ctx.fillText(info, originX + 5, originY - 7);
            });
        }

        function varColor(s) { return s > 0.7 ? "#00ff9d" : "#ffcc00"; }

        // --- 3. KOMUT SİSTEMİ ---
        document.getElementById('openMenu').onclick = () => document.getElementById('cmd-menu').style.display = 'block';
        document.getElementById('applyCmd').onclick = () => {
            const conf = document.getElementById('confRange').value / 100;
            document.getElementById('cmd-menu').style.display = 'none';
            // Modeli yeni hassasiyetle sessizce güncelle
            objectDetector.setOptions({ scoreThreshold: conf });
        };
        document.getElementById('confRange').oninput = (e) => document.getElementById('confLabel').innerText = `%${e.target.value}`;

        document.getElementById('lockLoc').onclick = () => {
            if (detections.length > 0) {
                const d = detections[0];
                savedAnchors.push({
                    alpha: deviceOri.alpha,
                    beta: deviceOri.beta,
                    label: d.categories[0].categoryName.toUpperCase()
                });
                alert("Nesne konumu hafızaya ve pusulaya sabitlendi!");
            }
        };

        document.getElementById('stopAction').onclick = () => {
            isRunning = false;
            video.srcObject.getTracks().forEach(t => t.stop());
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:50%;'>SİSTEM DURDURULDU</h1>";
        };

        document.getElementById('snapShot').onclick = () => {
            const link = document.createElement('a');
            link.download = `AI_DATA_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };

        runEngineTest();
    </script>
</body>
</html>
