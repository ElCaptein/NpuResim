<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poco X7 Pro - Hyper AI Vision</title>
    <style>
        :root { --neon: #00ff9d; --bg: #050505; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        #main-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* Kamera Alanı */
        #camera-wrapper { position: relative; flex-grow: 1; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Arayüz Paneli */
        .ui-panel { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); padding: 20px 0; border-top: 1px solid var(--neon); display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .btn-group { display: flex; gap: 10px; width: 90%; }
        button { flex: 1; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        
        #startBtn { background: var(--neon); color: black; }
        #captureBtn { background: #ffffff; color: black; display: none; }
        
        .info-bar { font-size: 11px; color: var(--neon); font-family: monospace; }
    </style>
</head>
<body>

    <div id="main-container">
        <div id="camera-wrapper">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="output_canvas"></canvas>
        </div>

        <div class="ui-panel">
            <div class="info-bar" id="status">SİSTEM: HAZIR | MODEL: EFFICIENTDET-L2</div>
            <div class="btn-group">
                <button id="startBtn">SİSTEMİ BAŞLAT</button>
                <button id="captureBtn">FOTOĞRAF ÇEK VE KAYDET</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');

        let objectDetector;
        let lastVideoTime = -1;
        let currentDetections = [];

        // --- TÜRKÇE NESNE SÖZLÜĞÜ (Genişletilmiş) ---
        const labelsTR = {
            'person': 'İNSAN', 'chair': 'SANDALYE/KOLTUK', 'couch': 'KOLTUK/KANEPE',
            'dining table': 'YEMEK MASASI', 'bed': 'YATAK', 'potted plant': 'SAKSI BİTKİSİ',
            'tv': 'TELEVİZYON/MONİTÖR', 'laptop': 'BİLGİSAYAR', 'cell phone': 'CEP TELEFONU',
            'bottle': 'ŞİŞE', 'cup': 'BARDAK', 'backpack': 'ÇANTA', 'handbag': 'EL ÇANTASI',
            'book': 'KİTAP', 'clock': 'SAAT', 'vase': 'VAZO', 'scissors': 'MAKAS',
            'mouse': 'FARE', 'keyboard': 'KLAVYE', 'remote': 'KUMANDA'
        };

        async function init() {
            status.innerText = "YAPAY ZEKA YÜKLENİYOR...";
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: "GPU"
                },
                scoreThreshold: 0.5, // Doğruluk için eşik değer
                runningMode: "VIDEO"
            });
            status.innerText = "SİSTEM: AKTİF | MODEL: ÇEVRİMİÇİ";
        }

        startBtn.onclick = async () => {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: 1280, height: 720 }
            });
            video.srcObject = stream;
            video.onloadeddata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                startBtn.style.display = "none";
                captureBtn.style.display = "block";
                predict();
            };
        };

        async function predict() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                const detections = objectDetector.detectForVideo(video, performance.now());
                currentDetections = detections.detections;
                draw(currentDetections);
            }
            window.requestAnimationFrame(predict);
        }

        function draw(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            detections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = labelsTR[det.categories[0].categoryName] || det.categories[0].categoryName.toUpperCase();
                const score = Math.round(det.categories[0].score * 100);

                // Görsel Tasarım
                ctx.strokeStyle = "#00ff9d";
                ctx.lineWidth = 5;
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "#00ff9d";
                ctx.font = "bold 24px Arial";
                ctx.fillText(`${label} %${score}`, originX, originY - 10);
            });
        }

        // --- FOTOĞRAF ÇEKME VE DIŞARI AKTARMA ---
        captureBtn.onclick = () => {
            // Geçici bir canvas oluştur (Video + İşaretlemeler birleşecek)
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = video.videoWidth;
            exportCanvas.height = video.videoHeight;
            const eCtx = exportCanvas.getContext('2d');

            // 1. Videodaki anlık görüntüyü çiz
            eCtx.drawImage(video, 0, 0);

            // 2. Yapay zeka kutularını üzerine çiz
            currentDetections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = labelsTR[det.categories[0].categoryName] || det.categories[0].categoryName.toUpperCase();
                
                eCtx.strokeStyle = "red";
                eCtx.lineWidth = 6;
                eCtx.strokeRect(originX, originY, width, height);
                
                eCtx.fillStyle = "red";
                eCtx.font = "bold 30px Arial";
                eCtx.fillText(label, originX, originY - 15);
            });

            // 3. Dosya olarak indir
            const link = document.createElement('a');
            link.download = `AI_Analiz_${Date.now()}.png`;
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
            
            status.innerText = "FOTOĞRAF GALERİYE KAYDEDİLDİ!";
            setTimeout(() => status.innerText = "SİSTEM: AKTİF", 2000);
        };

        init();
    </script>
</body>
</html>
