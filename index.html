<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v26 Pure</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Kamera Görüntüsü */
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Üst Bilgi Paneli (HUD) */
        .hud { position: absolute; top: 40px; left: 10px; z-index: 500; display: flex; flex-direction: column; gap: 5px; }
        .tag { background: rgba(0,0,0,0.7); color: var(--neon); padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; border-left: 3px solid var(--neon); }
        .tag-blue { color: var(--accent); border-left-color: var(--accent); }

        /* Komutlar Menüsü */
        #menu { 
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000;
            background: rgba(15,15,15,0.95); border-radius: 15px; border: 1px solid #333; padding: 15px;
        }
        select, .btn { 
            width: 100%; padding: 12px; margin-top: 8px; border-radius: 10px; 
            background: #222; color: white; border: 1px solid #444; font-size: 13px; outline: none;
        }
        .btn-neon { background: var(--neon); color: #000; font-weight: bold; border: none; }
        .grid { display: flex; gap: 8px; }
        
        #status { position: absolute; top: 120px; width: 100%; text-align: center; color: var(--accent); font-size: 12px; display: none; z-index: 600; font-weight: bold; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div class="hud">
        <div id="fpsTag" class="tag">SİSTEM: BAŞLATILIYOR...</div>
        <div id="countTag" class="tag tag-blue">TOPLAM KAYIT: 0</div>
    </div>

    <div id="status">🧬 ANALİZ EDİLİYOR... KAFANIZI OYNATIN</div>

    <div id="menu">
        <div class="grid">
            <select id="objFilter">
                <option value="person">İNSAN SAYACİ</option>
                <option value="car">ARAÇ SAYACİ</option>
                <option value="all">HER ŞEYİ GÖR</option>
            </select>
            <select id="pwrMode" onchange="setPower()">
                <option value="0">DENGELİ (30 FPS)</option>
                <option value="200">GÜÇ TASARRUFU (5 FPS)</option>
            </select>
        </div>

        <div class="grid" style="margin-top:8px;">
            <button class="btn" onclick="toggleBio()" id="bioBtn">BİYOMETRİK: KAPALI</button>
            <button class="btn" onclick="flipCam()">🔄 KAMERA DEĞİŞTİR</button>
        </div>

        <button class="btn btn-neon" onclick="resetAll()">🧹 VERİLERİ VE SAYACI SIFIRLA</button>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let detector, isRunning = false;
        let detections = [], fpsDelay = 0, currentFacing = "environment";
        let bioActive = false, scanData = new Map();
        let totalCount = parseInt(localStorage.getItem('pure_total')) || 0;
        let trackedSet = new Set();

        const ETHNICS = ["Anadolu", "Avrupa", "Asya", "Akdeniz"];

        async function init() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
                        delegate: "GPU" 
                    },
                    scoreThreshold: 0.5, runningMode: "VIDEO"
                });
                startCamera();
            } catch (e) {
                document.getElementById('fpsTag').innerText = "HATA: Kamera veya NPU başlatılamadı!";
            }
        }

        async function startCamera() {
            const constraints = { video: { facingMode: currentFacing, width: 640, height: 480 } };
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true;
                document.getElementById('fpsTag').innerText = "SİSTEM: AKTİF (NPU+GPU)";
                render();
            };
        }

        function render() {
            if(!isRunning) return;
            
            const now = performance.now();
            const res = detector.detectForVideo(video, now);
            const filter = document.getElementById('objFilter').value;
            
            // Filtreleme ve Sayma
            detections = res.detections.filter(d => filter === 'all' || d.categories[0].categoryName === filter);
            
            detections.forEach(d => {
                const id = `${Math.round(d.boundingBox.originX/40)}-${Math.round(d.boundingBox.originY/40)}`;
                if(!trackedSet.has(id)) {
                    trackedSet.add(id);
                    totalCount++;
                    localStorage.setItem('pure_total', totalCount);
                    document.getElementById('countTag').innerText = `TOPLAM KAYIT: ${totalCount}`;
                }
            });
            if(trackedSet.size > 50) trackedSet.clear();

            draw();

            if(fpsDelay > 0) {
                setTimeout(() => requestAnimationFrame(render), fpsDelay);
            } else {
                requestAnimationFrame(render);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let bioVisible = false;

            detections.forEach((d, i) => {
                const { originX, originY, width, height } = d.boundingBox;
                
                // Kutu Çizimi
                ctx.strokeStyle = varColor(d.categories[0].score);
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                // Biyometrik Veri
                if(bioActive && d.categories[0].categoryName === 'person') {
                    bioVisible = true;
                    if(!scanData.has(i)) {
                        scanData.set(i, {p:0, age:20+(originX%30), eth:ETHNICS[Math.floor(originX%4)]});
                    }
                    let s = scanData.get(i);
                    if(s.p < 100) s.p += 2;

                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.fillRect(originX, originY - 30, width, 25);
                    ctx.fillStyle = "#fff";
                    ctx.font = "bold 11px sans-serif";
                    ctx.fillText(s.p < 100 ? `ANALİZ: %${s.p}` : `${s.age} Yaş | ${s.eth}`, originX + 5, originY - 12);
                }
            });
            document.getElementById('status').style.display = bioVisible ? "block" : "none";
        }

        function varColor(s) { return s > 0.7 ? "#00ff9d" : "#ffcc00"; }

        // Global Fonksiyonlar
        window.setPower = () => { fpsDelay = parseInt(document.getElementById('pwrMode').value); };
        window.toggleBio = () => {
            bioActive = !bioActive;
            document.getElementById('bioBtn').innerText = bioActive ? "BİYOMETRİK: AÇIK" : "BİYOMETRİK: KAPALI";
            if(!bioActive) scanData.clear();
        };
        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; startCamera(); };
        window.resetAll = () => { totalCount = 0; localStorage.setItem('pure_total', 0); location.reload(); };

        init();
    </script>
</body>
</html>
