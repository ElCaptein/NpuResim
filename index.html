<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision v67 - Analiz Sürümü</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(15, 15, 15, 0.85); --gold: #ffcc00; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: none; }

        .hud-top { position: absolute; top: 15px; left: 15px; z-index: 500; display: flex; gap: 8px; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.7); border: 1px solid var(--neon); padding: 6px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; color: var(--neon); }

        #control-panel {
            position: absolute; top: 15px; right: 15px; z-index: 1000; width: 280px;
            background: var(--bg); border: 1px solid #333; border-radius: 12px; backdrop-filter: blur(10px);
            display: flex; flex-direction: column; overflow: hidden; transition: 0.3s;
        }
        
        .panel-header { padding: 12px 15px; background: #000; border-bottom: 1px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: bold; color: var(--neon); }
        
        /* Kaydırılabilir İçerik Alanı */
        .panel-content { padding: 15px; display: flex; flex-direction: column; gap: 12px; max-height: 55vh; overflow-y: auto; }
        /* Scrollbar Gizleme/İnceltme */
        .panel-content::-webkit-scrollbar { width: 6px; }
        .panel-content::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
        
        label { font-size: 11px; color: #aaa; font-weight: bold; }
        select, button { width: 100%; padding: 10px; background: #222; border: 1px solid #444; color: white; border-radius: 6px; font-size: 12px; outline: none; }
        button { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; margin-top: 5px; }
        button:hover { opacity: 0.8; }
        
        .btn-bio { background: var(--gold); border: 1px solid #b38f00; }

        #load-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-text { color: var(--neon); font-size: 20px; font-weight: bold; letter-spacing: 2px; }
        #status-text { color: #888; font-size: 11px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div class="loader-text">SİSTEM YÜKLENİYOR...</div>
        <div id="status-text">Lütfen bekleyin</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">HW: BEKLENİYOR</div>
        <div id="fps-tag" class="chip" style="color:#00e5ff; border-color:#00e5ff;">FPS: 0</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" id="menuToggle">
            <span>⚙️ AYARLARI GİZLE/GÖSTER</span>
            <span id="menuIcon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <button class="btn-bio" onclick="triggerBioAnalysis()">🧬 BİYOLOJİK ANALİZ YAP</button>

            <div>
                <label>HEDEF NESNE</label>
                <select id="targetObj">
                    <option value="all" selected>Tüm Nesneler</option>
                    <option value="person">Sadece İnsan</option>
                    <option value="cat">Sadece Kedi</option>
                    <option value="dog">Sadece Köpek</option>
                </select>
            </div>

            <div>
                <label>ÇÖZÜNÜRLÜK (KALİTE)</label>
                <select id="resSel" onchange="applyAll()">
                    <option value="480">480p (Hızlı)</option>
                    <option value="720" selected>720p (Dengeli)</option>
                    <option value="960">960p (Yüksek)</option>
                    <option value="1080">1080p (Ultra)</option>
                </select>
            </div>

            <div>
                <label>DONANIM (İŞLEMCİ BİRİMİ)</label>
                <select id="hwSel">
                    <option value="NPU" selected>NPU (Yapay Zeka Çipi)</option>
                    <option value="GPU">GPU (Ekran Kartı)</option>
                    <option value="CPU">CPU (Güvenli Mod)</option>
                </select>
            </div>

            <div>
                <label>YAPAY ZEKA MODELİ</label>
                <select id="modelSel">
                    <option value="0" selected>1. Nano (En Hızlı)</option>
                    <option value="1">2. Standart</option>
                    <option value="2">3. Dengeli HD</option>
                    <option value="3">4. Ağır Model</option>
                </select>
            </div>

            <div>
                <label>KAMERA</label>
                <select id="camSel"></select>
            </div>

            <button onclick="applyAll()">SİSTEMİ YENİDEN BAŞLAT</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const statusText = document.getElementById('status-text');

        let detector, isRunning = false, lastTime = performance.now();
        let visionData;
        let currentDetections = [];
        let bioResults = []; // Biyolojik analiz sonuçlarını tutacak dizi

        // Menü Aç/Kapat Mantığı
        document.getElementById('menuToggle').addEventListener('click', () => {
            const content = document.getElementById('p-content');
            const icon = document.getElementById('menuIcon');
            if (content.style.display === 'none') {
                content.style.display = 'flex';
                icon.innerText = '▼';
            } else {
                content.style.display = 'none';
                icon.innerText = '▲';
            }
        });

        // --- BİYOLOJİK ANALİZ (SİMÜLASYON) FONKSİYONU ---
        window.triggerBioAnalysis = () => {
            bioResults = []; // Eski sonuçları temizle
            const ethnics = ["Anadolu / Türk", "Levant", "Kafkasya", "Slav", "Nordik"];
            const catBreeds = ["Tekir", "Siyam", "British Shorthair", "Van Kedisi", "Fars Kedisi"];
            const dogBreeds = ["Golden Retriever", "Alman Kurdu", "Pug", "Kangal", "Terrier"];

            currentDetections.forEach((d) => {
                const label = d.categories[0].categoryName;
                const { originX, originY, width, height } = d.boundingBox;
                
                let analysisText = "";
                
                if (label === 'person') {
                    const age = Math.floor(Math.random() * (55 - 18 + 1)) + 18; // 18-55 arası
                    const eth = ethnics[Math.floor(Math.random() * ethnics.length)];
                    analysisText = `Yaş: ~${age} | ${eth}`;
                } else if (label === 'cat') {
                    const breed = catBreeds[Math.floor(Math.random() * catBreeds.length)];
                    analysisText = `Irk: ${breed}`;
                } else if (label === 'dog') {
                    const breed = dogBreeds[Math.floor(Math.random() * dogBreeds.length)];
                    analysisText = `Irk: ${breed}`;
                }

                if (analysisText !== "") {
                    bioResults.push({
                        text: analysisText,
                        x: originX,
                        y: originY,
                        w: width,
                        h: height,
                        expireTime: performance.now() + 5000 // Ekranda 5 saniye kalsın
                    });
                }
            });

            if(bioResults.length === 0) {
                alert("Ekranda analiz edilecek İnsan, Kedi veya Köpek bulunamadı!");
            }
        };

        async function initCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId; opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
            } catch (e) {
                statusText.innerText = "Kamera izni verilmedi!";
            }
        }

        async function createDetector(modelLevel, delegate) {
            let safeDelegate = (delegate === "CPU") ? "CPU" : "GPU"; 
            return await ObjectDetector.createFromOptions(visionData, {
                baseOptions: { 
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelLevel}/float16/1/efficientdet_lite${modelLevel}.tflite`,
                    delegate: safeDelegate 
                },
                scoreThreshold: 0.4, runningMode: "VIDEO"
            });
        }

        window.applyAll = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            statusText.innerText = "Kamera ve Çözünürlük Ayarlanıyor...";

            const res = parseInt(document.getElementById('resSel').value);
            const hwMode = document.getElementById('hwSel').value;
            let modelLevel = document.getElementById('modelSel').value;
            const deviceId = document.getElementById('camSel').value;

            let idealWidth = res === 1080 ? 1920 : (res === 960 ? 1280 : (res === 720 ? 1280 : 640));

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: deviceId ? {exact: deviceId} : undefined, width: { ideal: idealWidth }, height: { ideal: res } } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                    statusText.innerText = "Yapay Zeka Motoru Yükleniyor...";

                    if (!visionData) {
                        visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                    }
                    
                    try {
                        detector = await createDetector(modelLevel, hwMode);
                        document.getElementById('hw-tag').innerText = `HW: ${hwMode}`;
                    } catch (modelError) {
                        console.warn("Güvenli moda geçiliyor...");
                        document.getElementById('modelSel').value = "0"; 
                        document.getElementById('hwSel').value = "CPU"; 
                        detector = await createDetector(0, "CPU");
                        document.getElementById('hw-tag').innerText = `HW: CPU (Güvenli Mod)`;
                    }

                    overlay.style.display = 'none'; 
                    isRunning = true; 
                    renderLoop();
                };
            } catch (e) {
                statusText.innerText = "Kamera başlatılamadı.";
            }
        };

        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                currentDetections = result.detections; // Analiz butonu için hafızada tut
                draw(currentDetections, now);
            } catch (err) { }
            requestAnimationFrame(renderLoop);
        }

        function draw(detections, currentTime) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const target = document.getElementById('targetObj').value;
            
            // 1. Normal Tespit Kutularını Çiz
            detections.forEach((d) => {
                const label = d.categories[0].categoryName;
                if (target !== "all" && label !== target) return; // Filtreleme

                const { originX, originY, width, height } = d.boundingBox;
                const score = Math.round(d.categories[0].score * 100);

                ctx.strokeStyle = "#00ff9d";
                ctx.lineWidth = 2; 
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "rgba(0,0,0,0.7)";
                ctx.fillRect(originX, originY - 20, width, 20);
                
                ctx.fillStyle = "#fff"; 
                ctx.font = "bold 14px sans-serif";
                ctx.fillText(`${label.toUpperCase()} %${score}`, originX + 5, originY - 5);
            });

            // 2. Biyolojik Analiz Sonuçlarını Çiz (Eğer butona basıldıysa ve süre dolmadıysa)
            bioResults = bioResults.filter(b => currentTime < b.expireTime); // Süresi dolanları sil

            bioResults.forEach((bio) => {
                ctx.fillStyle = "rgba(255, 204, 0, 0.85)"; // Altın sarısı arka plan
                ctx.fillRect(bio.x, bio.y + bio.h, bio.w, 25); // Kutunun hemen altına çiz
                
                ctx.fillStyle = "#000"; // Siyah yazı
                ctx.font = "bold 13px sans-serif";
                ctx.fillText(`🧬 ${bio.text}`, bio.x + 5, bio.y + bio.h + 17);
            });
        }

        initCameras().then(() => applyAll());
    </script>
</body>
</html>
