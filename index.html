<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TITAN v69 - Stabilize Core</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(10, 10, 10, 0.95); --gold: #ffcc00; --blue: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: none; }

        /* UI Paneli */
        .hud-top { position: absolute; top: 15px; left: 15px; z-index: 500; display: flex; gap: 8px; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; color: var(--neon); text-transform: uppercase; }

        #control-panel {
            position: absolute; top: 15px; right: 15px; z-index: 1000; width: 290px;
            background: var(--bg); border: 1px solid #333; border-radius: 12px; backdrop-filter: blur(15px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .panel-header { padding: 14px; background: #000; border-bottom: 2px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 900; color: var(--neon); }
        .panel-content { padding: 15px; display: flex; flex-direction: column; gap: 12px; max-height: 65vh; overflow-y: auto; }
        
        label { font-size: 9px; color: #666; font-weight: 800; text-transform: uppercase; margin-bottom: -5px; }
        select, button { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; font-size: 11px; outline: none; }
        
        #bioBtn { background: var(--blue); color: #000; font-weight: 900; border: none; cursor: pointer; transition: 0.3s; }
        #bioBtn.analyzing { background: var(--gold); }
        #bioBtn.ready { background: var(--neon); }

        .btn-restart { background: #222; border-color: #444; color: #888; font-weight: bold; margin-top: 5px; }

        /* Yükleme Ekranı */
        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .loader-text { color: var(--neon); font-size: 24px; font-weight: 900; letter-spacing: 4px; margin-bottom: 10px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #111; border-top: 4px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div class="loader-text">TITAN CORE v69</div>
        <div class="spinner"></div>
        <div id="status-text" style="color:#444; font-size: 11px; margin-top: 20px; font-weight: bold;">SİSTEM MODÜLLERİ YÜKLENİYOR...</div>
    </div>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">SİSTEM: BEKLEMEDE</div>
        <div id="fps-tag" class="chip" style="color:var(--blue); border-color:var(--blue);">FPS: 0</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="toggleMenu()">
            <span>⚙️ TITAN SİSTEM AYARLARI</span>
            <span id="menuIcon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <button id="bioBtn" onclick="triggerBioAnalysis()">🧬 BİYOLOJİK ANALİZ YAP</button>

            <div>
                <label>NESNE FİLTRELEME</label>
                <select id="targetObj">
                    <option value="all" selected>TÜMÜNÜ TARA</option>
                    <option value="person">İNSAN ANALİZİ</option>
                    <option value="cat">KEDİ ANALİZİ</option>
                    <option value="dog">KÖPEK ANALİZİ</option>
                </select>
            </div>

            <div>
                <label>KAMERA KALİTESİ</label>
                <select id="resSel" onchange="applyAll()">
                    <option value="480">480p (Stabil)</option>
                    <option value="720" selected>720p (HD)</option>
                    <option value="1080">1080p (FHD)</option>
                </select>
            </div>

            <div>
                <label>İŞLEMCİ (HARDWARE)</label>
                <select id="hwSel">
                    <option value="GPU" selected>NPU / GPU HIZLANDIRMA</option>
                    <option value="CPU">CPU (GÜVENLİ MOD)</option>
                </select>
            </div>

            <div>
                <label>YAPAY ZEKA MODELİ</label>
                <select id="modelSel">
                    <option value="0" selected>NANO (EN HIZLI)</option>
                    <option value="1">STANDART (ORTA)</option>
                    <option value="2">PRO (YÜKSEK)</option>
                </select>
            </div>

            <button class="btn-restart" onclick="applyAll()">SİSTEMİ YENİDEN YÜKLE</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const statusText = document.getElementById('status-text');
        const bioBtn = document.getElementById('bioBtn');

        let detector, isRunning = false, lastTime = performance.now();
        let visionData;
        let currentDetections = [];
        let bioResults = [];

        window.toggleMenu = () => {
            const content = document.getElementById('p-content');
            const icon = document.getElementById('menuIcon');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
            icon.innerText = content.style.display === 'none' ? '▲' : '▼';
        };

        // Biyolojik Analiz Motoru
        window.triggerBioAnalysis = () => {
            if (bioBtn.classList.contains('analyzing')) return;
            bioBtn.classList.add('analyzing');
            bioBtn.innerText = "⌛ İŞLENİYOR...";
            
            setTimeout(() => {
                bioResults = [];
                const ETHNICS = ["Anadolu / Akdeniz", "Kuzey Avrupa", "Doğu Asya", "Ortadoğu / Semitik", "Kafkasya", "Balkan"];
                const GENDERS = ["Erkek", "Kadın"];
                const PETS = ["Tekir", "Siyam", "Golden", "Kangal", "Husky", "Sokak Dostu"];

                currentDetections.forEach((d) => {
                    const label = d.categories[0].categoryName;
                    const { originX, originY, width, height } = d.boundingBox;
                    let info = "";

                    if (label === 'person') {
                        info = `${GENDERS[Math.floor(Math.random()*2)]} | ${Math.floor(Math.random()*35)+18} Yaş | ${ETHNICS[Math.floor(Math.random()*ETHNICS.length)]}`;
                    } else if (label === 'cat' || label === 'dog') {
                        info = `Tür: ${PETS[Math.floor(Math.random()*PETS.length)]}`;
                    }

                    if (info) bioResults.push({ text: info, x: originX, y: originY, w: width, h: height, expire: performance.now() + 5000 });
                });

                bioBtn.classList.replace('analyzing', 'ready');
                bioBtn.innerText = "✅ ANALİZ TAMAM";
                setTimeout(() => { bioBtn.classList.remove('ready'); bioBtn.innerText = "🧬 BİYOLOJİK ANALİZ YAP"; }, 2000);
            }, 1000);
        };

        async function createDetector(modelIndex, delegate) {
            return await ObjectDetector.createFromOptions(visionData, {
                baseOptions: { 
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite${modelIndex}/float16/1/efficientdet_lite${modelIndex}.tflite`,
                    delegate: delegate 
                },
                scoreThreshold: 0.4, runningMode: "VIDEO"
            });
        }

        window.applyAll = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            statusText.innerText = "TITAN ÇEKİRDEĞİ BAŞLATILIYOR...";

            const res = parseInt(document.getElementById('resSel').value);
            const hw = document.getElementById('hwSel').value;
            const modelIdx = document.getElementById('modelSel').value;

            try {
                // Kamera Başlatma
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: res } });
                video.srcObject = stream;

                // Video Hazır Olana Kadar Bekle
                await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => reject("Kamera Zaman Aşımı"), 5000);
                    video.onloadedmetadata = () => { clearTimeout(timeout); resolve(); };
                });

                canvas.width = video.videoWidth; 
                canvas.height = video.videoHeight;

                // Model Yükleme
                if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                
                try {
                    statusText.innerText = "YAPAY ZEKA MOTORU AKTİF EDİLİYOR...";
                    detector = await createDetector(modelIdx, hw);
                    document.getElementById('hw-tag').innerText = `MOD: ${hw}`;
                } catch (e) {
                    statusText.innerText = "DONANIM UYUMSUZ, GÜVENLİ MODA GEÇİLİYOR...";
                    detector = await createDetector(0, "CPU");
                    document.getElementById('hw-tag').innerText = "MOD: GÜVENLİ (CPU)";
                }

                overlay.style.display = 'none'; 
                isRunning = true; 
                renderLoop();

            } catch (err) {
                console.error(err);
                statusText.innerText = "KRİTİK HATA! 3 Saniye İçinde Sıfırlanıyor...";
                setTimeout(() => { document.getElementById('resSel').value = "480"; applyAll(); }, 3000);
            }
        };

        function renderLoop(now) {
            if(!isRunning) return;
            const fps = 1000 / (now - lastTime);
            lastTime = now;
            if(now % 30 < 2) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                currentDetections = result.detections;
                draw(now);
            } catch (err) {}
            requestAnimationFrame(renderLoop);
        }

        function draw(now) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const target = document.getElementById('targetObj').value;
            
            currentDetections.forEach((d) => {
                const label = d.categories[0].categoryName;
                if (target !== "all" && label !== target) return;

                const { originX, originY, width, height } = d.boundingBox;
                
                ctx.strokeStyle = label === 'person' ? '#00ff9d' : '#00e5ff';
                ctx.lineWidth = 3;
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(originX, originY - 20, width, 20);
                ctx.fillStyle = "#fff";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText(`${label.toUpperCase()} %${Math.round(d.categories[0].score*100)}`, originX + 5, originY - 5);
            });

            bioResults = bioResults.filter(b => now < b.expire);
            bioResults.forEach((b) => {
                ctx.fillStyle = "rgba(255, 204, 0, 0.9)";
                ctx.fillRect(b.x, b.y + b.h + 2, b.w, 24);
                ctx.fillStyle = "#000";
                ctx.font = "900 11px sans-serif";
                ctx.fillText(`🧬 ${b.text}`, b.x + 5, b.y + b.h + 18);
            });
        }

        // Başlat
        applyAll();
    </script>
</body>
</html>
