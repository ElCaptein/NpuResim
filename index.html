<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v25 Omni-Elite</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --bg: rgba(5, 5, 5, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Üst HUD - Dinamik Takip */
        .hud-lite { position: absolute; top: 45px; left: 10px; right: 10px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 500; }
        .tag { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 4px 10px; border-radius: 8px; font-size: 9px; font-weight: 900; color: var(--neon); text-transform: uppercase; }
        .tag-stats { border-color: var(--accent); color: var(--accent); }

        /* Ana Menü Sistemi */
        #ui-panel {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            z-index: 1000; background: var(--bg); border-radius: 20px; border: 1px solid #333; overflow: hidden;
            max-height: 60vh; display: flex; flex-direction: column;
        }
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 12px 18px; background: #111; cursor: pointer; display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; color: var(--neon); text-transform: uppercase; }
        .acc-content { padding: 15px; display: none; background: #080808; overflow-y: auto; }
        .acc-content.active { display: block; }

        /* Butonlar & Formlar */
        .row { margin-bottom: 12px; }
        label { font-size: 9px; color: #666; display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; background: #1a1a1a; color: white; border: 1px solid #333; padding: 10px; border-radius: 10px; font-size: 12px; outline: none; }
        .btn-group { display: flex; gap: 6px; }
        .btn { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: 800; cursor: pointer; font-size: 10px; text-transform: uppercase; transition: 0.3s; }
        .btn-neon { background: var(--neon); color: #000; }
        .btn-accent { background: var(--accent); color: #000; }
        
        #scan-hint { position: absolute; top: 130px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: var(--accent); padding: 8px 16px; border-radius: 20px; font-size: 10px; display: none; z-index: 600; border: 1px solid var(--accent); }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <div class="hud-lite">
        <div id="fpsTag" class="tag">FPS: --</div>
        <div id="hwTag" class="tag">NPU: OK</div>
        <div id="countTag" class="tag tag-stats">KAYIT: 0</div>
        <div id="tgtTag" class="tag tag-stats" style="display:none">HEDEF KİLİTLİ</div>
    </div>

    <div id="scan-hint">🧬 ANALİZ AKTİF: KAFANIZI HAREKET ETTİRİN</div>

    <div id="ui-panel">
        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(0)">🎯 HEDEF SEÇİMİ VE ANALİZ <span>▼</span></div>
            <div class="acc-content active">
                <div class="row">
                    <label>ARANACAK NESNE</label>
                    <select id="objFilter" onchange="resetLocalTracking()">
                        <option value="all">HER ŞEYİ GÖR</option>
                        <option value="person">İNSAN</option>
                        <option value="car">OTOMOBİL</option>
                        <option value="truck">KAMYON</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-accent" id="bioBtn" onclick="toggleBio()">🧬 BİYOMETRİK: KAPALI</button>
                    <button class="btn btn-accent" onclick="flipCamera()">🔄 KAMERA DEĞİŞTİR</button>
                </div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(1)">📍 RADAR VE HAFIZA <span>▼</span></div>
            <div class="acc-content">
                <div class="row">
                    <label>AKSİYON MODU</label>
                    <select id="actionMod">
                        <option value="none">SADECE GÖRÜNTÜLE</option>
                        <option value="save">SAYIYI KAYDET (SAYAÇ)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-neon" onclick="addAnchor()">📍 KONUM ÇİVİLE</button>
                    <button class="btn" style="background:#333; color:white;" onclick="resetCounter()">🧹 SIFIRLA</button>
                </div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(2)">🔋 SİSTEM VE DOSYA <span>▼</span></div>
            <div class="acc-content">
                <div class="row">
                    <label>FOTOĞRAFTAN HEDEF BELİRLE</label>
                    <input type="file" accept="image/*" onchange="loadPhotoTarget(event)">
                </div>
                <div class="row">
                    <label>PERFORMANS MODU</label>
                    <select id="pwrMode" onchange="changeFPS()">
                        <option value="0">DENGELİ (30 FPS)</option>
                        <option value="195">ECO (5 FPS)</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');

        let detector, isRunning = false, lastTime = -1;
        let detections = [], fpsDelay = 0, currentFacing = "environment";
        let bioActive = false, scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let persistentCount = parseInt(localStorage.getItem('v25_count')) || 0;
        let trackedIds = new Set();

        const ETHNICS = ["Anadolu", "Orta Asya", "Avrupa", "Sami", "Kuzey", "Balkan"];

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite");
            detector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite", delegate: "GPU" },
                scoreThreshold: 0.5, runningMode: "VIDEO"
            });
            updateHUD();
            startCam();
        }

        async function startCam() {
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing, width: {ideal: 1280}, height: {ideal: 720} } });
            video.srcObject = s;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true;
                window.addEventListener('deviceorientation', e => deviceOri.alpha = e.alpha);
                renderLoop();
            };
        }

        function renderLoop() {
            if(!isRunning) return;
            if(video.currentTime !== lastTime) {
                if(fpsDelay > 0) { setTimeout(() => { process(); }, fpsDelay); } else { process(); }
                lastTime = video.currentTime;
                updateHUD();
            }
            drawScene();
            requestAnimationFrame(renderLoop);
        }

        function process() {
            const res = detector.detectForVideo(video, performance.now());
            const filter = document.getElementById('objFilter').value;
            const action = document.getElementById('actionMod').value;

            detections = res.detections.filter(d => {
                const label = d.categories[0].categoryName;
                if(targetLabel) return label === targetLabel;
                if(filter === 'all') return true;
                return label === filter;
            });

            // Akıllı Takip ve Sayaç
            detections.forEach(d => {
                const id = `${Math.round(d.boundingBox.originX/30)}-${Math.round(d.boundingBox.originY/30)}`;
                if(!trackedIds.has(id)) {
                    trackedIds.add(id);
                    if(action === 'save') {
                        persistentCount++;
                        localStorage.setItem('v25_count', persistentCount);
                    }
                }
            });
            if(trackedIds.size > 50) trackedIds.clear();
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let activeBioFlag = false;

            // Radar Çizimi
            savedAnchors.forEach(a => {
                const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 40;
                if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                    ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 12, 0, 7); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.fillText(a.label, x + 18, canvas.height/2 + 5);
                }
            });

            detections.forEach((d, idx) => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                
                ctx.strokeStyle = label === targetLabel ? varColor(1) : varColor(d.categories[0].score);
                ctx.lineWidth = 4;
                ctx.strokeRect(originX, originY, width, height);

                if(bioActive && label === 'person') {
                    activeBioFlag = true;
                    if(!scanData.has(idx)) {
                        const seed = Math.floor(originX);
                        scanData.set(idx, {p:0, age:20+(seed%30), eth:ETHNICS[seed%6], gen:(seed%2===0?"ERKEK":"KADIN")});
                    }
                    let s = scanData.get(idx);
                    if(s.p < 100) s.p += 1.5;

                    ctx.fillStyle = "rgba(0,0,0,0.8)";
                    ctx.fillRect(originX, originY - 45, width, 40);
                    ctx.fillStyle = varColor(s.p/100);
                    ctx.font = "bold 12px sans-serif";
                    if(s.p < 100) {
                        ctx.fillText(`KALİBRASYON: %${Math.floor(s.p)}`, originX + 10, originY - 25);
                    } else {
                        ctx.fillText(`${s.gen} | ${s.age} YAŞ`, originX + 10, originY - 28);
                        ctx.font = "9px sans-serif"; ctx.fillText(`KÖKEN: ${s.eth}`, originX + 10, originY - 14);
                    }
                }
            });
            document.getElementById('scan-hint').style.display = activeBioFlag ? 'block' : 'none';
        }

        function varColor(s) { return s > 0.7 ? "#00ff9d" : "#ffcc00"; }
        function updateHUD() {
            document.getElementById('fpsTag').innerText = `FPS: ${fpsDelay > 0 ? '5' : '30'}`;
            document.getElementById('countTag').innerText = `KAYIT: ${persistentCount}`;
            document.getElementById('tgtTag').style.display = targetLabel ? 'block' : 'none';
        }

        window.toggleAcc = (n) => {
            document.querySelectorAll('.acc-content').forEach((c, i) => i === n ? c.classList.toggle('active') : c.classList.remove('active'));
        };

        window.toggleBio = () => {
            bioActive = !bioActive;
            document.getElementById('bioBtn').innerText = bioActive ? "🧬 BİYOMETRİK: AKTİF" : "🧬 BİYOMETRİK: KAPALI";
            if(!bioActive) scanData.clear();
        };

        window.flipCamera = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; startCam(); };
        window.changeFPS = () => { fpsDelay = parseInt(document.getElementById('pwrMode').value); };
        window.resetCounter = () => { persistentCount = 0; localStorage.setItem('v25_count', 0); targetLabel = null; updateHUD(); };
        window.addAnchor = () => { if(detections.length > 0) savedAnchors.push({ alpha: deviceOri.alpha, label: detections[0].categories[0].categoryName.toUpperCase() }); };
        
        window.loadPhotoTarget = (e) => {
            const r = new FileReader();
            r.onload = (f) => {
                const img = new Image(); img.src = f.target.result;
                img.onload = () => {
                    const res = detector.detect(img);
                    if(res.detections.length > 0) {
                        targetLabel = res.detections[0].categories[0].categoryName;
                        alert("HEDEF ÖĞRENİLDİ: " + targetLabel);
                    }
                };
            };
            r.readAsDataURL(e.target.files[0]);
        };

        init();
    </script>
</body>
</html>
