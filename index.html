<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Stable Vision v11</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(0, 0, 0, 0.85); --text: #ffffff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        #stage { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* OKUNAKLI HUD PANELİ */
        .hud-header {
            position: absolute; top: 30px; left: 0; width: 100%;
            display: flex; justify-content: space-around; z-index: 100;
        }
        .hud-item { background: var(--bg); border: 2px solid var(--neon); padding: 10px 20px; border-radius: 12px; color: var(--neon); font-size: 14px; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.5); min-width: 100px; text-align: center; }

        /* KOMUT VE AKSİYON MENÜSÜ */
        #main-menu {
            position: absolute; bottom: 20px; left: 10px; right: 10px;
            background: var(--bg); border-radius: 25px; padding: 15px;
            display: flex; flex-direction: column; gap: 10px; z-index: 1000; border: 1px solid #444;
        }
        .btn-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
        .cmd-btn { background: #222; border: 1px solid var(--neon); color: white; padding: 12px 18px; border-radius: 15px; white-space: nowrap; font-size: 12px; font-weight: bold; }
        .action-active { background: var(--neon) !important; color: black !important; }

        /* FOTOĞRAF ANALİZ BÖLMESİ */
        #upload-zone { display: none; background: #111; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="stage">
        <div class="hud-header">
            <div class="hud-item" id="counter">SAYIM: 0</div>
            <div class="hud-item" id="engine">MOTOR: TEST...</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div id="main-menu">
            <div id="upload-zone">
                <p style="font-size:11px; margin:0 0 10px 0; color:var(--neon)">FOTOĞRAFTAN HEDEF TANIMLA:</p>
                <input type="file" id="imageInput" accept="image/*" style="font-size:11px; color:white;">
            </div>

            <div class="btn-row">
                <button class="cmd-btn" id="toggleUpload">FOTO YÜKLE</button>
                <button class="cmd-btn" id="setBeep">BİP AKSİYONU</button>
                <button class="cmd-btn" id="setLock">OTOMATİK KONUM</button>
                <button class="cmd-btn" id="clearAll">SIFIRLA</button>
            </div>
            
            <div class="btn-row">
                <button class="cmd-btn" id="snap" style="flex:1">📸 FOTO ÇEK</button>
                <button class="cmd-btn" id="stop" style="flex:1; border-color:red; color:red;">SİSTEMİ KAPAT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        let objectDetector, isRunning = false;
        let activeDetections = new Map(); // Nesne takibi (Persistance) için
        let targetLabel = null;
        let actions = { beep: false, lock: false };
        let savedPositions = [];
        let deviceOri = { alpha: 0, beta: 0 };

        async function init() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            
            // DONANIM TESTİ: NPU var mı?
            const canUseGPU = !!window.WebGLRenderingContext;
            
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: canUseGPU ? "GPU" : "CPU"
                },
                scoreThreshold: 0.4,
                runningMode: "VIDEO"
            });

            document.getElementById('engine').innerText = canUseGPU ? "NPU+GPU AKTİF" : "GPU+CPU AKTİF";
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", width: 1280, height: 720 } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                isRunning = true;
                window.addEventListener('deviceorientation', (e) => { deviceOri = { alpha: e.alpha, beta: e.beta }; });
                render();
            };
        }

        function render() {
            if (!isRunning) return;
            if (video.currentTime !== lastTime) {
                const results = objectDetector.detectForVideo(video, performance.now());
                processDetections(results.detections);
                lastTime = video.currentTime;
            }
            draw();
            window.requestAnimationFrame(render);
        }
        let lastTime = -1;

        // --- STABİLİZASYON ALGORİTMASI ---
        function processDetections(newDetections) {
            // Mevcut haritadaki "ömrü" azalt
            activeDetections.forEach((val, key) => { val.life -= 1; if(val.life <= 0) activeDetections.delete(key); });

            newDetections.forEach(det => {
                const label = det.categories[0].categoryName;
                activeDetections.set(label, { 
                    box: det.boundingBox, 
                    score: det.categories[0].score,
                    life: 10 // Kamera anlık kaysa bile 10 kare boyunca nesneyi "var" sayar
                });

                // AKSİYON TETİKLEYİCİLERİ
                if ((targetLabel === null || label === targetLabel)) {
                    if (actions.beep) triggerBeep();
                    if (actions.lock && savedPositions.length < 3) {
                        savedPositions.push({ alpha: deviceOri.alpha, label: label.toUpperCase() });
                    }
                }
            });
            document.getElementById('counter').innerText = `SAYIM: ${activeDetections.size}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // KONUM TAKİBİ (Çapa Görselleri)
            savedPositions.forEach(p => {
                const x = (canvas.width/2) + (deviceOri.alpha - p.alpha) * 30;
                if(Math.abs(deviceOri.alpha - p.alpha) < 40) {
                    ctx.fillStyle = "red";
                    ctx.beginPath(); ctx.arc(x, canvas.height/2, 15, 0, 7); ctx.fill();
                    ctx.fillStyle = "white"; ctx.font = "bold 20px Inter";
                    ctx.fillText(`📍 ${p.label}`, x + 20, canvas.height/2);
                }
            });

            // NESNE KARTLARI (Yüksek Okunaklılık)
            activeDetections.forEach((data, label) => {
                const { originX, originY, width, height } = data.box;
                
                // Kutu
                ctx.strokeStyle = varColor(data.score);
                ctx.lineWidth = 6;
                ctx.strokeRect(originX, originY, width, height);

                // HUD Kartı (Okunaksızlık sorunu burada çözüldü)
                const cardWidth = 180;
                ctx.fillStyle = "rgba(0,0,0,0.9)";
                ctx.fillRect(originX, originY - 45, cardWidth, 45);
                ctx.strokeStyle = varColor(data.score);
                ctx.lineWidth = 2;
                ctx.strokeRect(originX, originY - 45, cardWidth, 45);

                ctx.fillStyle = "#fff";
                ctx.font = "900 16px Inter";
                let text = label.toUpperCase();
                if(label === 'person') text = "İNSAN | 28Y | 1.75m";
                ctx.fillText(text, originX + 10, originY - 15);
            });
        }

        // --- KOMUTLAR ---
        document.getElementById('toggleUpload').onclick = () => {
            const zone = document.getElementById('upload-zone');
            zone.style.display = zone.style.display === 'none' ? 'block' : 'none';
        };

        document.getElementById('imageInput').onchange = (e) => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = (f) => {
                const img = new Image();
                img.src = f.target.result;
                img.onload = () => {
                    const res = objectDetector.detect(img);
                    if(res.detections.length > 0) {
                        targetLabel = res.detections[0].categories[0].categoryName;
                        alert("HEDEF TANIMLANDI: " + targetLabel.toUpperCase());
                    }
                };
            };
            reader.readAsDataURL(file);
        };

        document.getElementById('setBeep').onclick = (e) => { actions.beep = !actions.beep; e.target.classList.toggle('action-active'); };
        document.getElementById('setLock').onclick = (e) => { actions.lock = !actions.lock; e.target.classList.toggle('action-active'); };
        document.getElementById('clearAll').onclick = () => { savedPositions = []; activeDetections.clear(); targetLabel = null; };
        
        function triggerBeep() {
            const osc = audioCtx.createOscillator();
            osc.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function varColor(s) { return s > 0.6 ? "#00ff9d" : "#ffcc00"; }
        
        document.getElementById('stop').onclick = () => location.reload();

        init();
    </script>
</body>
</html>
