<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision Elite v14</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(10, 10, 10, 0.95); --danger: #ff3d00; --accent: #00e5ff; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; color: white; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Sağ Üst Donanım Seçici */
        .hw-selector {
            position: absolute; top: 45px; right: 15px; z-index: 500;
            background: var(--bg); border: 1px solid var(--neon); border-radius: 8px; padding: 5px;
        }
        .hw-selector select { background: transparent; color: var(--neon); border: none; font-weight: bold; font-size: 12px; outline: none; }

        /* Akordeon Menü Yapısı */
        #main-ui {
            position: absolute; bottom: 20px; left: 15px; right: 15px;
            z-index: 1000; background: var(--bg); border-radius: 15px; border: 1px solid #333; overflow: hidden;
            transition: all 0.3s ease;
        }
        .acc-item { border-bottom: 1px solid #222; }
        .acc-header { padding: 12px 20px; background: #1a1a1a; cursor: pointer; display: flex; justify-content: space-between; font-size: 13px; font-weight: bold; color: var(--neon); }
        .acc-content { padding: 15px; display: none; background: #0f0f0f; }
        .acc-content.active { display: block; }

        /* Form Elemanları */
        .row { margin-bottom: 12px; }
        label { font-size: 11px; color: #888; display: block; margin-bottom: 5px; }
        select, input[type="range"] { width: 100%; background: #222; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 6px; }

        /* HUD Göstergeleri */
        .hud-left { position: absolute; top: 45px; left: 15px; z-index: 100; pointer-events: none; }
        .stat { background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 4px; font-size: 10px; margin-bottom: 4px; border-left: 3px solid var(--accent); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-neon { background: var(--neon); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>

    <div class="hw-selector">
        <select id="directHw">
            <option value="GPU">SADECE NPU</option>
            <option value="GPU">NPU + GPU</option>
            <option value="CPU">SADECE CPU</option>
        </select>
    </div>

    <div class="hud-left">
        <div class="stat" id="fpsShow">FPS: --</div>
        <div class="stat" id="objShow">SAYIM: 0</div>
        <div class="stat" id="pwrShow">GÜÇ: PERFORMANS</div>
    </div>

    <div id="main-ui">
        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(0)">KAMERA & FPS <span>▼</span></div>
            <div class="acc-content active">
                <div class="row">
                    <label>FPS LİMİTİ (GÜÇ TASARRUFU)</label>
                    <select id="fpsLimit">
                        <option value="0">SINIRSIZ (MAX PERFORMANS)</option>
                        <option value="66">ORTA (15 FPS)</option>
                        <option value="180">GÜÇ TASARRUFU (5 FPS)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button class="btn btn-neon" onclick="flipCamera()">KAMERA DEĞİŞTİR</button>
                    <button class="btn btn-neon" onclick="takePhoto()">FOTOĞRAF ÇEK</button>
                </div>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(1)">ANALİZ & HASSASİYET <span>▼</span></div>
            <div class="acc-content">
                <div class="row">
                    <label>NESNE TANIMA EŞİĞİ (İnsan Karışıklığı İçin Arttır)</label>
                    <input type="range" id="confRange" min="20" max="95" value="55">
                </div>
                <div class="row">
                    <label>AKSİYON TANIMLA</label>
                    <select id="actionSel">
                        <option value="none">AKSİYON YOK</option>
                        <option value="beep">BULUNCA UYAR (BİP)</option>
                        <option value="lock">OTOMATİK KONUM KAYDET</option>
                    </select>
                </div>
                <button class="btn btn-neon" style="width:100%" onclick="resetAnchors()">KONUMLARI SIFIRLA</button>
            </div>
        </div>

        <div class="acc-item">
            <div class="acc-header" onclick="toggleAcc(2)">SİSTEM <span>▼</span></div>
            <div class="acc-content">
                <button class="btn btn-danger" style="width:100%" onclick="location.reload()">SİSTEMİ DURDUR / YENİDEN BAŞLAT</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        let objectDetector, isRunning = false;
        let currentFacing = "environment", lastTime = -1;
        let fpsDelay = 0, detections = [], savedAnchors = [];
        let deviceOri = { alpha: 0 };

        // --- BAŞLATMA ---
        async function initModel() {
            const delegate = document.getElementById('directHw').value;
            const threshold = document.getElementById('confRange').value / 100;
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: delegate
                },
                scoreThreshold: threshold, runningMode: "VIDEO"
            });
            if(!isRunning) startCamera();
        }

        async function startCamera() {
            if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing, width: 1280, height: 720 } });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true;
                window.addEventListener('deviceorientation', e => { deviceOri.alpha = e.alpha; });
                render();
            };
        }

        // --- GÜÇ TASARRUFLU RENDER DÖNGÜSÜ ---
        async function render() {
            if(!isRunning) return;

            if(video.currentTime !== lastTime) {
                // Güç tasarrufu için yapay gecikme (FPS Düşürme)
                if(fpsDelay > 0) await new Promise(r => setTimeout(r, fpsDelay));
                
                const results = objectDetector.detectForVideo(video, performance.now());
                detections = results.detections;
                
                // Aksiyonları işlet
                handleLogic();
                
                lastTime = video.currentTime;
                updateStats();
            }
            draw();
            window.requestAnimationFrame(render);
        }

        // --- MANTIK VE ÇİZİM ---
        function handleLogic() {
            const action = document.getElementById('actionSel').value;
            if(detections.length > 0 && action !== 'none') {
                if(action === 'beep') {
                    let osc = audioCtx.createOscillator(); osc.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.05);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            detections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = det.categories[0].categoryName.toUpperCase();
                const score = det.categories[0].score;

                // Kutu
                ctx.strokeStyle = score > 0.6 ? "#00ff9d" : "#ffcc00";
                ctx.lineWidth = 4;
                ctx.strokeRect(originX, originY, width, height);

                // Smart Label (Taşma Korumalı)
                ctx.font = "bold 14px Segoe UI";
                const info = label === 'PERSON' ? `INSAN | %${Math.round(score*100)}` : `${label} %${Math.round(score*100)}`;
                const txtW = ctx.measureText(info).width + 20;
                
                let ty = originY - 10;
                if(ty < 40) ty = originY + height + 25; // Ekranın üstündeyse kutu altına yaz

                ctx.fillStyle = "rgba(0,0,0,0.85)";
                ctx.fillRect(originX, ty - 22, txtW, 26);
                ctx.fillStyle = "#fff";
                ctx.fillText(info, originX + 10, ty - 4);
            });
        }

        // --- UI KONTROLLERİ ---
        window.toggleAcc = (idx) => {
            const contents = document.querySelectorAll('.acc-content');
            const headers = document.querySelectorAll('.acc-header span');
            contents.forEach((c, i) => {
                if(i === idx) {
                    c.classList.toggle('active');
                    headers[i].innerHTML = c.classList.contains('active') ? "▲" : "▼";
                } else {
                    c.classList.remove('active');
                    headers[i].innerHTML = "▼";
                }
            });
        };

        window.flipCamera = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; startCamera(); };
        
        window.takePhoto = () => {
            const link = document.createElement('a');
            link.download = `AI_Vision_${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        };

        document.getElementById('directHw').onchange = () => initModel();
        document.getElementById('fpsLimit').onchange = (e) => {
            fpsDelay = parseInt(e.target.value);
            document.getElementById('pwrShow').innerText = fpsDelay > 100 ? "GÜÇ: TASARRUF (5 FPS)" : "GÜÇ: PERFORMANS";
        };
        document.getElementById('confRange').oninput = (e) => { initModel(); };

        function updateStats() {
            document.getElementById('fpsShow').innerText = `FPS: ${fpsDelay > 100 ? '5' : '30'}`;
            document.getElementById('objShow').innerText = `SAYIM: ${detections.length}`;
        }

        initModel();
    </script>
</body>
</html>
