<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Vision ULTIMATE PRO v7</title>
    <style>
        :root { --neon: #00ff9d; --bg: rgba(10, 10, 10, 0.98); --accent: #ff0000; --blue: #00e5ff; --gold: #ffd700; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; }
        video { z-index: 1; } canvas { z-index: 2; pointer-events: auto; }

        .hud-top { position: absolute; top: 10px; left: 10px; z-index: 500; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; width: calc(100% - 20px); }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 3px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; color: var(--neon); text-transform: uppercase; }
        .chip-gold { border-color: var(--gold); color: var(--gold); }

        #control-panel {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 95%; max-width: 520px;
            background: var(--bg); border: 1px solid #333; border-radius: 12px; backdrop-filter: blur(20px);
            display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }
        
        .panel-header { padding: 10px 15px; background: #000; border-bottom: 1px solid var(--neon); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: bold; color: var(--neon); }
        .panel-content { padding: 10px; display: flex; flex-direction: column; gap: 6px; max-height: 70vh; overflow-y: auto; }
        
        .section-label { font-size: 9px; color: var(--blue); font-weight: bold; margin-top: 4px; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 2px; }
        label { font-size: 9px; color: #888; display: block; margin-bottom: 2px;}
        
        select, button, input[type="range"] { width: 100%; padding: 7px; background: #151515; border: 1px solid #333; color: white; border-radius: 4px; font-size: 10px; outline: none; }
        select option { background: #111; }
        
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .action-btn { background: #1a1a1a; color: #ccc; border: 1px solid #444; text-align: left; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-size: 10px; height: 32px; }
        .action-btn.active { border-color: var(--neon); color: var(--neon); background: rgba(0,255,157,0.05); }
        
        .primary-btn { background: var(--neon); color: #000; font-weight: bold; border: none; cursor: pointer; padding: 10px; font-size: 11px; margin-top: 4px; border-radius: 4px; }
        .danger-btn { background: #1a1a1a; color: #ff4444; border: 1px solid #444; font-weight: bold; cursor: pointer; padding: 5px; font-size: 9px; border-radius: 4px; }

        #load-overlay { position: absolute; inset: 0; background: #000; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-text { color: var(--neon); font-size: 13px; font-weight: bold; letter-spacing: 2px; margin-top: 15px; text-align: center; }
        
        .slider-val { float: right; color: var(--neon); }

        /* Model bilgi tooltip */
        .model-info { font-size: 8px; color: #666; margin-top: 2px; padding: 3px 5px; background: #0a0a0a; border-left: 2px solid var(--blue); border-radius: 0 3px 3px 0; line-height: 1.4; }
        .model-info b { color: var(--gold); }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .loading-pulse { animation: pulse 1.5s infinite; }
    </style>
</head>
<body>

    <div id="load-overlay">
        <div style="width:40px; height:40px; border:3px solid #111; border-top-color:var(--neon); border-radius:50%; animation:spin 1s linear infinite;"></div>
        <div class="loader-text">SİSTEM BAŞLATILIYOR...<br><span id="load-status" style="font-size: 8px; color: #555;">MODÜLLER HAZIRLANIYOR</span></div>
    </div>

    <button id="dynamic-save-btn" style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); z-index: 1500; background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; display: none; cursor: pointer;" onclick="saveCurrentObjectCoords()">📍 KONUMU KAYDET</button>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-top">
        <div id="hw-tag" class="chip">HW: --</div>
        <div id="fps-tag" class="chip" style="color:var(--blue); border-color:var(--blue);">FPS: 0</div>
        <div id="res-tag" class="chip" style="color:#fff; border-color:#555;">--</div>
        <div id="model-tag" class="chip chip-gold" style="display:none;">MODEL: --</div>
        <div id="target-info-tag" class="chip" style="display:none; color:var(--accent); border-color:var(--accent); background: rgba(0,0,0,0.9);">HEDEF: YOK</div>
        
        <div style="flex-basis: 100%; height: 0;"></div>
        <div id="count-tag" class="chip" style="color:#ffcc00; border-color:#ffcc00;">ANLIK SAYI: 0</div>
        <div id="total-tag" class="chip" style="color:var(--neon); border-color:var(--neon);">TOPLAM SAYI: 0</div>
    </div>

    <div id="control-panel">
        <div class="panel-header" onclick="togglePanel()">
            <span>⚙️ AI VISION V7 | KONTROL PANELİ</span>
            <span id="toggle-icon">▼</span>
        </div>
        <div class="panel-content" id="p-content">
            
            <div class="section-label">Aksiyonlar</div>
            <div class="action-grid">
                <button class="action-btn" id="btn-select" onclick="toggleMode('select')">🎯 HEDEF SEÇ <span id="ind-select">○</span></button>
                <button class="action-btn" id="btn-count" onclick="toggleMode('count')">🔢 NESNE SAYICI <span id="ind-count">OFF</span></button>
                <button class="action-btn" id="btn-sensors" onclick="toggleMode('sensors')">🧭 IMU/JİRO <span id="ind-sensors">ON</span></button>
                <button class="action-btn" id="btn-pin" onclick="toggleMode('pin')">📍 KAYDEDİCİ <span id="ind-pin">OFF</span></button>
            </div>

            <div class="section-label">Hassasiyet & Doğruluk</div>
            <div class="action-grid">
                <div>
                    <label>DOĞRULUK (%) <span id="conf-val" class="slider-val">40</span></label>
                    <input type="range" id="confSlider" min="5" max="95" value="40" oninput="updateUI()">
                </div>
                <div>
                    <label>TAKİP HASSASİYETİ <span id="sens-val" class="slider-val">60</span></label>
                    <input type="range" id="sensSlider" min="10" max="250" value="60" oninput="updateUI()">
                </div>
            </div>

            <div class="section-label">🤖 AI Model Seçimi</div>
            <div>
                <label>MODEL — <span style="color: var(--gold);">Kalite ↑ = Hız ↓</span></label>
                <select id="modelSel" onchange="showModelInfo()">
                    <!-- ═══════════ EfficientDet Lite Serisi (Orijinal) ═══════════ -->
                    <optgroup label="── EfficientDet Lite (Dengeli)">
                        <option value="efficientdet_lite0">EfficientDet Lite 0 — En Hızlı (320px)</option>
                        <option value="efficientdet_lite1">EfficientDet Lite 1 — Hızlı (384px)</option>
                        <option value="efficientdet_lite2" selected>EfficientDet Lite 2 — Dengeli (448px) ★</option>
                        <option value="efficientdet_lite3">EfficientDet Lite 3 — Yüksek (512px)</option>
                        <option value="efficientdet_lite4">EfficientDet Lite 4 — Maks. Hassasiyet (640px)</option>
                    </optgroup>
                    <!-- ═══════════ SSD MobileNet Serisi ═══════════ -->
                    <optgroup label="── SSD MobileNet (Hızlı &amp; Hafif)">
                        <option value="ssd_mobilenet_v1">SSD MobileNet V1 — Hızlı (300px)</option>
                        <option value="ssd_mobilenet_v2">SSD MobileNet V2 — Gelişmiş (300px)</option>
                    </optgroup>
                </select>
                <div id="model-info-box" class="model-info">Model seçin...</div>
            </div>

            <div class="section-label">Donanım & Görüntü</div>
            <div class="action-grid">
                <div>
                    <label>DONANIM MODU</label>
                    <select id="hwSel">
                        <option value="GPU">GPU + NPU (Hızlandırılmış)</option>
                        <option value="GPU">Sadece GPU</option>
                        <option value="CPU">Sadece CPU (Güvenli Mod)</option>
                    </select>
                </div>
                <div>
                    <label>ÇÖZÜNÜRLÜK</label>
                    <select id="resSel">
                        <option value="360">360p</option>
                        <option value="480">480p</option>
                        <option value="720" selected>720p (HD)</option>
                        <option value="960">960p</option>
                        <option value="1080">1080p (FHD)</option>
                        <option value="1440">1440p (2K)</option>
                        <option value="2160">2160p (4K)</option>
                    </select>
                </div>
            </div>

            <div>
                <label>KAMERA</label>
                <select id="camSel"></select>
            </div>

            <div style="display: flex; gap: 5px;">
                <button class="danger-btn" style="flex:1" onclick="resetCounter()">SAYACI SIFIRLA</button>
                <button class="danger-btn" style="flex:1; color:#aaa;" onclick="location.reload()">SİSTEMİ YENİLE</button>
            </div>

            <button class="primary-btn" onclick="applySettings()">▶ YENİ AYARLARLA BAŞLAT</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('load-overlay');
        const loadStatus = document.getElementById('load-status');

        // ─── Model Yapılandırması ────────────────────────────────────────────────
        // MediaPipe Tasks-Vision destekli TFLite modelleri.
        // Tüm URL'ler Google'ın resmi CDN'inden alınır (CORS sorunu yok).
        const MODEL_CONFIGS = {
            // EfficientDet Lite serisi: 90 sınıf (COCO), float16
            efficientdet_lite0: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite",
                label: "EfficientDet Lite 0", classes: 90, inputSize: 320,
                info: "<b>EfficientDet Lite 0</b> — En hızlı model. 320×320 giriş. Mobil cihazlar için idealdir. 90 COCO sınıfı."
            },
            efficientdet_lite1: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite1/float16/1/efficientdet_lite1.tflite",
                label: "EfficientDet Lite 1", classes: 90, inputSize: 384,
                info: "<b>EfficientDet Lite 1</b> — Hızlı, hafif model. 384×384 giriş. Lite 0'dan ~%5 daha doğru."
            },
            efficientdet_lite2: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                label: "EfficientDet Lite 2 ★", classes: 90, inputSize: 448,
                info: "<b>EfficientDet Lite 2 ★ (Varsayılan)</b> — Hız/kalite dengesi. 448×448 giriş. Çoğu kullanım için önerilen."
            },
            efficientdet_lite3: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite3/float16/1/efficientdet_lite3.tflite",
                label: "EfficientDet Lite 3", classes: 90, inputSize: 512,
                info: "<b>EfficientDet Lite 3</b> — Yüksek kalite. 512×512 giriş. Orta-üst seviye donanım gerektirir."
            },
            efficientdet_lite4: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite4/float16/1/efficientdet_lite4.tflite",
                label: "EfficientDet Lite 4", classes: 90, inputSize: 640,
                info: "<b>EfficientDet Lite 4</b> — En yüksek kalite EfficientDet. 640×640 giriş. Güçlü GPU gerektirir."
            },
            // SSD MobileNet serisi: 90 sınıf (COCO), TFLite-ready
            ssd_mobilenet_v1: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/mobilenetv2_ssd/float16/1/mobilenetv2_ssd.tflite",
                label: "SSD MobileNet V1", classes: 90, inputSize: 300,
                info: "<b>SSD MobileNet V1</b> — Klasik hızlı model. 300×300 giriş. Gerçek zamanlı kullanım için optimize."
            },
            ssd_mobilenet_v2: {
                url: "https://storage.googleapis.com/mediapipe-models/object_detector/mobilenetv2_ssd/float16/1/mobilenetv2_ssd.tflite",
                label: "SSD MobileNet V2", classes: 90, inputSize: 300,
                info: "<b>SSD MobileNet V2</b> — V1'e göre daha iyi doğruluk, benzer hız. 300×300 giriş. Kenar cihazlar için."
            },
        };

        // ─── Model Bilgi Kutusu ───────────────────────────────────────────────────
        window.showModelInfo = () => {
            const key = document.getElementById('modelSel').value;
            const cfg = MODEL_CONFIGS[key];
            if (cfg) document.getElementById('model-info-box').innerHTML = cfg.info;
        };

        const trLabels = {
            "person": "İnsan", "bicycle": "Bisiklet", "car": "Araba", "motorcycle": "Motosiklet", "airplane": "Uçak",
            "bus": "Otobüs", "train": "Tren", "truck": "Kamyon", "boat": "Tekne", "traffic light": "Trafik Lambası",
            "fire hydrant": "Musluk", "stop sign": "Dur İşareti", "bench": "Bank", "bird": "Kuş", "cat": "Kedi",
            "dog": "Köpek", "horse": "At", "sheep": "Koyun", "cow": "İnek", "elephant": "Fil", "bear": "Ayı",
            "zebra": "Zebra", "giraffe": "Zürafa", "backpack": "Çanta", "umbrella": "Şemsiye", "handbag": "El Çantası",
            "tie": "Kravat", "suitcase": "Bavul", "frisbee": "Frizbi", "skis": "Kayak", "snowboard": "Snowboard",
            "sports ball": "Top", "kite": "Uçurtma", "baseball bat": "Beyzbol Sopası", "skateboard": "Kaykay",
            "surfboard": "Sörf", "tennis racket": "Raket", "bottle": "Şişe", "wine glass": "Kadeh", "cup": "Kupa",
            "fork": "Çatal", "knife": "Bıçak", "spoon": "Kaşık", "bowl": "Kase", "banana": "Muz", "apple": "Elma",
            "sandwich": "Sandviç", "orange": "Portakal", "broccoli": "Brokoli", "carrot": "Havuç", "hot dog": "Sosisli",
            "pizza": "Pizza", "donut": "Donat", "cake": "Kek", "chair": "Sandalye", "couch": "Kanepe", "potted plant": "Saksı",
            "bed": "Yatak", "dining table": "Masa", "toilet": "Tuvalet", "tv": "TV", "laptop": "Laptop",
            "mouse": "Fare", "remote": "Kumanda", "keyboard": "Klavye", "cell phone": "Telefon", "microwave": "Mikrodalga",
            "oven": "Fırın", "toaster": "Ekmek Kızartma", "sink": "Lavabo", "refrigerator": "Buzdolabı", "book": "Kitap",
            "clock": "Saat", "vase": "Vazo", "scissors": "Makas", "teddy bear": "Ayıcık", "hair drier": "Kurutma Mk.", "toothbrush": "Diş Fırçası"
        };

        let detector, isRunning = false, lastTime = performance.now();
        let visionData, sensorData = { alpha: 0, beta: 0 };
        let modes = { select: false, count: false, pin: false, sensors: true };
        let selectedObjectLabel = null;
        let totalCount = 0, objectHistory = [], savedPins = [], lastDetections = [];

        const colors = ["#00ff9d", "#00e5ff", "#ffff00", "#ff00ff", "#ff8800", "#ffffff", "#0088ff", "#aaff00", "#ffaa00", "#ff00aa"];

        function hashCode(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = str.charCodeAt(i) + ((hash << 5) - hash); }
            return Math.abs(hash);
        }

        function getStableColor(label) { return colors[hashCode(label) % colors.length]; }

        window.updateUI = () => {
            document.getElementById('conf-val').innerText = document.getElementById('confSlider').value;
            document.getElementById('sens-val').innerText = document.getElementById('sensSlider').value;
        };

        async function initSensors() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try { await DeviceOrientationEvent.requestPermission(); } catch(e) {}
            }
            window.addEventListener('deviceorientation', (e) => {
                if(modes.sensors) { sensorData.alpha = e.alpha || 0; sensorData.beta = e.beta || 0; }
            });
        }

        async function getCameras() {
            try {
                await navigator.mediaDevices.getUserMedia({ video: true });
                const devices = await navigator.mediaDevices.enumerateDevices();
                const camSel = document.getElementById('camSel');
                camSel.innerHTML = "";
                devices.filter(d => d.kind === 'videoinput').forEach((d, i) => {
                    const opt = document.createElement('option');
                    opt.value = d.deviceId;
                    if(d.label.toLowerCase().includes('back')) opt.selected = true;
                    opt.text = d.label || `Kamera ${i + 1}`;
                    camSel.appendChild(opt);
                });
            } catch (e) {}
        }

        window.toggleMode = (m) => {
            modes[m] = !modes[m];
            if(m === 'pin' && modes[m]) { initSensors(); document.getElementById('dynamic-save-btn').style.display = 'block'; }
            else if(m === 'pin') document.getElementById('dynamic-save-btn').style.display = 'none';
            if(m === 'sensors' && modes[m]) initSensors();
            else if(m === 'sensors' && !modes[m]) { sensorData.alpha = 0; sensorData.beta = 0; }
            document.getElementById(`btn-${m}`).classList.toggle('active', modes[m]);
            document.getElementById(`ind-${m}`).innerText = modes[m] ? (m === 'select' ? '●' : 'ON') : (m === 'select' ? '○' : 'OFF');
            if(m === 'select' && !modes[m]) {
                selectedObjectLabel = null;
                document.getElementById('target-info-tag').style.display = 'none';
            }
        };

        window.resetCounter = () => { totalCount = 0; objectHistory = []; document.getElementById('total-tag').innerText = `TOPLAM SAYI: 0`; };

        window.togglePanel = () => {
            const content = document.getElementById('p-content');
            content.style.display = content.style.display === 'none' ? 'flex' : 'none';
            document.getElementById('toggle-icon').innerText = content.style.display === 'none' ? '▲' : '▼';
        };

        canvas.addEventListener('click', (e) => {
            if(!modes.select) return;
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX - rect.left) * (canvas.width / rect.width);
            const y = (e.clientY - rect.top) * (canvas.height / rect.height);
            lastDetections.forEach(d => {
                const { originX, originY, width, height } = d.boundingBox;
                if(x > originX && x < originX + width && y > originY && y < originY + height) {
                    selectedObjectLabel = d.categories[0].categoryName;
                    const trName = trLabels[selectedObjectLabel] || selectedObjectLabel;
                    const infoTag = document.getElementById('target-info-tag');
                    infoTag.innerText = `HEDEF: ${trName.toUpperCase()} (KIRMIZI)`;
                    infoTag.style.display = 'block';
                    resetCounter();
                }
            });
        });

        window.saveCurrentObjectCoords = () => {
            const target = lastDetections.find(d => !selectedObjectLabel || d.categories[0].categoryName === selectedObjectLabel);
            if(target) {
                const { originX, originY, width, height } = target.boundingBox;
                savedPins.push({ x: originX + width/2, y: originY + height/2, label: target.categories[0].categoryName, a: sensorData.alpha, b: sensorData.beta });
            }
        };

        window.applySettings = async () => {
            isRunning = false;
            overlay.style.display = 'flex';
            loadStatus.innerText = "Sistem Yeniden Başlatılıyor...";
            if(detector) { detector.close(); detector = null; }

            const hwMode = document.getElementById('hwSel').value;
            const modelKey = document.getElementById('modelSel').value;
            const resHeight = parseInt(document.getElementById('resSel').value);
            const confidence = parseInt(document.getElementById('confSlider').value) / 100;
            const deviceId = document.getElementById('camSel').value;
            const modelCfg = MODEL_CONFIGS[modelKey];

            try {
                if(video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { deviceId: deviceId ? {exact: deviceId} : undefined, facingMode: "environment", height: { ideal: resHeight } } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth; 
                    canvas.height = video.videoHeight;
                    document.getElementById('res-tag').innerText = `${video.videoWidth}x${video.videoHeight}`;
                    
                    loadStatus.innerText = `Model Yükleniyor: ${modelCfg.label}...`;
                    
                    if (!visionData) visionData = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.6/wasm");
                    
                    detector = await ObjectDetector.createFromOptions(visionData, {
                        baseOptions: { 
                            modelAssetPath: modelCfg.url,
                            delegate: hwMode
                        },
                        scoreThreshold: confidence, 
                        runningMode: "VIDEO"
                    });

                    // HUD güncelle
                    document.getElementById('hw-tag').innerText = `HW: ${hwMode}`;
                    const modelTag = document.getElementById('model-tag');
                    modelTag.innerText = `MODEL: ${modelCfg.label.replace(' ★','')}`;
                    modelTag.style.display = 'block';

                    overlay.style.display = 'none'; 
                    isRunning = true; 
                    renderLoop();
                };
            } catch (e) { 
                alert("Kamera veya Model Hatası: " + e.message); 
                overlay.style.display = 'none'; 
            }
        };

        function renderLoop(now) {
            if(!isRunning || !detector) return;
            const fps = 1000 / (now - lastTime); lastTime = now;
            if(now % 60 < 10) document.getElementById('fps-tag').innerText = `FPS: ${Math.round(fps)}`;

            try {
                const result = detector.detectForVideo(video, performance.now());
                lastDetections = result.detections;
                
                if(modes.count) {
                    const trackingSens = parseInt(document.getElementById('sensSlider').value);
                    let objectsToCount = selectedObjectLabel 
                        ? lastDetections.filter(d => d.categories[0].categoryName === selectedObjectLabel)
                        : lastDetections;

                    objectsToCount.forEach(det => {
                        const label = det.categories[0].categoryName;
                        const { originX, originY, width, height } = det.boundingBox;
                        const cX = originX + width/2, cY = originY + height/2;
                        let found = objectHistory.findIndex(obj => {
                            const dist = Math.sqrt(Math.pow(cX - obj.x, 2) + Math.pow(cY - obj.y, 2));
                            return dist < trackingSens && obj.label === label;
                        });
                        if(found !== -1) { objectHistory[found].x = cX; objectHistory[found].y = cY; objectHistory[found].t = now; }
                        else { totalCount++; objectHistory.push({ x: cX, y: cY, label: label, t: now }); }
                    });
                    
                    objectHistory = objectHistory.filter(obj => now - obj.t < 1500);
                    document.getElementById('count-tag').innerText = `ANLIK SAYI: ${objectsToCount.length}`;
                    document.getElementById('total-tag').innerText = `TOPLAM SAYI: ${totalCount}`;
                }
                draw(lastDetections);
            } catch (err) {}
            requestAnimationFrame(renderLoop);
        }

        function draw(detections) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            savedPins.forEach(p => {
                const xOff = modes.sensors ? (sensorData.alpha - p.a) * (canvas.width / 50) : 0;
                const yOff = modes.sensors ? (sensorData.beta - p.b) * (canvas.height / 50) : 0;
                ctx.fillStyle = "rgba(255, 0, 0, 0.8)";
                ctx.beginPath(); ctx.arc(p.x + xOff, p.y + yOff, 8, 0, 7); ctx.fill();
            });

            detections.forEach((d) => {
                const { originX, originY, width, height } = d.boundingBox;
                const label = d.categories[0].categoryName;
                const score = Math.round(d.categories[0].score * 100);
                const isTarget = selectedObjectLabel && label === selectedObjectLabel;

                let boxColor, bgColor, textColor;
                if (isTarget) {
                    boxColor = "#ff0000";
                    bgColor = "rgba(15, 0, 0, 0.85)";
                    textColor = "#ff3e3e";
                } else {
                    boxColor = getStableColor(label);
                    bgColor = boxColor;
                    textColor = "#000000";
                }

                ctx.strokeStyle = boxColor;
                ctx.lineWidth = isTarget ? 4 : 2; 
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = bgColor;
                ctx.fillRect(originX, originY - 18, 80, 18);
                
                ctx.fillStyle = textColor; 
                ctx.font = "bold 11px sans-serif";
                ctx.fillText(`%${score} ${trLabels[label] || label}`, originX + 4, originY - 5);
            });
        }

        // Başlangıçta model bilgi kutusunu doldur
        showModelInfo();
        getCameras().then(() => applySettings());
        updateUI();
    </script>
</body>
</html>
