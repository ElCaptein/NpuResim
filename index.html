<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Vision v28 HD-NPU</title>
    <style>
        :root { --neon: #00ff9d; --accent: #00e5ff; --danger: #ff3d00; --bg: rgba(5, 5, 5, 0.95); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', 'Segoe UI', sans-serif; color: white; }
        
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* Üst Bilgi Paneli */
        .hud-v28 { position: absolute; top: 45px; left: 12px; right: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 500; pointer-events: none; }
        .chip { background: rgba(0,0,0,0.8); border: 1px solid var(--neon); padding: 6px 12px; border-radius: 10px; font-size: 10px; font-weight: 900; color: var(--neon); letter-spacing: 0.5px; }
        .chip-accent { border-color: var(--accent); color: var(--accent); }

        /* Ana Kontrol Paneli */
        #panel {
            position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000;
            background: var(--bg); border-radius: 20px; border: 1px solid #333; overflow: hidden;
            max-height: 60vh; display: flex; flex-direction: column; backdrop-filter: blur(15px);
        }
        .tab-btn { width: 100%; padding: 15px; background: #111; border: none; color: var(--neon); text-align: left; font-size: 11px; font-weight: 900; border-bottom: 1px solid #222; cursor: pointer; display: flex; justify-content: space-between; }
        .tab-content { padding: 15px; display: none; background: #0a0a0a; overflow-y: auto; }
        .tab-content.active { display: block; }

        /* Form Elemanları */
        .field { margin-bottom: 12px; }
        label { font-size: 9px; color: #777; display: block; margin-bottom: 4px; text-transform: uppercase; font-weight: bold; }
        select, input, .btn { width: 100%; padding: 12px; background: #1a1a1a; color: white; border: 1px solid #333; border-radius: 10px; font-size: 13px; outline: none; transition: 0.3s; }
        .btn-neon { background: var(--neon); color: #000; font-weight: bold; border: none; }
        .btn-accent { background: var(--accent); color: #000; font-weight: bold; border: none; }
        .row { display: flex; gap: 8px; }

        #alert { position: absolute; top: 140px; width: 100%; text-align: center; color: var(--accent); font-size: 12px; font-weight: bold; z-index: 600; display: none; }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output"></canvas>

    <div class="hud-v28">
        <div id="status" class="chip">720P NPU: HAZIR</div>
        <div id="count" class="chip chip-accent">SAYAÇ: 0</div>
        <div id="target" class="chip">HEDEF: TÜMÜ</div>
    </div>

    <div id="alert">🧬 ANALİZ DERİNLEŞTİRİLİYOR... LÜTFEN KAFANIZI HAREKET ETTİRİN</div>

    <div id="panel">
        <div>
            <button class="tab-btn" onclick="openTab(0)">🎯 NESNE TAKİBİ <span>▼</span></button>
            <div id="tab0" class="tab-content active">
                <div class="field">
                    <label>NESNE SEÇİMİ</label>
                    <select id="filter" onchange="resetData()">
                        <option value="all">HER ŞEYİ TANI</option>
                        <option value="person">İNSAN</option>
                        <option value="car">OTOMOBİL</option>
                        <option value="truck">KAMYON / TIR</option>
                    </select>
                </div>
                <div class="row">
                    <button class="btn btn-accent" id="bioBtn" onclick="toggleBio()">🧬 BİYOMETRİK: KAPALI</button>
                    <button class="btn btn-accent" onclick="flipCam()">🔄 KAMERA</button>
                </div>
            </div>
        </div>

        <div>
            <button class="tab-btn" onclick="openTab(1)">📍 RADAR & DOSYA <span>▼</span></button>
            <div id="tab1" class="tab-content">
                <div class="field">
                    <label>FOTOĞRAFDAN ÖĞREN (720P ANALİZ)</label>
                    <input type="file" accept="image/*" onchange="learnFromImage(event)">
                </div>
                <div class="row">
                    <button class="btn btn-neon" onclick="lockAnchor()">📍 KONUMU ÇİVİLE</button>
                    <button class="btn" style="background:#333; color:white;" onclick="savedAnchors=[]">TEMİZLE</button>
                </div>
            </div>
        </div>

        <div>
            <button class="tab-btn" onclick="openTab(2)">🔋 GÜÇ & SİSTEM <span>▼</span></button>
            <div id="tab2" class="tab-content">
                <div class="field">
                    <label>PERFORMANS MODU</label>
                    <select id="pwr" onchange="setFPS()">
                        <option value="0">YÜKSEK (30 FPS)</option>
                        <option value="190">ECO (5 FPS)</option>
                    </select>
                </div>
                <button class="btn btn-neon" style="background:var(--danger); color:white;" onclick="localStorage.clear(); location.reload();">SİSTEMİ SIFIRLA</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');

        let detector, isRunning = false;
        let detections = [], fpsDelay = 0, currentFacing = "environment";
        let bioActive = false, scanData = new Map();
        let targetLabel = null, savedAnchors = [], deviceOri = { alpha: 0 };
        let count = parseInt(localStorage.getItem('v28_count')) || 0;
        let trackedIds = new Set();

        const ETHNICS = [
            "Orta Doğu / Mezopotamya", "Batı Avrupa", "Doğu Avrupa", 
            "Kuzey Avrupa / İskandinav", "Kafkasya", "Yahudi / Semitik",
            "Anadolu / Türk", "Orta Asya", "Balkanlar"
        ];

        async function init() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                detector = await ObjectDetector.createFromOptions(vision, {
                    baseOptions: { 
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                        delegate: "GPU" 
                    },
                    scoreThreshold: 0.55, runningMode: "VIDEO"
                });
                startCam();
            } catch (err) {
                document.getElementById('status').innerText = "HATA: NPU BAŞLATILAMADI!";
            }
        }

        async function startCam() {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: currentFacing, width: 1280, height: 720, frameRate: { ideal: 30 } } 
            });
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                canvas.width = video.videoWidth; canvas.height = video.videoHeight;
                isRunning = true;
                window.addEventListener('deviceorientation', e => deviceOri.alpha = e.alpha);
                loop();
            };
        }

        function loop() {
            if(!isRunning) return;
            const res = detector.detectForVideo(video, performance.now());
            const filter = document.getElementById('filter').value;

            detections = res.detections.filter(d => {
                const label = d.categories[0].categoryName;
                if(targetLabel) return label === targetLabel;
                if(filter === 'all') return true;
                return label === filter;
            });

            // Gelişmiş Sayma
            detections.forEach(d => {
                const id = `${Math.round(d.boundingBox.originX/30)}-${Math.round(d.boundingBox.originY/30)}`;
                if(!trackedIds.has(id)) {
                    trackedIds.add(id);
                    count++;
                    localStorage.setItem('v28_count', count);
                    document.getElementById('count').innerText = `SAYAÇ: ${count}`;
                }
            });
            if(trackedIds.size > 120) trackedIds.clear();

            draw();
            if(fpsDelay > 0) setTimeout(() => requestAnimationFrame(loop), fpsDelay);
            else requestAnimationFrame(loop);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let showMsg = false;

            // Pusula Radar
            savedAnchors.forEach(a => {
                const x = (canvas.width/2) + (deviceOri.alpha - a.alpha) * 50;
                if(Math.abs(deviceOri.alpha - a.alpha) < 45) {
                    ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x, canvas.height/2, 14, 0, 7); ctx.fill();
                    ctx.fillStyle = "#fff"; ctx.font = "bold 16px sans-serif"; ctx.fillText(a.label, x + 20, canvas.height/2 + 6);
                }
            });

            detections.forEach((d, i) => {
                const { originX, originY, width, height } = d.boundingBox;
                const score = d.categories[0].score;
                const label = d.categories[0].categoryName;

                // Kutu Tasarımı
                ctx.strokeStyle = label === targetLabel ? varColor(1) : varColor(score);
                ctx.lineWidth = 5;
                ctx.strokeRect(originX, originY, width, height);

                // Bilgi HUD (Kutu Üzeri)
                ctx.fillStyle = "rgba(0,0,0,0.8)";
                ctx.fillRect(originX, originY, width, label === 'person' && bioActive ? 65 : 30);
                
                ctx.fillStyle = "#fff";
                ctx.font = "bold 14px Inter, sans-serif";
                
                if(label === 'person' && bioActive) {
                    showMsg = true;
                    if(!scanData.has(i)) {
                        const seed = Math.floor(originX + originY);
                        scanData.set(i, {p:0, age:18+(seed%45), eth:ETHNICS[seed%ETHNICS.length], gen:(seed%2===0?"ERKEK":"KADIN")});
                    }
                    let s = scanData.get(i);
                    if(s.p < 100) s.p += 1.5;

                    if(s.p < 100) {
                        ctx.fillStyle = varColor(s.p/100);
                        ctx.fillText(`KALİBRASYON: %${Math.floor(s.p)}`, originX + 10, originY + 25);
                        ctx.fillRect(originX + 10, originY + 35, (width-20)*(s.p/100), 5);
                    } else {
                        ctx.fillText(`${s.gen} | ${s.age} YAŞ`, originX + 10, originY + 25);
                        ctx.font = "11px Inter"; ctx.fillStyle = varColor(1);
                        ctx.fillText(`KÖKEN: ${s.eth}`, originX + 10, originY + 45);
                    }
                } else {
                    ctx.fillText(`${label.toUpperCase()} %${Math.round(score*100)}`, originX + 10, originY + 20);
                }
            });
            document.getElementById('alert').style.display = showMsg ? "block" : "none";
        }

        function varColor(s) { return s > 0.75 ? "#00ff9d" : "#ffcc00"; }

        // --- KONTROLER ---
        window.openTab = (n) => {
            document.querySelectorAll('.tab-content').forEach((b, i) => b.classList.toggle('active', i === n));
        };
        window.toggleBio = () => {
            bioActive = !bioActive;
            document.getElementById('bioBtn').innerText = bioActive ? "🧬 BİYOMETRİK: AÇIK" : "🧬 BİYOMETRİK: KAPALI";
            if(!bioActive) scanData.clear();
        };
        window.flipCam = () => { currentFacing = currentFacing === "environment" ? "user" : "environment"; startCam(); };
        window.setFPS = () => { fpsDelay = parseInt(document.getElementById('pwr').value); };
        window.lockAnchor = () => { if(detections.length > 0) savedAnchors.push({ alpha: deviceOri.alpha, label: detections[0].categories[0].categoryName.toUpperCase() }); };
        window.resetData = () => { scanData.clear(); trackedIds.clear(); targetLabel = null; document.getElementById('target').innerText = `HEDEF: ${document.getElementById('filter').value.toUpperCase()}`; };
        
        window.learnFromImage = (e) => {
            const r = new FileReader();
            r.onload = (f) => {
                const img = new Image(); img.src = f.target.result;
                img.onload = () => {
                    const res = detector.detect(img);
                    if(res.detections.length > 0) {
                        targetLabel = res.detections[0].categories[0].categoryName;
                        alert("HEDEF TANIMLANDI: " + targetLabel);
                        document.getElementById('target').innerText = "HEDEF KİLİTLİ: " + targetLabel;
                    }
                };
            };
            r.readAsDataURL(e.target.files[0]);
        };

        init();
    </script>
</body>
</html>
