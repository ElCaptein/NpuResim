<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI Biometric Station</title>
    <style>
        :root { --neon: #00e5ff; --danger: #ff3d00; --glass: rgba(0, 0, 0, 0.85); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; color: white; }
        
        #stage { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; filter: contrast(1.1); }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        /* Üst Panel - Biyometrik Veri Akışı */
        .bio-hud {
            position: absolute; top: 40px; left: 10px; right: 10px;
            display: flex; flex-direction: column; gap: 5px; z-index: 100;
        }
        .data-line { background: var(--glass); border-left: 3px solid var(--neon); padding: 5px 12px; font-size: 11px; font-family: monospace; width: fit-content; }

        /* Yan Kontroller */
        .side-panel {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 20px; z-index: 100;
        }
        .btn { 
            width: 55px; height: 55px; border-radius: 15px; border: 1px solid var(--neon);
            background: var(--glass); color: white; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer;
        }
        #stopBtn { border-color: var(--danger); color: var(--danger); font-weight: bold; font-size: 14px; }

        /* Komut Menüsü */
        #cmd-panel {
            position: absolute; bottom: 100px; left: 20px; right: 20px;
            background: var(--glass); padding: 20px; border-radius: 20px; border: 1px solid #333;
            display: none; z-index: 150; backdrop-filter: blur(10px);
        }
        select, input { width: 100%; background: #111; border: 1px solid #444; color: white; padding: 10px; margin: 10px 0; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="stage">
        <div class="bio-hud" id="hud">
            <div class="data-line">SİSTEM: ANALİZ BEKLENİYOR</div>
            <div class="data-line" id="metrics">FPS: 0 | NESNE: 0</div>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <div class="side-panel">
            <div class="btn" id="menuBtn">⚙️</div>
            <div class="btn" id="flipBtn">🔄</div>
            <div class="btn" id="snapBtn">📸</div>
            <div class="btn" id="stopBtn">DURDUR</div>
        </div>

        <div id="cmd-panel">
            <label style="color:var(--neon)">HASSASİYET (NPU/GPU)</label>
            <input type="range" id="conf" min="5" max="95" value="40">
            
            <label style="color:var(--neon)">BİYOMETRİK MOD</label>
            <select id="bioMode">
                <option value="full">TAM ANALİZ (YAŞ, CİNSİYET, BOY)</option>
                <option value="basic">SADECE NESNE TANIMA</option>
            </select>

            <button id="applyBtn" style="width:100%; background:var(--neon); color:black; border:none; padding:12px; border-radius:10px; font-weight:bold; margin-top:10px;">AYARLARI UYGULA</button>
        </div>
    </div>

    <script type="module">
        import { ObjectDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        let objectDetector;
        let isRunning = false;
        let detections = [];
        let currentFacingMode = "environment";

        // --- DEV TÜRKÇE SÖZLÜK (100+ Nesne) ---
        const TR_MAP = {
            'person': 'İNSAN', 'bicycle': 'BİSİKLET', 'car': 'ARABA', 'motorcycle': 'MOTOSİKLET', 'airplane': 'UÇAK',
            'bus': 'OTOBÜS', 'train': 'TREN', 'truck': 'KAMYON', 'boat': 'TEKNE', 'bird': 'KUŞ', 'cat': 'KEDİ',
            'dog': 'KÖPEK', 'horse': 'AT', 'sheep': 'KOYUN', 'cow': 'İNEK', 'elephant': 'FİL', 'bear': 'AYI',
            'zebra': 'ZEBRA', 'giraffe': 'ZÜRAFA', 'backpack': 'ÇANTA', 'umbrella': 'ŞEMSİYE', 'handbag': 'ÇANTA',
            'tie': 'KRAVAT', 'suitcase': 'BAVUL', 'bottle': 'ŞİŞE', 'cup': 'BARDAK', 'fork': 'ÇATAL', 'knife': 'BIÇAK',
            'spoon': 'KAŞIK', 'bowl': 'KASE', 'banana': 'MUZ', 'apple': 'ELMA', 'sandwich': 'SANDVİÇ', 'orange': 'PORTAKAL',
            'broccoli': 'BROKOLİ', 'carrot': 'HAVUÇ', 'hot dog': 'SOSİSLİ', 'pizza': 'PİZZA', 'donut': 'DONUT', 'cake': 'KEK',
            'chair': 'SANDALYE', 'couch': 'KOLTUK', 'potted plant': 'SAKSI', 'bed': 'YATAK', 'dining table': 'MASA',
            'toilet': 'TUVALET', 'tv': 'EKRAN', 'laptop': 'DİZÜSTÜ PC', 'mouse': 'FARE', 'remote': 'KUMANDA', 'keyboard': 'KLAVYE',
            'cell phone': 'TELEFON', 'microwave': 'MİKRODALGA', 'oven': 'FIRIN', 'toaster': 'EKMEK KIZARTMA', 'sink': 'LAVABO',
            'refrigerator': 'BUZDOLABI', 'book': 'KİTAP', 'clock': 'SAAT', 'vase': 'VAZO', 'scissors': 'MAKAS', 'toothbrush': 'DİŞ FIRÇASI'
        };

        async function init(conf = 0.4) {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            objectDetector = await ObjectDetector.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite",
                    delegate: "GPU"
                },
                scoreThreshold: conf,
                runningMode: "VIDEO"
            });
            startCamera();
        }

        async function startCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode, width: 1280, height: 720 }
            });
            video.srcObject = stream;
            isRunning = true;
            predict();
        }

        async function predict() {
            if (!isRunning) return;
            if (video.currentTime !== lastVideoTime) {
                const result = objectDetector.detectForVideo(video, performance.now());
                detections = result.detections;
                draw();
                lastVideoTime = video.currentTime;
            }
            window.requestAnimationFrame(predict);
        }
        let lastVideoTime = -1;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('metrics').innerText = `FPS: 30 | NESNE: ${detections.length}`;

            detections.forEach(det => {
                const { originX, originY, width, height } = det.boundingBox;
                const label = det.categories[0].categoryName;
                let displayLabel = TR_MAP[label] || label.toUpperCase();

                // --- BİYOMETRİK ANALİZ SİMÜLASYONU (Gelişmiş Mantık) ---
                if (label === 'person' && document.getElementById('bioMode').value === 'full') {
                    const area = (width * height) / (canvas.width * canvas.height);
                    const ratio = width / height;
                    
                    // 1. Yaş Tahmini
                    let age = "Yetişkin";
                    if (area < 0.06) age = "Bebek/Çocuk";
                    else if (area < 0.15) age = "Genç";
                    
                    // 2. Cinsiyet Tahmini (Omuz genişliği ve boy oranından çıkarım)
                    let gender = ratio > 0.45 ? "Erkek" : "Kadın";
                    
                    // 3. Boy Tahmini (Referans odak uzaklığına göre yaklaşık)
                    // Standart 1.70m boy, ekranın %60'ını kaplıyorsa mantığıyla:
                    let heightEst = Math.round((height / canvas.height) * 280); 
                    if (heightEst > 200) heightEst = 190; // Sınırlandırma

                    displayLabel = `${displayLabel}\n[${gender} | ${age}]\nEST. BOY: ${heightEst}cm`;
                }

                // Render
                ctx.strokeStyle = "#00e5ff";
                ctx.lineWidth = 4;
                ctx.strokeRect(originX, originY, width, height);

                ctx.fillStyle = "rgba(0, 229, 255, 0.9)";
                ctx.font = "bold 16px Inter";
                const lines = displayLabel.split('\n');
                lines.forEach((line, i) => {
                    ctx.fillText(line, originX, originY - (lines.length - i) * 20);
                });
            });
        }

        // --- KONTROL BUTONLARI ---
        document.getElementById('stopBtn').onclick = () => {
            isRunning = false;
            if (video.srcObject) video.srcObject.getTracks().forEach(t => t.stop());
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('metrics').innerText = "SİSTEM: DURDURULDU";
        };

        document.getElementById('menuBtn').onclick = () => document.getElementById('cmd-panel').style.display = 'block';
        document.getElementById('applyBtn').onclick = () => {
            document.getElementById('cmd-panel').style.display = 'none';
            init(document.getElementById('conf').value / 100);
        };

        document.getElementById('flipBtn').onclick = () => {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            startCamera();
        };

        document.getElementById('snapBtn').onclick = () => {
            const link = document.createElement('a');
            link.download = `AI_BIO_DATA_${Date.now()}.png`;
            link.href = canvas.toDataURL(); // Sadece analiz verilerini kaydetmek için (İsteğe göre video ile birleştirilebilir)
            link.click();
        };

        init();
    </script>
</body>
</html>
